/* ---- 見るだけ版：自分の行き先（2026-10-14 ユーザー要望「要は自分の行き先がわかるのが優先」）----
   初回に名簿から自分の名前を選んでもらい（打たせない。同じ名字の人を取り違えないため）、このスマホに覚える（localStorage haichi_me）。
   表の中の自分の名前のマスを赤く目立たせ、表の上に「○○さん：現場名（昼勤）」の1行を出す。
   担当の欄（名字だけ）は、社員で 同じ名字の社員がいないときだけ自分とみなす */
var ME = null;
try{ ME = localStorage.getItem("haichi_me") || null; }catch(e){}
function meSurname(n){ return String(n || "").trim().split(/[\s　]+/)[0]; }
function meIsTan(n){
  var sur = meSurname(n), all = MASTER.作業員 || [];
  var me = all.filter(function(w){ return nk(w.氏名) === nk(n); })[0];
  if(!me || !me.社員 || sur.length < 2) return false;
  return all.filter(function(w){ return w.社員 && meSurname(w.氏名) === sur; }).length === 1;
}
function mePlaces(n){
  var key = nk(n), tan = meIsTan(n) ? nk(meSurname(n)) : null, out = [];
  var kb = function(s){ return String(s.区分 || "").replace(/[（）()]/g, ""); };
  (D.現場 || []).forEach(function(s){
    if(!s || (VIEWER && !VIDLE && !siteHasWorker(s))) return;      /* 表で出さない現場（作業員なし）は行き先にも出さない */
    var nm = s.現場名 || "現場";
    if((s.作業員 || []).some(function(w){ return nk(w.氏名) === key; })) out.push(nm + (kb(s) ? "（" + kb(s) + "）" : ""));
    else if(tan && nk(s.担当) === tan) out.push(nm + (kb(s) ? "（" + kb(s) + "・担当）" : "（担当）"));
  });
  (D.外注 || []).forEach(function(b){ if(b && tan && nk(b.担当) === tan) out.push((b.現場名 || "外注") + "（外注の担当）"); });
  (D.本社 || []).forEach(function(o){ if(o && nk(o.氏名) === key) out.push(o.記載 || "本社"); });
  ((D.機材センター || {}).人 || []).forEach(function(p){ if(p && nk(p.氏名) === key) out.push("機材センター"); });
  (D.休み || []).forEach(function(row){ (row || []).forEach(function(v){
    var sp = splitComment(v); if(v && nk(sp.name) === key) out.push("休み" + (sp.note ? "（" + sp.note + "）" : "")); }); });
  return out.filter(function(x, i){ return out.indexOf(x) === i; });
}
function meMark(){
  var bar = $("#meBar");
  if(!bar) return;
  if(!ME){ bar.innerHTML = '自分の名前を選ぶと、行き先が赤く目立ちます。<button class="btn" data-me="pick">名前を選ぶ</button>'; if(VIEWER) fitSheet(); return; }
  var key = nk(ME), tan = meIsTan(ME) ? nk(meSurname(ME)) : null;
  Array.prototype.forEach.call(document.querySelectorAll("#sheet td"), function(td){
    var nmEl = td.querySelector(".nm"), txt = nk(nmEl ? nmEl.textContent : td.textContent);
    var hit = txt && (txt === key || (tan && td.dataset.k === "担当" && txt === tan));
    td.classList.toggle("me", !!hit);
  });
  var pl = D && D.日付 ? mePlaces(ME) : [];
  bar.innerHTML = "<b>" + esc(ME) + "</b> さん：" + (pl.length ? "<b>" + pl.map(esc).join("、") + "</b>" : "この表には名前がありません") +
    '<button class="btn" data-me="pick">名前を変える</button>';
  if(VIEWER) fitSheet();
}
function mePicker(){
  var old = document.querySelector(".mdlg.mepk");
  if(old) old.remove();
  var ws = (MASTER.作業員 || []).slice().sort(function(a, b){ return (b.社員 - a.社員) || ((b.回数 || 0) - (a.回数 || 0)); });
  var dlg = document.createElement("div");
  dlg.className = "mdlg mepk";
  dlg.innerHTML = '<div class="mbox" style="width:min(620px,96vw)"><h2>自分の名前を選んでください</h2>' +
    '<div class="mbody" style="font-size:15px;line-height:1.7;padding:10px 12px">' +
    "選んだ名前は、表の中で赤く目立ちます（このスマホだけに覚えます。あとで変えられます）。" +
    '<div class="mepick">' + ws.map(function(w){ return '<button data-n="' + esc(w.氏名) + '">' + esc(w.氏名) + "</button>"; }).join("") + "</div>" +
    '<div style="text-align:right"><button class="btn" data-n="">選ばない</button></div></div></div>';
  document.body.appendChild(dlg);
  dlg.addEventListener("click", function(e){
    var t = e.target.closest ? e.target.closest("button[data-n]") : null;
    if(!t) return;
    ME = t.dataset.n || null;
    try{ if(ME) localStorage.setItem("haichi_me", ME); else localStorage.removeItem("haichi_me"); }catch(err){}
    dlg.remove();
    meMark();
    var first = document.querySelector("#sheet td.me");
    if(first) first.scrollIntoView({block: "center", inline: "center"});
  });
}
function viewerMe(){
  var bar = document.createElement("div");
  bar.id = "meBar";
  bar.className = "mebar noprint";
  document.querySelector(".bar").appendChild(bar);      /* 上の帯の右（008.0018 ユーザー指定：一番上に） */
  bar.addEventListener("click", function(e){ if(e.target.dataset && e.target.dataset.me === "pick") mePicker(); });
  /* 描くたびに目立たせ直す */
  var r0 = render, seen = "";
  render = function(){
    r0.apply(this, arguments); viewerTitle(); idleBtn(); viewerFold(); viewerCols(); meMark();
    /* 日を開いたとき（予定／確定を替えたときも）1回だけ、自分のマスが見えるところまで動かす */
    var key = (D && D.日付) + MODE, td = document.querySelector("#sheet td.me");
    if(td && key !== seen){ seen = key; setTimeout(function(){ td.scrollIntoView({block: "center", inline: "center"}); }, 50); }
  };
  /* 会社のアカウントで入った人は、表示名が名簿の名前と合えば その人にする（2026-10-14 ユーザー要望）。
     名字と名前の順が逆の表示名（「和也 〇〇」）、沢／澤 の違いも合わせる */
  if(!ME){
    var who = window.HAICHI_VIEWER && window.HAICHI_VIEWER.who ? window.HAICHI_VIEWER.who() : "";
    if(who){
      var key = function(s){ return nk(s).replace(/沢/g, "澤"); };
      var parts = String(who).trim().split(/[\s　]+/), cands = [key(who)];
      if(parts.length === 2) cands.push(key(parts[1] + parts[0]));
      var hit = (MASTER.作業員 || []).filter(function(w){ return cands.indexOf(key(w.氏名)) >= 0; })[0];
      if(hit){ ME = hit.氏名; try{ localStorage.setItem("haichi_me", ME); }catch(e){} }
    }
  }
  if(!ME) setTimeout(mePicker, 600);       /* 初回だけ（表が出てから） */
}
/* ---- 見るだけ版：2本指で表だけを拡大縮小（上の帯は大きさを変えず上に止めておく。2026-10-14 ユーザー要望）----
   ページそのものの拡大は止め（viewport の user-scalable=no・iOS は gesturestart を止める）、表の倍率 VZ を変える。
   1本指はふつうのスクロール（縦も横も表の枠。008.0018 で見出し行を止めるため縦も枠の中に） */
function viewerPinch(){
  try{ VZ = Math.min(2, Math.max(.1, +localStorage.getItem("haichi_zoom") || 1)); }catch(e){}
  var sb = $("#sheetbox"), g = null;
  var dist = function(t){ return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); };
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
  sb.addEventListener("touchstart", function(e){
    if(e.touches.length !== 2) return;
    var t = $("#sheet"), r = t.getBoundingClientRect(), z = parseFloat(t.style.zoom) || 1;
    var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2, my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    g = {d0: dist(e.touches), vz0: z, cx: (mx - r.left) / z, cy: (my - r.top) / z, mx: mx, my: my};
  }, {passive: true});
  sb.addEventListener("touchmove", function(e){
    if(!g || e.touches.length !== 2) return;
    e.preventDefault();
    VZ = Math.min(2, Math.max(VZ_MIN, g.vz0 * dist(e.touches) / g.d0));
    fitSheet();
    /* 指の間の点が同じところに来るよう、表の枠を動かす */
    var t = $("#sheet"), r = t.getBoundingClientRect(), z = parseFloat(t.style.zoom) || 1;
    sb.scrollLeft += (r.left + g.cx * z) - g.mx;
    sb.scrollTop += (r.top + g.cy * z) - g.my;
  }, {passive: false});
  sb.addEventListener("touchend", function(e){
    if(!g || e.touches.length >= 2) return;
    g = null;
    try{ localStorage.setItem("haichi_zoom", VZ); }catch(err){}
  });
}
/* ---- 見るだけ版：文字の大きさ（2026-10-14 ユーザー要望：ピンチとは別に選べるように）----
   上の帯の「文字」で 小・中・大・特大。表の字（--vf 倍）と行の高さが変わり、収まらない字は折り返す。このスマホに覚える */
var VF_SIZES = [["小", 1], ["中", 1.2], ["大", 1.45], ["特大", 1.75]];
function viewerFont(){
  var vf = 1.2;
  try{ vf = +localStorage.getItem("haichi_vf") || 1.2; }catch(e){}
  var sel = document.createElement("select");
  sel.className = "vfsel";
  sel.title = "表の文字の大きさ";
  sel.innerHTML = VF_SIZES.map(function(s){ return '<option value="' + s[1] + '"' + (s[1] === vf ? " selected" : "") + ">文字：" + s[0] + "</option>"; }).join("");
  var apply = function(v){ document.body.style.setProperty("--vf", v); fitSheet(); };
  apply(vf);
  sel.onchange = function(){
    var v = +sel.value;
    try{ localStorage.setItem("haichi_vf", v); }catch(e){}
    apply(v);
    var td = document.querySelector("#sheet td.me");
    if(td) td.scrollIntoView({block: "center", inline: "center"});
  };
  $("#mFix").insertAdjacentElement("afterend", sel);
  var tt = document.createElement("div");
  tt.className = "vtitle";
  tt.id = "vTitle";
  sel.insertAdjacentElement("afterend", tt);
  /* 稼働していない現場（作業員なし）を 隠す⇔出す（008.0019 ユーザー指定） */
  var ib = document.createElement("button");
  ib.className = "btn vidle";
  ib.id = "vIdle";
  ib.hidden = true;
  ib.onclick = function(){
    VIDLE = !VIDLE;
    try{ localStorage.setItem("haichi_idle", VIDLE ? "1" : "0"); }catch(e){}
    render();
  };
  sel.insertAdjacentElement("afterend", ib);
}
/* 見るだけ版：空の行は折りたたむ（008.0018 ユーザー指定）。
   見出しの行と、縦につながったマス（rowspan。機材センターの作業内容）の始まりの行は残す */
var VIDLE = false;      /* true＝稼働していない現場も出す（このスマホに覚える haichi_idle） */
try{ VIDLE = localStorage.getItem("haichi_idle") === "1"; }catch(e){}
function idleCount(){ return ((D && D.現場) || []).filter(function(s){ return s && s.現場名 && !siteHasWorker(s); }).length; }
function idleBtn(){
  var b = $("#vIdle");
  if(!b) return;
  var n = idleCount();
  b.hidden = !n && !VIDLE;
  b.textContent = VIDLE ? "稼働していない現場を隠す" : "稼働していない現場を出す（" + n + "）";
  b.classList.toggle("on", VIDLE);
}
function siteHasWorker(s){ return !!s && (s.作業員 || []).some(function(w){ return w && String(w.氏名 || "").trim(); }); }
function viewerFold(){
  var rows = document.querySelectorAll("#sheet tr");
  for(var i = 0; i < rows.length; i++){
    var tr = rows[i];
    if(tr.classList.contains("r1") || tr.classList.contains("hdr") || tr.classList.contains("gaihd") || tr.classList.contains("cenhd")) continue;
    var empty = Array.prototype.every.call(tr.cells, function(td){ return td.rowSpan > 1 ? false : !td.textContent.trim(); });
    /* 作業員が行っていない現場も出さない（008.0019 ユーザー指定。担当が行くなら外注の欄に名前がある） */
    /* 上の帯のボタンで 隠す⇔出す を切り替えられる（VIDLE。はじめは隠す） */
    if(tr.dataset.rk === "site" && !VIDLE && !siteHasWorker(D.現場[+tr.dataset.ri])) empty = true;
    tr.classList.toggle("vempty", empty);
  }
}
/* 見るだけ版：その日に使っていない列は出さない（008.0019 ユーザー指定：空いた作業員の列・空の作業内容）。
   対象は作業員の1列目（G）から右。字の入ったマスがある列は残す。何列にもまたがるマス（作業内容・外注業者など）は
   左から3列までを残す（字が細い1列に押し込まれないように）。見出しの行（隠した表題の行・1〜10・外注・機材センター／休み）は数えない */
function viewerCols(){
  var t = $("#sheet");
  if(!t) return;
  var cols = t.querySelectorAll("colgroup col"), N = cols.length, FIRST = 6;   /* 0 始まり。6 = G列 */
  /* 行またぎ（rowspan）を考えて、マスごとに何列目から何列目かを出す */
  var grid = [], cells = [];
  Array.prototype.forEach.call(t.rows, function(tr, r){
    grid[r] = grid[r] || [];
    var c = 0;
    Array.prototype.forEach.call(tr.cells, function(td){
      while(grid[r][c]) c++;
      var cs = td.colSpan || 1, rs = td.rowSpan || 1;
      for(var y = 0; y < rs; y++){ grid[r + y] = grid[r + y] || []; for(var x = 0; x < cs; x++) grid[r + y][c + x] = 1; }
      cells.push({td: td, c0: c, c1: c + cs - 1, label: /(^| )(r1|hdr|gaihd|cenhd)( |$)/.test(tr.className)});
      c += cs;
    });
  });
  var need = [];
  for(var c = 0; c < N; c++) need[c] = c < FIRST;
  cells.forEach(function(o){
    if(o.label || !o.td.textContent.trim()) return;
    for(var x = o.c0; x <= Math.min(o.c1, o.c0 + 2); x++) need[x] = true;
  });
  var units = 0;
  Array.prototype.forEach.call(cols, function(col, c){
    if(col.dataset.w == null) col.dataset.w = col.style.width;
    col.style.width = need[c] ? col.dataset.w : "0";
    if(need[c]) units += c === 1 ? 2 : c === 2 ? 0 : 1;      /* 見るだけ版は B が2列分・C（コード）は 0 */
  });
  t.style.width = "calc(var(--colW) * " + units + ")";
  cells.forEach(function(o){
    var off = true;
    for(var x = o.c0; x <= o.c1; x++) if(need[x]) off = false;
    o.td.classList.toggle("vhcol", off);
  });
}
/* 見るだけ版の表題（上の帯）。予定は「人員配置予定表（閲覧用）」、確定は「人員配置表（確定・閲覧用）」 */
function viewerTitle(){
  var el = $("#vTitle");
  if(el) el.textContent = MODE === "確定" ? "人員配置表（確定・閲覧用）" : "人員配置予定表（閲覧用）";
}
if(VIEWER){
  /* 見るだけ版：いつも保護。このPCへの保存・バックアップの声かけはしない */
  document.body.classList.add("viewer");
  document.querySelector(".bar b").textContent = "配置表（見るだけ）";
  document.title = "配置表（見るだけ）";
  var vh = document.createElement("div");
  vh.className = "vhint noprint";
  vh.textContent = "📱 表は2本指で広げると大きくなります。日付を押すとカレンダーで日を選べます。";
  $("#sheetbox").parentNode.insertBefore(vh, $("#sheetbox"));
  viewerMe();
  viewerPinch();
  viewerFont();
  setProtect(true);
  /* LINE で送ったリンク（?d=2026-10-15&k=予定）なら その日を開く。まだ届いていなければ知らせて いちばん新しい日 */
  var q = new URLSearchParams(location.search), qd = q.get("d") || "", qk = q.get("k") === "確定" ? "確定" : "予定";
  /* 見るだけ版は はじめに予定を出す（2026-10-14 ユーザー指定）：今日以降でいちばん新しい予定（明日の予定ができていれば明日、
     まだなら今日）。今日以降が無ければ いちばん新しい予定 */
  var openPlan = function(){
    var y = todayStr().slice(0, 4), ny = String(+y + 1), today = todayStr();
    return vIndex().catch(function(){}).then(function(){ return Promise.all([nasLoad("予定", y), nasLoad("予定", ny)]); }).then(function(){
      var all = Object.assign({}, nasMap("予定", y), nasMap("予定", ny));
      var ks = Object.keys(all).sort(), up = ks.filter(function(k){ return k >= today; });
      var k = up.length ? up[up.length - 1] : ks[ks.length - 1];
      if(k){ openNas(k, "予定", all[k], true); return; }
      return openStartDay();
    }).catch(function(){ openStartDay(); });
  };
  if(/^\d{4}-\d\d-\d\d$/.test(qd)){
    vIndex().catch(function(){}).then(function(){ return nasLoad(qk, qd.slice(0, 4)); }).then(function(){
      var nm = nasMap(qk, qd.slice(0, 4));
      if(nm[qd]){ openNas(qd, qk, nm[qd], true); return; }
      vh.textContent = "⚠ " + fmtDayBtn(qd) + " の" + qk + "は、まだここに届いていません。しばらくしてから開き直してください（いまは いちばん近い予定を出しています）。";
      vh.style.cssText = "display:block;color:#b00020;font-weight:600";
      return openPlan();
    }).catch(function(){ openPlan(); });
  }else openPlan();
}else{
  setProtect(true);
  openStartDay();
  updateKeepBar();
  scheduleAsk();
}
</script>
<script>
/* 名簿を読んでから本体を動かす（本体は起動のときに window.MASTER を使う） */
(function(){
  var V = window.HAICHI_VIEWER;
  var main = Array.prototype.slice.call(document.querySelectorAll('script[type="text/x-haichi-main"]'));
  var msg = document.createElement("div");
  msg.id = "bootMsg";
  msg.style.cssText = "padding:24px;font-size:16px;color:#333";
  msg.textContent = "配置表を読み込んでいます…";
  document.body.insertBefore(msg, document.body.firstChild);
  var go = function(){
    msg.textContent = "配置表を読み込んでいます…";
    return V.text("master.js").then(function(t){
      V.run(t);
      main.forEach(function(s){ var x = document.createElement("script"); x.textContent = s.textContent; document.body.appendChild(x); });
      msg.remove();
    });
  };
  Promise.resolve(V.ready()).then(function(ok){
    if(ok) return go();
    /* 入口：合言葉（LINE のグループで伝えたもの）／会社のアカウント */
    var bs = "font-size:18px;padding:10px 22px;border:0;border-radius:6px;color:#fff;";
    msg.innerHTML = '<div style="max-width:520px;line-height:1.8">' +
      '<div style="font-size:20px;font-weight:700;margin-bottom:8px">配置表（見るだけ）</div>' +
      (V.changed ? '<div style="color:#b00020;font-weight:600">合言葉が変わりました。新しい合言葉を入れてください。</div>' : "") +
      '<div><b>合言葉</b>（ひらがな6文字）を入れてください。<br>合言葉は、LINE のグループ「ハシックス」に流れている<b>いちばん新しい配置表の知らせ</b>に書いてあります。' +
      '<br>このスマホが覚えるので、次からは入れなくても見られます（合言葉が月に1回変わったときだけ入れ直します）。</div>' +
      '<input id="bootPw" autocomplete="off" lang="ja" style="font-size:24px;padding:6px 10px;width:9em;letter-spacing:.2em;margin:8px 0" placeholder="あいうえお">' +
      '<div><button id="bootPwGo" style="' + bs + 'background:#06C755">見る</button></div>' +
      '<div id="bootPwMsg" style="color:#b00020;min-height:1.8em"></div>' +
      '<div style="margin-top:18px;padding-top:10px;border-top:1px solid #ddd;font-size:14px;color:#555">会社のアカウントをお持ちの方は' +
      '<button id="bootSignIn" style="font-size:14px;padding:4px 12px;margin-left:8px;background:#0072B2;color:#fff;border:0;border-radius:4px">会社のアカウントでサインイン</button></div></div>';
    var inp = document.getElementById("bootPw"), out = document.getElementById("bootPwMsg"), btn = document.getElementById("bootPwGo");
    var tryPw = function(){
      if(V.norm(inp.value).length !== 6){ out.textContent = "合言葉はひらがな6文字です"; return; }
      btn.disabled = true; out.style.color = "#333"; out.textContent = "確かめています…";
      V.unlock(inp.value).then(function(good){
        if(good) return go();
        btn.disabled = false; out.style.color = "#b00020"; out.textContent = "合言葉が違います";
      }).catch(function(err){ btn.disabled = false; out.style.color = "#b00020"; out.textContent = "確かめられませんでした：" + err.message; });
    };
    btn.onclick = tryPw;
    inp.addEventListener("keydown", function(e){ if(e.key === "Enter" && !e.isComposing) tryPw(); });
    document.getElementById("bootSignIn").onclick = function(){ V.login(); };
  }).catch(function(err){
    msg.style.color = "#b00020";
    msg.textContent = "配置表を読み込めませんでした：" + err.message;
  });
})();
</script>

      /* 右クリックは、選んである範囲の中なら選択を崩さない（まとめて消せるように） */
      if(e.button === 2){ if(!SEL[tdKey(td)]) pickCell(td); return; }
      if(e.detail > 1) e.preventDefault();
      /* 選んであったマスの名前はドラッグで動かす。選んでいないマスからは範囲を選ぶ（Excel と同じ。008.0010） */
      WASSEL = !!SEL[tdKey(td)];
      var mods = e.shiftKey || e.ctrlKey || e.metaKey;
      /* 何人か選んである中を押したときは、そのままつかんで動かせるよう選択を崩さない（離したら1マスに） */
      if(WASSEL && !mods && selCount() > 1){ COLLAPSE = td; return; }
      COLLAPSE = null;
      if(!(PICK && td.dataset.drop)) pickCell(td, mods ? e : null);
      if(e.button === 0 && !e.ctrlKey && !e.metaKey && !PICK && !WASSEL) DSEL = true;
    });
    td.addEventListener("mouseenter", function(e){
      if(!DSEL || !(e.buttons & 1) || EDITING) return;
      closeDD();
      pickCell(td, {shiftKey: true});
    });
    td.addEventListener("contextmenu", function(e){
      if(EDITING === td) return;          /* 書いている最中はブラウザのメニュー（貼り付け等） */
      e.preventDefault();
      openCM(td, e.clientX, e.clientY);
    });
    td.addEventListener("dblclick", function(e){ e.preventDefault(); closeDD(); startEdit(td); });
    td.addEventListener("click", function(e){
      /* 担当の黄色（実際に行った）は「確定」のとき Alt+クリックで切り替え */
      if(e.altKey && (td.dataset.kind === "site" || td.dataset.kind === "sub") && td.dataset.k === "担当"){
        var s = (td.dataset.kind === "sub" ? D.外注 : D.現場)[+td.dataset.i];
        if(!s || !s.担当) return;
        if(MODE !== "確定"){ toast("黄色は「確定」のときだけ付けられます"); return; }
        ySet(yOf(s, true), !s.担当が行った);
        commit((s.担当 || "担当") + " の黄色を切替");
        return;
      }
      /* 黄色で点滅しているマスを押したら「黄色で決定／黄色を消す」（008.0009） */
      if(!e.altKey && !e.ctrlKey && !e.shiftKey && !PICK && td.classList.contains("yblink") && !LOCKED){
        openYB(td, e.clientX, e.clientY);
        return;
      }
      /* 外注の取りやめ（業者名に取り消し線・員数は数えない） */
      if(e.altKey && td.dataset.kind === "sub" && td.dataset.k === "業者"){
        var b = D.外注[+td.dataset.i];
        if(!b || !b.業者) return;
        b.取りやめ = !b.取りやめ;
        commit(b.業者 + (b.取りやめ ? " を取りやめにする" : " の取りやめを戻す"));
        return;
      }
      /* タップで選んだ人を、押したセルへ置く */
      if(PICK && td.dataset.drop){
        e.preventDefault();
        clearSel();
        movePerson(PICK.氏名, PICK.from || null, dropLoc(td, e));
        return;
      }
      /* 休みのマス: 空いていれば「休みに入れる」（名前 → 理由）。種別の一覧は出さない（008.0010） */
      if(td.dataset.kind === "rest"){
        if(!e.ctrlKey && !e.metaKey && !e.shiftKey && !EDITING && !LOCKED &&
           !getVal("rest", 0, td.dataset.k) && selCount() <= 1) restDialog([]);
        return;
      }
      /* 1回クリックで選択肢を出す（Excelの入力規則のドロップダウンと同じ役目） */
      if(!e.ctrlKey && !e.metaKey && !e.shiftKey && !EDITING && (td.dataset.list || td.dataset.opts))
        openDD(td);
    });
    if(td.dataset.drop){
      td.addEventListener("dragover", function(e){
        if(ROWDRAG) return;            /* 行の入れ替え中（document の dragover が受ける） */
        e.preventDefault();
        td.classList.add("drop");
        var loc = JSON.parse(td.dataset.drop);
        td.classList.remove("before", "after");
        if(loc.kind === "site" && loc.at != null) td.classList.add(sideOf(td, e));
      });
      td.addEventListener("dragleave", function(){ td.classList.remove("drop", "before", "after"); });
      td.addEventListener("drop", function(e){
        if(ROWDRAG) return;            /* 行の入れ替えは document の drop が受ける */
        e.preventDefault(); td.classList.remove("drop", "before", "after");
        var d = JSON.parse(e.dataTransfer.getData("text/plain") || "{}");
        if(!d.name) return;
        /* 何人か選んだまま名前をつかんだら、選んだ人をまとめて動かす（008.0010） */
        if(d.many){
          var loc = dropLoc(td, e), ps = selPeople();
          if(loc.kind === "site" || loc.kind === "center" || loc.kind === "rest"){ moveMany(ps, loc); return; }
        }
        clearSel();
        movePerson(d.name, d.from || null, dropLoc(td, e));
      });
    }
  });
  /* 表の中の名前（枠も × も付けない。ドラッグで動かす） */
  $("#sheet").querySelectorAll(".nm").forEach(function(sp){
    sp.addEventListener("dragstart", function(e){
      /* 選んでいないマスからは動かさず、範囲を選ぶ（まず押して選んでから、名前をつかんで動かす） */
      if(!WASSEL){ e.preventDefault(); return; }
      DSEL = false; COLLAPSE = null;
      var td = sp.closest("td"), many = selCount() > 1 && td && SEL[tdKey(td)];
      e.dataTransfer.setData("text/plain", JSON.stringify(
        {name: sp.textContent, from: JSON.parse(sp.dataset.from), many: !!many}));
    });
    /* スマホ（タッチ）は「名前を押す → 置きたいセルを押す」 */
    sp.addEventListener("pointerup", function(e){
      if(e.pointerType !== "touch" || PICK) return;
      e.stopPropagation();
      PICK = {氏名: sp.textContent, from: JSON.parse(sp.dataset.from)};
      render();
      toast(PICK.氏名 + " を選びました。置きたいセルを押してください（Escで取り消し）。");
    });
  });
}

/* 日本語入力は keydown で文字が取れないことがある。
   変換を始めた合図（compositionstart）で書き換えに入り、入力をそのまま引き継ぐ。 */
document.addEventListener("compositionstart", function(e){
  var tag = (e.target && e.target.tagName) || "";
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if(selCount() !== 1 || !ANCHOR) return;
  var td = anchorTd();
  if(td && !td.dataset.opts) startEdit(td, "");
});

document.addEventListener("keydown", function(e){
  var tag = (e.target && e.target.tagName) || "";
  var typing = (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" ||
                (e.target && e.target.isContentEditable) || !!document.querySelector(".mdlg.ced"));
  if(!typing && (e.ctrlKey || e.metaKey)){
    var k = e.key.toLowerCase();
    if(k === "z" && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if(k === "y" || (k === "z" && e.shiftKey)){ e.preventDefault(); redo(); return; }
  }
  if(typing) return;
  if(e.key === "Delete" || e.key === "Backspace"){
    if(selCount()){ e.preventDefault(); clearSelected(); return; }
  }
  if((e.key === "Enter" || e.key === "F2") && selCount() === 1 && ANCHOR){
    e.preventDefault(); startEdit(anchorTd()); return;
  }
  /* セルを選んだまま文字を打ったら、そのまま書き換えに入る（Excelと同じ） */
  if(selCount() === 1 && ANCHOR && !e.ctrlKey && !e.altKey && !e.metaKey && e.key.length === 1){
    var td0 = anchorTd();
    if(td0 && !td0.dataset.opts){ e.preventDefault(); startEdit(td0, e.key); return; }
  }
  if(ANCHOR && e.key.indexOf("Arrow") === 0){
    var cur = anchorTd(); if(!cur) return;
    var nx = null;
    if(e.key === "ArrowLeft") nx = cellAt(ANCHOR.r, +cur.dataset.c0 - 1);
    if(e.key === "ArrowRight") nx = cellAt(ANCHOR.r, +cur.dataset.c1 + 1);
    for(var dr = 1; !nx && dr < 12 && (e.key === "ArrowUp" || e.key === "ArrowDown"); dr++)
      nx = cellAt(ANCHOR.r + (e.key === "ArrowDown" ? dr : -dr), ANCHOR.c);
    if(nx){
      e.preventDefault();
      var keepC = ANCHOR.c;
      pickCell(nx, e.shiftKey ? {shiftKey:true} : null);
      if(!e.shiftKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) ANCHOR.c = keepC;
      nx.scrollIntoView({block:"nearest", inline:"nearest"});
    }
    return;
  }
  if(e.key === "Escape"){ PICK = null; clearSel(); render(); toast(""); }
});

/* =====================================================================
   行を挿入・削除（選んだセルの行が対象）
   ===================================================================== */
function insRow(){
  var td = anchorTd();
  if(!td){ toast("先に行のどこかのセルを選んでください"); return; }
  insAt(td.dataset.kind, +td.dataset.i);
}
function delRow(){
  var td = anchorTd();
  if(!td){ toast("先に消したい行のセルを選んでください"); return; }
  delAt(td.dataset.kind, +td.dataset.i);
}
function rcArr(kind){ return kind === "site" ? D.現場 : kind === "office" ? D.本社 : kind === "sub" ? D.外注 : null; }
function rcName(kind, i){
  var x = (rcArr(kind) || [])[i] || {};
  return kind === "site" ? (x.現場名 || "現場") + (x.区分 || "") : kind === "office" ? (x.氏名 || x.記載 || "社員欄").trim() || "社員欄" : (x.業者 || "外注");
}
/* i 番の上に空の行を入れる（下はひとつずつ下がる） */
function insAt(kind, i){
  var arr = rcArr(kind);
  if(!arr){ toast("この欄は行を足せません"); return; }
  if(i >= arr.length){ toast("空いている行です。そのまま書けます"); return; }
  if(kind === "site"){
    arr.splice(i, 0, newSite());
    arr[i].区分 = KBN[0];               /* 空の行として残るよう区分だけ入れておく */
  }else if(kind === "office"){
    arr.splice(i, 0, {氏名:"", 記載:" ", 社員:false});
  }else{
    if(arr.length >= MAX_SUBS){ toast("外注は" + MAX_SUBS + "件までです"); return; }
    arr.splice(i, 0, newSub());
    arr[i].昼夜 = KBN[0];
  }
  clearSel();
  commit("行を挿入");
}
/* i 番の行を中身ごと消し、下の行を上に詰める（表の行の数は変わらない。いちばん下に空の行ができる）。
   6人目からで2行以上になっている現場は、まとめて消える */
function delAt(kind, i){
  var arr = rcArr(kind);
  if(!arr){ toast("この欄は行を消せません（セルを選んで Delete で中身を消せます）"); return; }
  var x = arr[i];
  if(!x) return;
  var name = rcName(kind, i);
  if(kind === "site" && x.作業員.length &&
     !confirm(name + " には " + x.作業員.length + " 人います。この現場の行を消しますか？")) return;
  arr.splice(i, 1);
  clearSel();
  commit(name + " の行を消す");
}

/* =====================================================================
   行の左の操作（2026-10-04 ユーザー要望）
     ⠿ … つかんで上下に動かすと行を入れ替える
     ＋ … この行の上に空の行を入れる
     − … この行を中身ごと消して、下の行を上に詰める（行の数は変わらない）
   **表の外（左の余白）に重ねて置く。** 表そのもの・印刷・Excel出力には何も足さない。
   動かす単位は D.現場 の1件。6人目からで2行以上になる現場は1つの塊として動く。
   昼・夜は別の件なので、同じ現場でも別々に動く。現場・本社内勤・外注のそれぞれの中で入れ替える。
   ===================================================================== */
var RC_W = 66;               /* 左の余白の幅（px） */
var ROWDRAG = null;          /* つかんでいる行 {kind, i} */
/* いま画面にある行のかたまり（同じ kind・同じ番号の行をまとめる）。位置は画面上の座標 */
function rcBlocks(){
  var out = [];
  $("#sheet").querySelectorAll("tr[data-rk]").forEach(function(tr){
    var k = tr.dataset.rk, i = +tr.dataset.ri, r = tr.getBoundingClientRect(), last = out[out.length - 1];
    if(last && last.kind === k && last.i === i){ last.bottom = r.bottom; return; }
    out.push({kind: k, i: i, top: r.top, bottom: r.bottom, has: i < (rcArr(k) || []).length});
  });
  return out;
}
function buildRowCtl(){
  var box = $("#sheetbox"), t = $("#sheet");
  if(!box || !t) return;
  var ctl = $("#rowCtl");
  if(!ctl){
    ctl = document.createElement("div");
    ctl.id = "rowCtl"; ctl.className = "noprint";
    box.appendChild(ctl);
    ctl.addEventListener("click", function(e){
      var b = e.target.closest ? e.target.closest(".rcb") : null;
      if(!b) return;
      var it = b.parentNode;
      if(b.dataset.a === "ins") insAt(it.dataset.k, +it.dataset.i);
      else delAt(it.dataset.k, +it.dataset.i);
    });
    ctl.addEventListener("dragstart", function(e){
      var h = e.target.closest ? e.target.closest(".rch") : null;
      if(!h) return;
      var it = h.parentNode;
      ROWDRAG = {kind: it.dataset.k, i: +it.dataset.i};
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "rowmove");
      try{ e.dataTransfer.setDragImage(it, 10, 10); }catch(err){}
      it.classList.add("moving");
    });
    ctl.addEventListener("dragend", function(){ ROWDRAG = null; rcLine(null); buildRowCtl(); });
  }
  var br = box.getBoundingClientRect(), tb = t.getBoundingClientRect();
  var left = tb.left - br.left + box.scrollLeft - RC_W + 2;
  ctl.innerHTML = rcBlocks().map(function(b){
    if(!b.has) return "";
    return '<div class="rc rc-' + b.kind + '" data-k="' + b.kind + '" data-i="' + b.i + '" style="left:' + left + 'px;top:' +
      (b.top - br.top + box.scrollTop) + 'px;height:' + (b.bottom - b.top) + 'px">' +
      '<span class="rch" draggable="true" title="つかんで上下に動かすと、行を入れ替えます（' + esc(rcName(b.kind, b.i)) + '）">⠿</span>' +
      '<button class="rcb" data-a="ins" title="この行の上に空の行を入れる">＋</button>' +
      '<button class="rcb" data-a="del" title="この行を中身ごと消して、下の行を上に詰める">−</button></div>';
  }).join("");
}
/* つかんでいる行をどこへ入れるか（同じ欄の中だけ）。{to: 入れる番号, y: 線を引く画面上の高さ} */
function rcTarget(y){
  if(!ROWDRAG) return null;
  var bs = rcBlocks().filter(function(b){ return b.kind === ROWDRAG.kind; });
  /* 欄の外（隣の欄の行）では受けない。現場欄と本社内勤欄は隙間なく続くので、余裕は持たせない */
  if(!bs.length || y < bs[0].top || y > bs[bs.length - 1].bottom) return null;
  var n = rcArr(ROWDRAG.kind).length, real = bs.filter(function(b){ return b.has; });
  for(var j = 0; j < real.length; j++){
    var b = real[j];
    if(y < b.bottom) return y < (b.top + b.bottom) / 2 ? {to: b.i, y: b.top} : {to: b.i + 1, y: b.bottom};
  }
  return real.length ? {to: n, y: real[real.length - 1].bottom} : null;   /* 空いている行の上なら、いちばん後ろへ */
}
function rcLine(tg){
  var box = $("#sheetbox"), ln = $("#rowLine");
  if(!tg){ if(ln) ln.style.display = "none"; return; }
  if(!ln){ ln = document.createElement("div"); ln.id = "rowLine"; ln.className = "noprint"; box.appendChild(ln); }
  var br = box.getBoundingClientRect(), tb = $("#sheet").getBoundingClientRect();
  ln.style.cssText = "display:block;left:" + (tb.left - br.left + box.scrollLeft - RC_W + 2) + "px;width:" +
    (tb.width + RC_W - 2) + "px;top:" + (tg.y - br.top + box.scrollTop - 2) + "px";
}
document.addEventListener("dragover", function(e){
  if(!ROWDRAG) return;
  var tg = rcTarget(e.clientY);
  if(tg){ e.preventDefault(); e.dataTransfer.dropEffect = "move"; }
  rcLine(tg);
});
document.addEventListener("drop", function(e){
  if(!ROWDRAG) return;
  e.preventDefault();
  var tg = rcTarget(e.clientY), mv = ROWDRAG;
  ROWDRAG = null; rcLine(null);
  if(!tg) return;
  var arr = rcArr(mv.kind), from = mv.i, to = tg.to;
  if(to === from || to === from + 1){ buildRowCtl(); return; }   /* 同じ場所 */
  var name = rcName(mv.kind, from);
  var x = arr.splice(from, 1)[0];
  if(to > from) to--;
  arr.splice(to, 0, x);
  clearSel();
  commit(name + " の行を動かす");
});

/* =====================================================================
   Excelに出力（2026-09-28）

   **tools/write_haichi.py と同じことをブラウザでする。**
   白紙テンプレート（data/template.js）の xlsx を開き、シートのXMLに値を差し込むだけ。
   罫線・結合・列幅・行高・印刷範囲(A1:P37)・A4横・倍率71% はテンプレートのまま引き継ぐので、
   出面集計とクロジカ突合が今までどおり読める。**1から組み立てないこと。**

   SheetJS community 版は書式を書き出せないので、zip の出し入れ（XLSX.CFB）だけ借りて、
   XML は自分で直す。塗りは社内の決まり事にそろえる:
       元請（C列）   … その行を使っていれば水色 FFCCFFFF
       担当（D列）   … 確定で、その担当者が実際に現場へ行ったなら黄色 FFFFFF00
       作業員        … 確定で、社員なら黄色（**予定には黄色を付けない**）
   ===================================================================== */
var XNS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
var REF_SITE_ROW = 5, REF_OFFICE_ROW = 20;     /* write_haichi.py と同じ見本の行 */

function colName(c){ var s = ""; while(c > 0){ var m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); } return s; }
function parseRef(ref){
  var m = /^([A-Z]+)(\d+)$/.exec(ref), c = 0;
  for(var i = 0; i < m[1].length; i++) c = c * 26 + (m[1].charCodeAt(i) - 64);
  return {r: +m[2], c: c};
}
function b64ToU8(b){ var s = atob(b), u = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }

function TooMany(msg){ this.message = msg; }

/* 本社内勤・休み欄の行を囲む枠の色（配置表の書き方。内勤＝水色 FF00B0F0、休み＝赤 FFFF0000）
   Vr008（2026-10-08 〇〇さんから「勝手に引かれる」）: 記載から自動で付けるのをやめ、
   右クリックで付けた行だけに付ける。データは 本社[].枠 = "水色" | "赤"（無ければ枠なし）。
   出面集計・クロジカ突合は枠の色を読まない（記載の文字で数える）ので、集計には響かない */
var BOX_NAIKIN = "FF00B0F0", BOX_REST = "FFFF0000";
var BOX_OF = {"水色": BOX_NAIKIN, "赤": BOX_REST};
/* 毎日どこか（現場・本社内勤・休み）に名前があるはずの社員（出面集計の STAFF と同じ。
   〇〇 将司〈入院中〉・〇〇 茂雄〈〇〇〉は記載の無い日があるので外す） */
var MUST_STAFF = [];   /* 見るだけ版は入力チェックをしない */
var RE_OFFICE_REST = /休|有給|明け|忌引|欠勤|代休|振替|入院|通院/;
function officeBox(o){
  return o && BOX_OF[o.枠] || null;
}

function buildXlsx(data){
  if(!window.HAICHI_TEMPLATE) throw new Error("テンプレート（data/template.js）がありません");
  var cfb = XLSX.CFB.read(b64ToU8(window.HAICHI_TEMPLATE), {type: "array"});
  var entry = function(p){
    var e = XLSX.CFB.find(cfb, p);
    if(!e) throw new Error("テンプレートに " + p + " がありません");
    return e;
  };
  var readXml = function(p){
    return new DOMParser().parseFromString(new TextDecoder("utf-8").decode(entry(p).content),
      "application/xml");
  };
  var writeXml = function(p, doc){
    var s = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      new XMLSerializer().serializeToString(doc.documentElement);
    var u = new TextEncoder().encode(s), e = entry(p);
    e.content = u; e.size = u.length;
  };
  var sx = readXml("/xl/worksheets/sheet1.xml");
  var st = readXml("/xl/styles.xml");

  /* ---- 書式（塗り・取り消し線）の派生を作る ---- */
  var xfsEl = st.getElementsByTagNameNS(XNS, "cellXfs")[0];
  var fillsEl = st.getElementsByTagNameNS(XNS, "fills")[0];
  var fontsEl = st.getElementsByTagNameNS(XNS, "fonts")[0];
  var kids = function(el, tag){
    return Array.prototype.filter.call(el.childNodes, function(n){ return n.localName === tag; });
  };
  var fillIds = {};
  var fillOf = function(rgb){
    if(fillIds[rgb] != null) return fillIds[rgb];
    var f = st.createElementNS(XNS, "fill"), pf = st.createElementNS(XNS, "patternFill");
    pf.setAttribute("patternType", "solid");
    var fg = st.createElementNS(XNS, "fgColor"); fg.setAttribute("rgb", rgb);
    var bg = st.createElementNS(XNS, "bgColor"); bg.setAttribute("indexed", "64");
    pf.appendChild(fg); pf.appendChild(bg); f.appendChild(pf); fillsEl.appendChild(f);
    fillsEl.setAttribute("count", kids(fillsEl, "fill").length);
    return (fillIds[rgb] = kids(fillsEl, "fill").length - 1);
  };
  var varCache = {};
  var styleVariant = function(s, kind){
    var key = s + ":" + kind;
    if(varCache[key] != null) return varCache[key];
    var xfs = kids(xfsEl, "xf");
    var xf = xfs[s].cloneNode(true);
    if(kind === "strike"){
      var fonts = kids(fontsEl, "font");
      var ft = fonts[+xf.getAttribute("fontId") || 0].cloneNode(true);

function xlsxName(day){

async function exportXlsx(checked){
  normalize();

  if(checked !== true && !PROT && BASE && snapshot() !== BASE && snapshot() !== CONFIRMED){ openCheck("out"); return; }
  /* 点滅（黄色をまだ決めていない）が残っていたら先に決めてもらう。保存の画面はボタンを押した直後でないと
     開けないので、confirm ではなく小窓のボタンから出し直す（008.0009） */
  var npend = MODE === "確定" ? yPendCount() : 0;
  if(npend){ askPendingBeforeOut(npend); return; }

  if(probs.length){ alert("この様式に収まりません。\n\n・" + probs.join("\n・")); return; }

  catch(err){ alert(err instanceof TooMany ? "この様式に収まりません。\n\n" + err.message
                    : "Excelを作れませんでした: " + err.message); return; }
  var blob = new Blob([bytes], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var name = xlsxName(D.日付);
  /* 保存先を選べるときは選ばせる（NASの 配置予定表／配置確定 へ直接置ける） */
  if(window.showSaveFilePicker){
    try{
      var fh = await window.showSaveFilePicker({suggestedName: name,
        types: [{description: "Excel ブック", accept: {"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"]}}]});
      var w = await fh.createWritable();
      await w.write(blob); await w.close();
      toast("Excelに出力しました: " + fh.name + "（" + MODE + "）" +
        (MODE === "予定" ? "　置き場所は 配置予定表 です" : "　置き場所は 配置確定 です"));
      addToData(fh.name);         /* 「配置表を見る」にもすぐ出るよう、配置表データ\追加分.js に書き足す */
      return;
    }catch(err){
      if(err && err.name === "AbortError"){ toast("出力をやめました"); return; }
    }
  }
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast("Excelに出力しました: " + name + "（" + MODE + "）");
}

    '<div class="mbody" style="font-size:15px;line-height:1.8;padding:12px 16px">' +
    '黄色で点滅している名前が <b>' + n + ' 人</b>あります。<br>' +

  /* ① 覚えたフォルダに書ける（許可が残っている）なら、黙って書く */
  var h = await vget("dataDir"), ok = false;
  if(h && h.queryPermission){ try{ ok = (await h.queryPermission({mode: "readwrite"})) === "granted"; }catch(err){} }
  if(ok){
    try{ await writeAddDir(h, merge); vResetList(kind); toast("Excelに出力しました: " + fileName + "（" + kind + "）。日付のカレンダーにも出します"); return; }
    catch(err){ /* 下の小窓で聞き直す */ }
  }
  /* ② のために、いまの追加分を先に読んでおく（ボタンを押した直後に保存する画面を開かないと開けないため） */
  var cur = null, canSave = false;
  try{
    await vScript(PAST_DIR + "index.js");             /* 配置表データ の隣にいるか */
    canSave = true;
    window.HAICHI_PAST_ADD = undefined;
    await vScript(PAST_DIR + ADD_FILE).catch(function(){});   /* まだ無ければ空から */
    cur = window.HAICHI_PAST_ADD || null;
  }catch(err){ canSave = false; }
  var r = await askDataDir(h, canSave, function(){ return ADD_PREFIX + JSON.stringify(merge(cur)) + ";\n"; });
  if(!r){ toast("Excelは保存しました（ほかの人の日付のカレンダーへの追加はしませんでした）"); return; }
  try{
    if(r.dir) await writeAddDir(r.dir, merge);
    else window.HAICHI_PAST_ADD = merge(cur);
    vResetList(kind);
    toast("Excelに出力しました: " + fileName + "（" + kind + "）。日付のカレンダーにも出します");
  }catch(err){
    toast("Excelは保存しました。ほかの人の日付のカレンダーへの追加はできませんでした: " + err.message);
  }
}
/* 追加したら「配置表を見る」の一覧を作り直す（前に開いた一覧を使い回すと、いま出力した日が出なかった）。
   次に開いたときは、いま出力した種類（予定／確定）と その月 を出す */
function vResetList(kind){
  if(VW.idx >= 0) return;
  VW.list = []; VW.idx = -1; VW.kind = kind; VW.cm = D.日付 ? D.日付.slice(0, 7) : null; VW.year = null;
}
/* ① 覚えたフォルダの 追加分.js を読み、その日を足して書き戻す */
async function writeAddDir(h, merge){
  var fh = await h.getFileHandle(ADD_FILE, {create: true});
  var txt = (await (await fh.getFile()).text()).trim(), o = {};
  if(txt.indexOf(ADD_PREFIX) === 0) o = JSON.parse(txt.slice(ADD_PREFIX.length).replace(/;\s*$/, ""));
  else if(txt) throw new Error(ADD_FILE + " の中身が読めません");
  o = merge(o);
  var w = await fh.createWritable();
  await w.write(ADD_PREFIX + JSON.stringify(o) + ";\n"); await w.close();
  window.HAICHI_PAST_ADD = o;
}
/* 追加分の置き方の小窓。返り値 {saved: true} / null（やめた） */
function askDataDir(h, canSave, makeText){

          '<b>33_配置表 の中の「配置表データ」</b>フォルダで、名前が <b>追加分.js</b> のまま「保存」→ 上書きの確認は「はい」。' +
          '<span style="font-size:13px;color:#555">（2回目からは同じフォルダが開きます）</span></div>' +
          '<div style="font-size:13px;color:#555;margin-top:4px">場所: \\\\192.168.0.15\\share\\33_配置表\\配置表データ</div>'
        : '<div style="margin-top:8px;color:#b45309">この画面は NAS の 33_配置表 にあるツールではないので、追加できません。' +

/* =====================================================================
   既存の配置表（Excel）を読み込む

   **読み方は tools/read_haichi.py と同じ。** 直したら両方そろえること。
   SheetJS は community 版でも `cellStyles:true` を付ければ**塗りが読める**
   （2026-09-12 に実測。D4 の担当が fgColor.rgb="FFFF00" で取れた）。
   **フォントの取り消し線は SheetJS では読めない**ので、xlsx の中の XML（styles.xml の
   フォントと、シートのセルの書式番号）を直に見て拾う（strikeRefs。Vr001）。
   Vr000 は「業者名があるのに員数が空」で取りやめと見なしていたが、**予定表では員数が
   まだ空の外注が普通にあり**、それを取りやめと取り違えて出力に取り消し線を付けていた
   （2026-09-28 のブラウザ往復テストで125枚。出面集計はその外注を数えなくなる）。
   ===================================================================== */
var YELLOW6 = "FFFF00";

function fillRgb(cell){
  var s = cell && cell.s;
  if(!s || !s.fgColor) return "";
  var c = s.fgColor;
  if(c.rgb) return String(c.rgb).toUpperCase().slice(-6);
  return "";                      /* theme色・indexed色は「塗りなし」と同じ扱い */
}
function isYellowCell(cell){ return fillRgb(cell) === YELLOW6; }

/* 結合を展開した値の表。(行,列) → 左上の値 */
function mergeMap(ws){
  var m = {}, ranges = ws["!merges"] || [];
  ranges.forEach(function(rg){
    var top = ws[XLSX.utils.encode_cell({r:rg.s.r, c:rg.s.c})];
    var v = top ? top.v : undefined;
    for(var r = rg.s.r; r <= rg.e.r; r++)
      for(var c = rg.s.c; c <= rg.e.c; c++) m[r + "," + c] = v;
  });
  return m;
}
/* SheetJS はセル内改行を CRLF のまま返すが、Python(openpyxl) は LF で返す。
   同じJSONになるよう LF にそろえる。 */
var cellText = function(v){
  return v == null ? "" : String(v).replace(/\r\n?/g, "\n").trim();
};
var oneLine = function(v){ return cellText(v).replace(/[\r\n\t]+/g, ""); };

/* 取り消し線のセル（"F26" など）の集合。読めなければ null */
/* 文字ごとの書式（リッチテキスト）があるセル → その <r>…</r> の XML（2026-10-06）。
   SheetJS は色を落とすので、取り消し線と同じく xlsx の中を直に読む。
   画面が書く inlineStr と、Excel で保存し直したときの共有文字列（sharedStrings.xml）の両方を見る */
function richRefs(buf){
  try{
    var cfb = XLSX.CFB.read(new Uint8Array(buf), {type: "array"});
    var txt = function(p){ var e = XLSX.CFB.find(cfb, p);
      return e ? new TextDecoder("utf-8").decode(e.content) : null; };
    var xml = function(t){ return new DOMParser().parseFromString(t, "application/xml"); };
    var byName = function(doc, tag){ return Array.prototype.slice.call(doc.getElementsByTagNameNS("*", tag)); };
    var kidsOf = function(el, tag){ return Array.prototype.filter.call(el.childNodes, function(n){ return n.localName === tag; }); };
    var wbx = xml(txt("/xl/workbook.xml")), rels = xml(txt("/xl/_rels/workbook.xml.rels"));
    var sh = byName(wbx, "sheet")[0];
    var rid = sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id") ||
              sh.getAttribute("r:id");
    var tgt = byName(rels, "Relationship").filter(function(r){ return r.getAttribute("Id") === rid; })[0]
      .getAttribute("Target");
    var path = tgt.charAt(0) === "/" ? tgt : "/xl/" + tgt.replace(/^\.\//, "");
    var ser = new XMLSerializer();
    var runsXml = function(si){ var rs = kidsOf(si, "r"); return rs.length ? rs.map(function(r){ return ser.serializeToString(r); }).join("") : null; };
    var sst = null, sstT = txt("/xl/sharedStrings.xml");
    if(sstT) sst = byName(xml(sstT), "si");
    var out = {};
    byName(xml(txt(path)), "c").forEach(function(c){
      var t = c.getAttribute("t"), x = null;
      if(t === "inlineStr"){ var is = kidsOf(c, "is")[0]; if(is) x = runsXml(is); }
      else if(t === "s" && sst){ var v = kidsOf(c, "v")[0]; var si = v && sst[+v.textContent]; if(si) x = runsXml(si); }
      if(x) out[c.getAttribute("r")] = x;
    });
    return out;
  }catch(err){ return {}; }
}
/* 本社内勤欄の枠（Vr008）: A列の左が太線で 水色 00B0F0／赤 FF0000 のセル → "水色"／"赤"。
   read_haichi.office_frame と同じ。読めなければ null */
function boxRefs(buf){
  try{
    var cfb = XLSX.CFB.read(new Uint8Array(buf), {type: "array"});
    var txt = function(p){ var e = XLSX.CFB.find(cfb, p);
      return e ? new TextDecoder("utf-8").decode(e.content) : null; };
    var xml = function(t){ return new DOMParser().parseFromString(t, "application/xml"); };
    var byName = function(doc, tag){ return Array.prototype.slice.call(doc.getElementsByTagNameNS("*", tag)); };
    var kidsOf = function(el, tag){ return Array.prototype.filter.call(el.childNodes, function(n){ return n.localName === tag; }); };
    var wbx = xml(txt("/xl/workbook.xml")), rels = xml(txt("/xl/_rels/workbook.xml.rels"));
    var sh = byName(wbx, "sheet")[0];
    var rid = sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id") ||
              sh.getAttribute("r:id");
    var tgt = byName(rels, "Relationship").filter(function(r){ return r.getAttribute("Id") === rid; })[0]
      .getAttribute("Target");
    var path = tgt.charAt(0) === "/" ? tgt : "/xl/" + tgt.replace(/^\.\//, "");
    var st = xml(txt("/xl/styles.xml"));
    var frameOf = kidsOf(byName(st, "borders")[0], "border").map(function(b){
      var l = kidsOf(b, "left")[0];
      if(!l || !/^(thick|medium)$/.test(l.getAttribute("style") || "")) return null;
      var c = kidsOf(l, "color")[0], rgb = c ? String(c.getAttribute("rgb") || "").toUpperCase().slice(-6) : "";
      return rgb === "00B0F0" ? "水色" : rgb === "FF0000" ? "赤" : null;
    });
    var xfFrame = kidsOf(byName(st, "cellXfs")[0], "xf").map(function(x){ return frameOf[+x.getAttribute("borderId") || 0] || null; });
    var out = {};
    byName(xml(txt(path)), "c").forEach(function(c){
      var ref = c.getAttribute("r");
      if(!/^A\d+$/.test(ref)) return;
      var f = xfFrame[+c.getAttribute("s") || 0];
      if(f) out[ref] = f;
    });
    return out;
  }catch(err){ return null; }
}
function strikeRefs(buf){
  try{
    var cfb = XLSX.CFB.read(new Uint8Array(buf), {type: "array"});
    var txt = function(p){ var e = XLSX.CFB.find(cfb, p);
      return e ? new TextDecoder("utf-8").decode(e.content) : null; };
    var xml = function(t){ return new DOMParser().parseFromString(t, "application/xml"); };
    var byName = function(doc, tag){ return Array.prototype.slice.call(doc.getElementsByTagNameNS("*", tag)); };
    /* 1枚目のシートの場所（workbook.xml → rels） */
    var wbx = xml(txt("/xl/workbook.xml")), rels = xml(txt("/xl/_rels/workbook.xml.rels"));
    var sh = byName(wbx, "sheet")[0];
    var rid = sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id") ||
              sh.getAttribute("r:id");
    var tgt = byName(rels, "Relationship").filter(function(r){ return r.getAttribute("Id") === rid; })[0]
      .getAttribute("Target");
    var path = tgt.charAt(0) === "/" ? tgt : "/xl/" + tgt.replace(/^\.\//, "");
    /* 取り消し線のフォント → それを使う書式番号 */
    var st = xml(txt("/xl/styles.xml"));
    var fontsEl = byName(st, "fonts")[0];
    var strikeFont = Array.prototype.filter.call(fontsEl.childNodes, function(n){ return n.localName === "font"; })
      .map(function(f){
        var k = Array.prototype.filter.call(f.childNodes, function(n){ return n.localName === "strike"; })[0];
        return !!k && !/^(0|false)$/.test(k.getAttribute("val") || "");
      });
    var xfsEl = byName(st, "cellXfs")[0];
    var strikeXf = Array.prototype.filter.call(xfsEl.childNodes, function(n){ return n.localName === "xf"; })
      .map(function(x){ return !!strikeFont[+x.getAttribute("fontId") || 0]; });
    var set = {};
    byName(xml(txt(path)), "c").forEach(function(c){
      if(strikeXf[+c.getAttribute("s") || 0]) set[c.getAttribute("r")] = true;
    });
    return set;
  }catch(err){ return null; }
}

/* 下段の見出しの行から区画の列を決める（tools/layout.py の bottom_cols と同じ）。
   見出しの文字（「休」「員数」）の位置で決め、見つからなければ旧の形 */
/* SheetJS が持っているリッチテキストの XML（<r><rPr>…</rPr><t>…</t></r>…）→ 書式の並び */
function richRuns(xml){
  try{
    var doc = new DOMParser().parseFromString('<x xmlns="' + XNS + '">' + xml + "</x>", "application/xml");
    if(doc.getElementsByTagName("parsererror").length) return null;
    var rs = doc.getElementsByTagNameNS(XNS, "r");
    if(!rs.length) return null;
    var out = [];
    Array.prototype.forEach.call(rs, function(r){
      var rp = r.getElementsByTagNameNS(XNS, "rPr")[0], t = r.getElementsByTagNameNS(XNS, "t")[0];
      var g = function(tag){ return rp ? rp.getElementsByTagNameNS(XNS, tag)[0] : null; };
      var col = g("color"), rgb = col && col.getAttribute("rgb") ? col.getAttribute("rgb").slice(-6).toUpperCase() : "";
      var bb = g("b"), uu = g("u");
      out.push({t: t ? t.textContent : "", c: rgb && rgb !== "000000" ? rgb : "",
        b: !!bb && bb.getAttribute("val") !== "0" && bb.getAttribute("val") !== "false",
        u: !!uu && uu.getAttribute("val") !== "none"});
    });
    return runsMerge(out.map(function(r){ return {t: r.t.replace(/\r\n/g, "\n"), c: r.c, b: r.b, u: r.u}; }));
  }catch(err){ return null; }
}
function bottomCols(textAt, isNum){
  /* 3つの形を読む（tools/layout.py の bottom_cols と同じ）:
       Vr004 まで … 機材センター A〜H ｜ 休み I〜N ｜ 外注員数 O〜P（数は下の行）
       Vr005      … 機材センター A〜I ｜ 休み J〜O ｜ 外注員数 P（数は下の行）
       Vr006 から … 機材センター A〜E ｜ 外注員数 F:G ｜ 計○名 H ｜ … ｜ 休み（右から）〜P */
  var rest = null, nums = [];
  for(var c = 2; c <= 16; c++){
    var h = String(textAt(c) || "").replace(/[\s　]/g, "");
    if(rest === null && h.indexOf("休") >= 0) rest = c;
    else if(h.indexOf("員数") >= 0 || h.indexOf("人数") >= 0) nums.push(c);
  }
  if(!rest) return {cen: [1, 8], rest: [9, 14], num: {w: "below", c: 15}};
  var after = nums.filter(function(x){ return x > rest; });
  if(after.length) return {cen: [1, rest - 1], rest: [rest, after[0] - 1], num: {w: "below", c: after[0]}};
  var num = {w: "header", c: COL_SUBNUM};
  var before = nums.filter(function(x){ return x < rest; });
  if(before.length)
    for(var c2 = before[0] + 1; c2 < rest; c2++) if(isNum && isNum(c2)){ num = {w: "header", c: c2}; break; }
  return {cen: [1, rest - 1], rest: [rest, 16], num: num};
}
function readXlsx(buf){
  var STRIKE = strikeRefs(buf), BOXES = boxRefs(buf);
  var RICH = richRefs(buf);
  var wb = XLSX.read(buf, {type:"array", cellStyles:true, cellDates:true});
  var ws = wb.Sheets[wb.SheetNames[0]];
  var mm = mergeMap(ws);
  var at = function(r, c){ return ws[XLSX.utils.encode_cell({r:r-1, c:c-1})]; };
  /* 結合セルの2つ目以降は塗りなしとして読む（openpyxl の MergedCell と同じ。read_haichi.py にそろえる）。
     SheetJS は XML に残っている書式を返すので、縦結合した担当欄の下の行まで黄色になってしまう */
  var hidden = {};
  (ws["!merges"] || []).forEach(function(rg){
    for(var r = rg.s.r; r <= rg.e.r; r++)
      for(var c = rg.s.c; c <= rg.e.c; c++)
        if(r !== rg.s.r || c !== rg.s.c) hidden[r + "," + c] = true;
  });
  var yel = function(r, c){ return !hidden[(r-1) + "," + (c-1)] && isYellowCell(at(r, c)); };
  var val = function(r, c){
    var x = at(r, c);
    var v = x ? x.v : undefined;
    if(v == null || v === "") v = mm[(r-1) + "," + (c-1)];
    return cellText(v);
  };

  /* --- 日付（M1） --- */
  var d1 = at(1, 13), day = "";
  if(d1 && d1.v instanceof Date){
    var dt = d1.v, p = function(n){ return (n < 10 ? "0" : "") + n; };
    day = dt.getFullYear() + "-" + p(dt.getMonth()+1) + "-" + p(dt.getDate());
  }

  /* --- 現場欄の列（2行目の C列が「コード」なら Vr007 の形。tools/layout.py の site_cols と同じ） --- */
  var SC = /コード/.test(cellText(at(2,3) && at(2,3).v))
    ? {code: 3, gen: 4, tan: 5, kbn: 6, w0: 7, cont: 12}
    : {code: 0, gen: 3, tan: 4, kbn: 5, w0: 6, cont: 11};

  /* --- 本社内勤欄の先頭行（B:C が結合されている最初の行） --- */
  var os = 14;
  var bc = (ws["!merges"] || []).filter(function(rg){
    return rg.s.c === 1 && rg.e.c === 2 && rg.s.r === rg.e.r
      && rg.s.r + 1 >= ROW_SITE_FIRST && rg.s.r + 1 <= ROW_OFFICE_LAST;
  }).map(function(rg){ return rg.s.r + 1; });
  if(bc.length) os = Math.min.apply(null, bc);
  /* 境目の下でも「作業員だけが入っている行」は現場行の続き（2026-06-25 予定の15行目） */
  while(os <= ROW_OFFICE_LAST){
    var hasW = false;
    for(var c2 = SC.w0; c2 < SC.w0 + 5; c2++) if(cellText(at(os, c2) && at(os, c2).v)) hasW = true;
    if(hasW && !cellText(at(os,1) && at(os,1).v) && !val(os, 2)) os++;
    else break;
  }

  /* --- 見出しの行を探す（固定ではない） --- */
  var subHdr = 25, botHdr = 34;
  for(var r = 1; r <= 60; r++){
    var a = cellText(at(r,1) && at(r,1).v);
    if(a.indexOf("【") >= 0 && a.indexOf("外注") >= 0){ subHdr = r; break; }
  }
  for(var r2 = 1; r2 <= 60; r2++){
    var a2 = cellText(at(r2,1) && at(r2,1).v).replace(/[\s　]/g, "");
    if(a2.indexOf("機材センター") >= 0){ botHdr = r2; break; }
  }

  /* --- 現場行 --- */
  var sites = [];
  for(var r3 = ROW_SITE_FIRST; r3 < os; r3++){
    var ws_ = [];
    for(var c3 = SC.w0; c3 < SC.w0 + 5; c3++){
      var cl = at(r3, c3), nm = cellText(cl && cl.v);
      if(nm) ws_.push({氏名: nm, 社員: yel(r3, c3)});
    }
    var ownSite = cellText(at(r3,2) && at(r3,2).v) || cellText(at(r3,1) && at(r3,1).v);
    /* 6人目を K列に書き、作業内容を L列へずらした書き方（2026-04-10 など）。
       K列が名簿にある人か「姓と名の間に空白がある短い文字列」なら作業員として読む。
       L列が空の日もある（予定 2026-04-10 の〇〇さん）。出面集計の sixth_worker と同じ決め方 */
    var kraw = cellText(at(r3,SC.cont) && at(r3,SC.cont).v), kv = oneLine(kraw), content = cellText(val(r3,SC.cont));
    var kName = kv && !/[\n：:]/.test(kraw) && nk(kv).length <= 8 && /[^\s　][\s　]+[^\s　]/.test(kv);
    if(kv && (isPerson(kv) || kName) && !mm[(r3-1) + "," + (SC.cont-1)]){
      ws_.push({氏名: kv, 社員: yel(r3, SC.cont)});
      content = cellText(at(r3,SC.cont+1) && at(r3,SC.cont+1).v);
    }
    if(!ownSite && !ws_.length) continue;
    sites.push({
      地域: val(r3,2) ? oneLine(val(r3,1)) : "",
      現場名: oneLine(val(r3,2)) || oneLine(val(r3,1)),
      現場コード: SC.code ? cellText(at(r3,SC.code) && at(r3,SC.code).v) : "",
      元請: oneLine(val(r3,SC.gen)),
      担当: oneLine(val(r3,SC.tan)),
      担当が行った: yel(r3, SC.tan),
      区分: oneLine(val(r3,SC.kbn)),
      作業員: ws_,
      作業内容: content
    });
  }
  sites = joinRows(sites);

  /* --- 本社内勤・休み欄 --- */
  var office = [];
  for(var r4 = os; r4 <= ROW_OFFICE_LAST; r4++){
    var nm2 = cellText(at(r4,1) && at(r4,1).v), kd = oneLine(val(r4,2));
    if(!nm2 && !kd) continue;
    var ob = {氏名: nm2, 記載: kd, 社員: yel(r4, 1)};
    if(BOXES && BOXES["A" + r4]) ob.枠 = BOXES["A" + r4];        /* Vr008: 付いていた枠をそのまま読む */
    office.push(ob);
  }

  /* --- 外注欄 --- */
  var subs = [];
  for(var r5 = subHdr + 1; r5 < botHdr; r5++){
    var vend = oneLine(val(r5,6)), site5 = oneLine(val(r5,1));
    var numc = at(r5,8), num = numc ? numc.v : "";
    if(!vend && !site5 && (num === "" || num == null)) continue;
    var n5 = (num === "" || num == null) ? null : (parseInt(num, 10) || 0);
    subs.push({
      現場名: site5, 現場コード: SC.code ? cellText(at(r5,3) && at(r5,3).v) : "",
      担当: cellText(val(r5,4)), 担当が行った: yel(r5, 4), 昼夜: oneLine(val(r5,5)),
      業者: vend, 員数: n5, 作業内容: cellText(val(r5,9)),
      /* 業者名（F・G列）に取り消し線 = 取りやめ（read_haichi.py・出面集計Vr006 と同じ決まり）。
         取り消し線が読めなかったときだけ、昔の見分け方（業者があるのに員数が空）に戻す */
      取りやめ: STRIKE ? !!(STRIKE["F" + r5] || STRIKE["G" + r5]) : !!(vend && n5 === null)
    });
  }

  /* --- 下段 --- */
  var b0 = botHdr + 1, b1 = b0 + BOTTOM_H - 1;
  var BC = bottomCols(function(c){ return cellText(at(botHdr, c) && at(botHdr, c).v); },
                      function(c){ var x = at(botHdr, c); return !!x && typeof x.v === "number"; });
  /* 機材センター: **この欄の結合セル（2マス以上）はどれも作業内容**、結合していないマスは名前の形なら作業員・
     そうでなければ作業内容。入力する人が日ごとに好きな形で結合するため（2026-10-04 ユーザー指定）。
     標準の形（氏名の右から欄の右端〔旧 H列・Vr005 は I列〕まで縦3行の結合1つ）でない日は、作業員の場所を持たない（左から詰め直す）。
     tools/read_haichi.py と同じ読み方。直したら両方そろえること。 */
  var cenCol = null, cenParts = [], inMerge = {}, standard = true;
  (ws["!merges"] || []).forEach(function(rg){
    var sr = rg.s.r + 1, er = rg.e.r + 1, sc = rg.s.c + 1, ec = rg.e.c + 1;
    if(!(sr >= b0 && er <= b1 && ec <= BC.cen[1])) return;
    for(var rr = sr; rr <= er; rr++) for(var cc2 = sc; cc2 <= ec; cc2++) inMerge[rr + "," + cc2] = 1;
    var tc = ws[XLSX.utils.encode_cell({r:rg.s.r, c:rg.s.c})], tv = cellText(tc && tc.v);
    if(tv) cenParts.push({r: sr, c: sc, v: tv, rich: RICH[XLSX.utils.encode_cell({r:rg.s.r, c:rg.s.c})]});
    if(sr === b0 && er === b1 && ec === BC.cen[1] && cenCol === null) cenCol = sc;
    else standard = false;
  });
  var cen = [];
  for(var r6 = b0; r6 <= b1; r6++)
    for(var c6 = BC.cen[0]; c6 <= BC.cen[1]; c6++){
      if(inMerge[r6 + "," + c6]) continue;
      var cc = at(r6, c6), nm3 = cellText(cc && cc.v);
      if(!nm3) continue;
      if(!cenNameLike(nm3)){ cenParts.push({r: r6, c: c6, v: nm3}); standard = false; continue; }
      if(cenCol && c6 >= cenCol) standard = false;
      cen.push({氏名: nm3, 段: r6 - b0, 列: c6, 社員: yel(r6, c6)});
    }
  cenParts.sort(function(a, b){ return a.c - b.c || a.r - b.r; });
  var cenText = cenParts.map(function(p){ return p.v; }).join("\n");
  /* 作業内容が1つのマスで、文字ごとの書式があれば読む（2026-10-06） */
  var cenFmt = null;
  if(cenParts.length === 1 && cenParts[0].rich){
    var rr = richRuns(cenParts[0].rich);
    if(rr && runsStyled(rr) && runsText(rr).trim() === cenText) cenFmt = rr;
  }
  if(!standard){ cen.forEach(function(p){ delete p.段; delete p.列; }); cenCol = null; }
  var rest = [];
  for(var r7 = b0; r7 <= b1; r7++){
    var row = [];
    for(var c7 = BC.rest[0]; c7 <= BC.rest[1]; c7++)
      row.push(cellText(at(r7,c7) && at(r7,c7).v));
    while(row.length < REST_COLS) row.push("");          /* 休みは 3行×7列にそろえる */
    rest.push(row);
  }
  var sn = BC.num.w === "below" ? at(b0, BC.num.c) : at(botHdr, BC.num.c);
  var total = subs.reduce(function(a, x){
    return a + (x.取りやめ ? 0 : (x.員数 || 0)); }, 0);

  return {
    日付: day, 版: MODE, 本社内勤欄の先頭行: os,
    現場: sites, 本社: office, 外注: subs,
    機材センター: cenFmt ? {人: cen, 作業内容: runsText(cenFmt), 書式: cenFmt, 結合開始列: cenCol}
                        : {人: cen, 作業内容: cenText, 結合開始列: cenCol},
    休み: rest,
    外注員数: (sn && typeof sn.v === "number") ? sn.v : total
  };
}

/* Excelで2行以上に分けて書かれた同じ現場を、1つの現場にまとめる（Vr002）。
   画面では1つの現場に何人でも入り、Excelに出すときに5人ずつの行に分ける。
     ・現場名が空の行に作業員だけがある … すぐ上の行と同じ現場（決まり事）
     ・すぐ上と現場名・区分が同じで、上の行が5人で埋まっていて、作業内容が空か同じ
       … 5人を超えたので次の行へ続けた書き方（現場名を繰り返し書いた日）
   作業内容が違うものは別の作業なので、まとめない。 */
function joinRows(sites){
  var out = [];
  sites.forEach(function(s){
    var p = out[out.length - 1];
    var cont = p && !s.現場名 && !s.元請 && !s.担当;
    var same = p && s.現場名 && nk(s.現場名) === nk(p.現場名) && s.区分 === p.区分 &&
      (!s.担当 || nk(s.担当) === nk(p.担当)) && p.作業員.length &&
      p.作業員.length % MAX_WORKERS === 0 && (!s.作業内容 || s.作業内容 === p.作業内容);
    if(cont || same){
      p.作業員 = p.作業員.concat(s.作業員);
      if(!p.作業内容) p.作業内容 = s.作業内容;
      p.担当が行った = p.担当が行った || s.担当が行った;
      return;
    }
    out.push(s);
  });
  return out;
}

/* =====================================================================
   名簿（マスター）の作成・編集（Vr002。社員・作業員の増減に備える。ユーザー要望）
   ・作業員: 氏名・社員（黄色の人）・退職（名簿から外す）
   ・担当: 担当欄に書く姓
   ・現場マスタ: 工事部会資料の「工事工程表【総括】」から現場コード・正式現場名を取り込む
   直したものはこのPCのブラウザに覚える。「名簿を書き出す」で JSON にして他のPCへ渡せる。
   ===================================================================== */
function openMaster(){
  var M = JSON.parse(JSON.stringify({作業員: MASTER.作業員, 担当: MASTER.担当,
    現場マスタ: MASTER.現場マスタ || []}));
  var dlg = document.createElement("div");
  dlg.className = "mdlg";
  dlg.innerHTML = '<div class="mbox"><h2>名簿（社員・作業員・現場）</h2>' +
    '<div class="mbar">' +
    '<button class="btn" data-a="add" title="名簿の最後に1人足す">人を足す</button>' +
    '<button class="btn" data-a="bukai" title="share内の工事部会資料から最新の現場名と現場コードを取得する。フォルダ（05_工事部会資料〔控〕 か、その中の期のフォルダ）を指定してください">工事部会資料から現場を取り込む</button>' +
    '<button class="btn" data-a="bukaiFile" title="工事工程表【総括】のExcelファイルを1つ以上選んで、現場名と現場コードを取り込む">総括ファイルを選んで取り込む</button>' +
    '<span class="spacer"></span>' +
    '<button class="btn" data-a="load" title="書き出しておいた名簿（JSON）を読み込む。他のPCで直した名簿を使うとき">名簿を読み込む</button>' +
    '<button class="btn" data-a="dump" title="いまの名簿をファイル（配置表名簿.json）に書き出す。他のPCへ渡すとき">名簿を書き出す</button>' +
    '<button class="btn" data-a="reset" title="このPCで直した名簿を捨てて、配った時点の名簿に戻す">配った時点に戻す</button>' +
    '<button class="btn main" data-a="ok" title="名簿を保存して画面に反映する">保存して閉じる</button>' +
    '<button class="btn" data-a="cancel" title="直したものを捨てて閉じる">やめる</button>' +
    '</div><div class="mbody"></div></div>';
  document.body.appendChild(dlg);
  var body = dlg.querySelector(".mbody");
  var draw = function(){
    var h = ['<table><tr><th style="width:36px">#</th><th>氏名（姓と名の間に空白）</th>' +
      '<th style="width:70px" title="黄色で書く社員">社員</th><th style="width:70px" title="名簿から外す">退職</th></tr>'];
    M.作業員.forEach(function(w, i){
      h.push('<tr><td>' + (i + 1) + '</td><td><input type="text" data-i="' + i + '" data-f="氏名" value="' +
        esc(w.氏名) + '"></td><td style="text-align:center"><input type="checkbox" data-i="' + i +
        '" data-f="社員"' + (w.社員 ? " checked" : "") + '></td><td style="text-align:center">' +
        '<input type="checkbox" data-i="' + i + '" data-f="退職"' + (w.退職 ? " checked" : "") + '></td></tr>');
    });
    h.push("</table>");
    h.push('<p style="margin:10px 0 4px">担当欄に書く姓（「、」で区切る）</p>' +
      '<input type="text" id="mTan" style="width:100%" value="' + esc(M.担当.join("、")) + '">');
    var ms = M.現場マスタ.slice().sort(function(a, b){ return String(b.現場コード).localeCompare(String(a.現場コード)); });
    h.push('<p style="margin:10px 0 4px">工事部会資料の現場（' + ms.length + ' 件。新しい順に先頭30件）</p>' +
      '<table><tr><th>現場コード</th><th>期</th><th>正式現場名</th><th>発注者</th><th>担当</th></tr>' +
      ms.slice(0, 30).map(function(r){ return "<tr><td>" + esc(r.現場コード) + "</td><td>" + esc(r.期) +
        "</td><td>" + esc(r.正式現場名) + "</td><td>" + esc(r.発注者) + "</td><td>" + esc(r.担当) + "</td></tr>"; })
        .join("") + "</table>");
    body.innerHTML = h.join("");
  };
  body.addEventListener("change", function(e){
    var t = e.target, i = t.dataset.i;
    if(i == null) return;
    var w = M.作業員[+i];
    if(t.type === "checkbox") w[t.dataset.f] = t.checked; else w[t.dataset.f] = t.value.trim();
  });
  var pickFiles = function(dir, cb){
    var inp = document.createElement("input");
    inp.type = "file";
    if(dir) inp.webkitdirectory = true; else { inp.multiple = true; inp.accept = ".xlsx,.xlsm"; }
    inp.onchange = function(){ cb(Array.prototype.slice.call(inp.files)); };
    inp.click();
  };
  var takeBukai = function(files){
    readBukai(files).then(function(res){
      var m = {};
      M.現場マスタ.forEach(function(r){ m[r.現場コード] = r; });
      var add = 0, upd = 0;
      res.rows.forEach(function(r){ if(m[r.現場コード]) upd++; else add++; m[r.現場コード] = r; });
      M.現場マスタ = Object.keys(m).sort().map(function(k){ return m[k]; });
      draw();
      toast("総括ファイル " + res.files + " 件を読みました（新しい現場 " + add + " 件・更新 " + upd + " 件）");
    }).catch(function(err){ toast("読み込めませんでした: " + err.message); });
  };
  dlg.querySelector(".mbar").addEventListener("click", function(e){
    var a = e.target.dataset && e.target.dataset.a;
    if(!a) return;
    M.担当 = (document.getElementById("mTan") || {value: M.担当.join("、")}).value
      .split(/[、,，\s]+/).filter(Boolean);
    if(a === "add"){ M.作業員.push({氏名: "", 社員: false}); draw();
      var ins = body.querySelectorAll('input[data-f="氏名"]'); ins[ins.length - 1].focus(); }
    else if(a === "bukai") pickFiles(true, takeBukai);
    else if(a === "bukaiFile") pickFiles(false, takeBukai);
    else if(a === "dump"){
      downloadText("配置表名簿.json", JSON.stringify(masterOut(M), null, 1));
    }else if(a === "load"){
      pickFiles(false, function(fs){
        if(!fs[0]) return;
        fs[0].text().then(function(t){
          var o = JSON.parse(t);
          if(o.作業員) M.作業員 = o.作業員;
          if(o.担当) M.担当 = o.担当;
          if(o.現場マスタ) M.現場マスタ = o.現場マスタ;
          draw(); toast(fs[0].name + " を読み込みました。「保存して閉じる」で反映します");
        }).catch(function(err){ toast("読み込めませんでした: " + err.message); });
      });
    }else if(a === "reset"){
      if(!confirm("このPCで直した名簿を捨てて、配った時点の名簿に戻しますか？")) return;
      try{ localStorage.removeItem(MASTER_KEY); }catch(err){}
      location.reload();
    }else if(a === "ok"){
      try{ localStorage.setItem(MASTER_KEY, JSON.stringify(masterOut(M))); }
      catch(err){ toast("このブラウザには保存できませんでした。「名簿を書き出す」でファイルに残してください"); return; }
      location.reload();
    }else if(a === "cancel") dlg.remove();
  });
  draw();
}
/* 名簿を保存する形。退職にした人と、名前の空の行は外す */
function masterOut(M){
  return {保存日: new Date().toISOString().slice(0, 10),
    作業員: M.作業員.filter(function(w){ return w.氏名 && !w.退職; })
      .map(function(w){ return {氏名: w.氏名, 社員: !!w.社員}; }),
    担当: M.担当, 現場マスタ: M.現場マスタ};
}

/* 工事部会資料の「工事工程表【総括】」→ 現場マスタ（クロジカ突合 site_master.py と同じ読み方）
   1現場が縦10行ほどのかたまり:  r行 A:現場コード B:発注者 C:担当 ／ r+2行 A:工事略称 C:担当 ／ r+4行 A:場所
   現場コードは6桁で 520001 = 52期の1番目。古い順に読み、同じコードは新しい資料の書き方で上書きする。 */
function readBukai(files){
  var xs = files.filter(function(f){
    return /\.xls[xm]$/i.test(f.name) && f.name.indexOf("総括") >= 0 && f.name.indexOf("~$") !== 0; });
  if(!xs.length) return Promise.reject(new Error("「総括」と名前の付いたExcelがありません"));
  var key = function(f){
    var m = /R0?(\d+)年\s*0?(\d+)月/.exec((f.webkitRelativePath || "") + "/" + f.name);
    return m ? (+m[1]) * 100 + (+m[2]) : 0;
  };
  xs.sort(function(a, b){ return key(a) - key(b); });
  var RE_CODE = /^([3-9][0-9])([0-9]{4})$/;
  var t = function(v){ return v == null ? "" : String(v).trim().replace(/\n/g, " "); };
  var rows = {};
  return xs.reduce(function(pr, f){
    return pr.then(function(){ return f.arrayBuffer(); }).then(function(buf){
      var wb = XLSX.read(buf, {type: "array"});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var g = function(r, c){ var x = ws[XLSX.utils.encode_cell({r: r - 1, c: c - 1})]; return t(x && x.v); };
      var rg = XLSX.utils.decode_range(ws["!ref"] || "A1:A1");
      for(var r = 1; r <= rg.e.r + 1; r++){
        var m = RE_CODE.exec(g(r, 1));
        if(!m) continue;
        var ki = +m[1];
        if(ki < 33 || ki > 60) continue;              /* 金額欄の 600000 などを弾く */
        var name = g(r + 2, 1);
        if(!name || RE_CODE.test(name) || /^\d+$/.test(name)) continue;
        var cur = rows[m[0]] || {};
        rows[m[0]] = {現場コード: m[0], 期: ki + "期", 正式現場名: name,
          発注者: g(r, 2) || cur.発注者 || "", 場所: g(r + 4, 1) || cur.場所 || "",
          担当: g(r + 2, 3) || g(r, 3) || cur.担当 || ""};
      }
    });
  }, Promise.resolve()).then(function(){
    return {files: xs.length, rows: Object.keys(rows).map(function(k){ return rows[k]; })};
  });
}

/* Excelを選んで読み込む */
function openXlsx(){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".xlsx,.xlsm";
  inp.onchange = function(){
    var f = inp.files[0];
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var got = readXlsx(fr.result);
      }catch(err){ toast("読み込めませんでした: " + err.message); return; }
      if(!got.日付){ toast("M1に日付がありません。配置表のファイルか確かめてください。"); return; }
      leaveView();
      D = got;
      resetHist("Excelを読み込む");
      $("#day").value = D.日付;
      /* 黄色があれば確定、無ければ予定とみなす（決まり事どおり）。あとで切替できる */
      var yellow = D.現場.some(function(s){
        return s.担当が行った || s.作業員.some(function(w){ return w.社員; }); });
      setMode(yellow ? "確定" : "予定");
      setProtect(true);
      toast(f.name + " を読み込みました（現場 " + D.現場.length + " 件 ／ " +
        (yellow ? "黄色あり＝確定とみなしました" : "黄色なし＝予定とみなしました") +
        "）。今日の表にするときは「🔒 保護中」を押して、カレンダーで今日を選び「この日の配置表を作る」");
    };
    fr.readAsArrayBuffer(f);
  };
  inp.click();
}

/* =====================================================================
   Excelを読み込む → 1ファイル／フォルダから一括（008.0001。2026-10-09 ユーザー要望）

   フォルダから一括は、フォルダの中の配置表（.xlsx/.xlsm）を全部読んで「このPCに保存した日」
   （IndexedDB）に入れる。画面には開かず、終わったら「保存した日を開く」の一覧を出す。
   - 「サブフォルダも読み込む」（最初からチェック）を外すと、選んだフォルダの直下だけ。
   - 予定／確定は、フォルダの道のりに「確定」「予定」があればそれ（NAS の 配置確定・配置予定表）、
     無ければ 1ファイルのときと同じく黄色の有無で決める。
   - 同じ日・同じ版が何ファイルもあれば、更新日時の新しいファイルを採る。
   - このPCにもうある日は、入力した分を消さないように飛ばす（「上書きする」にチェックしたときだけ置き換える）。
   - Excel が元にあるので、バックアップ済み（changed:false）として入れる。
   フォルダは <input webkitdirectory> で読む（NAS でも許可の確認で止まらない。vAsk と同じ）。
   ===================================================================== */

/* フォルダの中の配置表を読んで IndexedDB に入れる。終わりの知らせ（HTML）を返す */
async function xlsxBulk(files, sub, over, progress){
  var xs = files.filter(function(f){
    var parts = (f.webkitRelativePath || f.name).split("/");
    if(!sub && parts.length > 2) return false;          /* 選んだフォルダの直下だけ */
    return /\.xls[xm]$/i.test(f.name) && f.name.indexOf("~$") !== 0;
  });
  if(!xs.length) return '<b style="color:#c00">このフォルダには Excel（.xlsx）がありませんでした' +
    (sub ? "" : "（サブフォルダも読むときはチェックを入れてください）") + "。</b>";
  xs.sort(function(a, b){ return a.lastModified - b.lastModified; });   /* 新しいファイルを後に（後勝ち） */
  var got = {}, bad = [];
  for(var i = 0; i < xs.length; i++){
    var f = xs[i], path = f.webkitRelativePath || f.name;
    if(i % 5 === 0){
      progress("読んでいます… " + (i + 1) + " ／ " + xs.length + " ファイル<br><span style='font-size:13px;color:#555'>" + esc(path) + "</span>");
      await new Promise(function(r){ setTimeout(r, 0); });
    }
    var d;
    try{ d = readXlsx(await f.arrayBuffer()); }catch(err){ bad.push(path + "（" + err.message + "）"); continue; }
    if(!d || !d.日付){ bad.push(path + "（M1に日付がない）"); continue; }
    var dir = path.split("/").slice(0, -1).join("/"), mode;
    if(dir.indexOf("確定") >= 0) mode = "確定";
    else if(dir.indexOf("予定") >= 0) mode = "予定";
    else mode = d.現場.some(function(s){ return s.担当が行った || s.作業員.some(function(w){ return w.社員; }); })
      ? "確定" : "予定";
    d.版 = mode;
    got[dayKey(d.日付, mode)] = {d: d, path: path};
  }
  progress("このPCに入れています…");
  var have = {};
  (await kAll()).forEach(function(r){ have[r.key] = true; });
  var keys = Object.keys(got).sort(), put = {確定: 0, 予定: 0}, skip = [], now = new Date().toISOString();
  for(var j = 0; j < keys.length; j++){
    var k = keys[j], g = got[k];
    if(have[k] && !over){ skip.push(k); continue; }
    await kPut({key: k, 日付: g.d.日付, 版: g.d.版, data: g.d, saved: now, changed: false});
    LASTKEPT[k] = JSON.stringify(g.d);
    put[g.d.版]++;
  }
  updateKeepBar();
  var n = put.確定 + put.予定;
  var span = keys.length ? keys[0].slice(0, 10) + " 〜 " + keys[keys.length - 1].slice(0, 10) : "";
  var dup = xs.length - bad.length - keys.length;
  var title = "フォルダから " + n + " 日分を読み込みました" + (span ? "（" + span + "）" : "") + "。";
  var h = ['<div class="bk" style="padding:8px 12px;background:#e8f5e9">',
    "<b>" + esc(title) + "</b><br>",
    "読んだファイル " + xs.length + " ／ 確定 " + put.確定 + " 日・予定 " + put.予定 + " 日",
    dup > 0 ? "<br>同じ日のファイルが重なっていた " + dup + " 件は、更新日時の新しい方を採りました" : "",
    skip.length ? "<br>このPCにもうあった " + skip.length + " 日は飛ばしました（上書きするときはチェックを入れて、もう一度）" : "",
    "</div>"];
  if(bad.length) h.push('<details style="margin-top:6px"><summary style="color:#c00">配置表として読めなかったファイル ' + bad.length +
    ' 件</summary><div style="font-size:13px;max-height:160px;overflow:auto">' +
    bad.map(function(s){ return esc(s); }).join("<br>") + "</div></details>");
  if(n) h.push('<div style="margin-top:8px"><button class="btn main" data-a="show" data-title="' + esc(title) +
    '" style="font-size:15px;padding:8px 16px">カレンダーで開く</button></div>');
  return h.join("");
}

/* =====================================================================
   このPCのブラウザに日ごとに覚える（2026-10-01 ユーザー要望）

   Excelを読み込まなくても過去の日を開けるように、画面で扱った日を IndexedDB に自動で残す。
   **ブラウザの中だけなので、他のPCでは見えず、履歴の削除・故障で消える。**
   そのことを画面上の帯（#keepBar）で常に知らせ、「バックアップを保存」で
   1日1ファイルのJSON（fileName() と同じ名前・saveFile() と同じ中身）をフォルダへ書き出させる。

   localStorage にしないのは、file:// で開いたページはすべて同じ置き場を分け合い
   （原価管理などと共用）、5MB で頭打ちになるため。

   将来（ユーザー構想）: Excelに出力しなくても、この日ごとのJSONを正として
   フォルダから読んで過去の日を見る・出面集計がJSONを読む。そのためファイル名と中身は
   保存ボタン（saveFile）と同じにしてある。
   レコード: {key:"2026-10-01_確定", 日付, 版, data:D, saved:ISO日時, changed:バックアップ後に変わったか}
   ===================================================================== */
var KDB = null, KEEP_T = null, LASTKEPT = {};
var BACKUP_KEY = "haichi_last_backup_v1";
function kdb(){
  if(KDB) return KDB;
  KDB = new Promise(function(res, rej){
    if(!window.indexedDB){ rej(new Error("このブラウザは保存に対応していません")); return; }
    var r = indexedDB.open("haichi_days", 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("days", {keyPath: "key"}); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
  return KDB;
}
function kreq(mode, fn){
  return kdb().then(function(db){ return new Promise(function(res, rej){
    var tx = db.transaction("days", mode), st = tx.objectStore("days"), q = fn(st), out;
    if(q) q.onsuccess = function(){ out = q.result; };
    tx.oncomplete = function(){ res(out); };
    tx.onerror = function(){ rej(tx.error); };
  }); });
}
function kAll(){ return kreq("readonly", function(st){ return st.getAll(); }).then(function(a){ return a || []; }); }
function kPut(rec){ return kreq("readwrite", function(st){ return st.put(rec); }); }
function kDel(key){ return kreq("readwrite", function(st){ return st.delete(key); }); }
function dayKey(day, mode){ return day + "_" + (mode === "確定" ? "確定" : "予定"); }
function blankDay(d){
  return !d || (!(d.現場 || []).some(function(s){ return !blankSite(s); }) &&
    !(d.本社 || []).some(function(o){ return !blankOffice(o); }) &&
    !(d.外注 || []).some(function(b){ return !blankSub(b); }));
}
/* 画面を描くたびに呼ぶ。中身が変わっていれば少し待ってから覚える */
function keepDay(){
  clearTimeout(KEEP_T);
  KEEP_T = setTimeout(function(){
    if(!D || !D.日付 || blankDay(D) || LOCKED) return;
    D.版 = MODE;
    var key = dayKey(D.日付, MODE), s = JSON.stringify(D);
    if(LASTKEPT[key] === s) return;
    LASTKEPT[key] = s;
    kPut({key: key, 日付: D.日付, 版: MODE, data: JSON.parse(s), saved: new Date().toISOString(), changed: true})
      .then(updateKeepBar).catch(function(err){ toast("このPCに保存できませんでした: " + err.message); });
  }, 600);
}
function fmtTime(iso){
  if(!iso) return "";
  var d = new Date(iso), p = function(n){ return (n < 10 ? "0" : "") + n; };
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
var UNBACKED = 0;           /* まだバックアップしていない日の数（閉じるときに聞くかどうか） */
function updateKeepBar(){
  var bar = $("#keepBar");
  if(!bar) return;
  kAll().then(function(all){
    var nChg = all.filter(function(r){ return r.changed; }).length, last = null;
    UNBACKED = nChg;
    try{ last = localStorage.getItem(BACKUP_KEY); }catch(err){}
    bar.className = "keepbar noprint " + (nChg ? "calm" : "safe");
    $("#keepMsg").innerHTML = nChg
      ? "入力した配置表は、このPCに自動で残っています。まだバックアップしていない日が " + nChg + " 日分あります" +
        "（30分ごとと、閉じるときに「バックアップを取りますか？」とお聞きします）。"
      : "✔ このPCに残っている " + all.length + " 日分は、すべてバックアップ済みです" +
        (last ? "（最後のバックアップ " + fmtTime(last) + "）" : "") + "。";
  }).catch(function(err){
    bar.className = "keepbar noprint danger";
    $("#keepMsg").textContent = "⚠ このブラウザでは保存が使えません（" + err.message + "）。" +
      "「保存」ボタンでファイルに残してください。";
  });
}

/* 保存した日を開く（008.0002。2026-10-09 ユーザー要望で一覧表からカレンダーに）
   「配置表を見る」と同じ形: 年 → 月 → カレンダー。保存してある日に〇、押すと開く。
   条件（現場・作業員・下請）を入れると、合う日だけ〇が残り、下に合う日の一覧が出る。
   - 現場: 現場欄・外注欄の現場名に含む
   - 作業員: 現場の担当・作業員、本社内勤、機材センター、外注の担当、休み（名前に含む）
   - 下請: 外注欄の業者名に含む
   現場と一緒に入れたときは、その現場の行の中で作業員・下請を探す（「この現場に○○が行った日」）。
   比べるときは空白を除き、全角半角をそろえる（dsNorm）。
   title を渡すと上に案内を出す（バックアップから戻す・フォルダから一括のあと）。 */
var DS = {kind: null, cm: null, site: "", man: "", sub: "", del: false};
function dsNorm(s){ return String(s == null ? "" : s).normalize("NFKC").replace(/\s/g, "").toLowerCase(); }
/* 1日分が条件に合うか。合えば何が合ったか（文字の配列）、合わなければ null */
function dsHit(d){
  var fs = dsNorm(DS.site), fm = dsNorm(DS.man), fb = dsNorm(DS.sub);
  if(!fs && !fm && !fb) return [];
  var has = function(v, f){ return dsNorm(v).indexOf(f) >= 0; };
  var nm = function(w){ return w && (w.氏名 || w.name || (typeof w === "string" ? w : "")); };
  var out = [], siteOk = false;
  (d.現場 || []).forEach(function(s){
    if(!s.現場名 && !s.担当 && !(s.作業員 || []).length) return;
    if(fs && !has(s.現場名, fs)) return;
    var ok = true, why = [];
    if(fm){
      var ps = [s.担当].concat((s.作業員 || []).map(nm)).filter(function(x){ return x && has(x, fm); });
      ok = ps.length > 0; if(ok) why.push(ps.join("・"));
    }
    if(fb) ok = false;                         /* 業者は外注欄だけ */
    if(ok){ siteOk = true; out.push((s.現場名 || "（現場名なし）") + (why.length ? "：" + why.join("") : "")); }
  });
  (d.外注 || []).forEach(function(b){
    if(fs && !has(b.現場名, fs)) return;
    if(!b.現場名 && !b.業者) return;
    var ok = true, why = [];
    if(fm){ ok = !!b.担当 && has(b.担当, fm); if(ok) why.push(b.担当); }
    if(fb){ ok = ok && !!b.業者 && has(b.業者, fb); if(ok) why.push(b.業者); }
    if(ok){ siteOk = true; out.push((b.現場名 || "（現場名なし）") + "（外注）" + (why.length ? "：" + why.join("・") : "")); }
  });
  if(fm && !fs && !fb){
    (d.本社 || []).forEach(function(o){ if(o.氏名 && has(o.氏名, fm)) out.push("本社内勤：" + o.氏名); });
    ((d.機材センター || {}).人 || []).forEach(function(w){ var n = nm(w); if(n && has(n, fm)) out.push("機材センター：" + n); });
    (d.休み || []).forEach(function(row){ (row || []).forEach(function(n){ if(n && has(n, fm)) out.push("休み：" + n); }); });
  }
  return out.length ? out : null;
}
/* 入力の候補（保存してある日の中にある名前） */
function dsLists(all){
  var S = {}, M = {}, B = {}, add = function(o, v){ v = String(v || "").trim(); if(v) o[v] = 1; };
  all.forEach(function(r){
    var d = r.data || {};
    (d.現場 || []).forEach(function(s){ add(S, s.現場名); add(M, s.担当);
      (s.作業員 || []).forEach(function(w){ add(M, w && w.氏名); }); });
    (d.外注 || []).forEach(function(b){ add(S, b.現場名); add(M, b.担当); add(B, b.業者); });
    (d.本社 || []).forEach(function(o){ add(M, o.氏名); });
    ((d.機材センター || {}).人 || []).forEach(function(w){ add(M, w && w.氏名); });
  });
  var opt = function(o){ return Object.keys(o).sort().map(function(v){ return '<option value="' + esc(v) + '">'; }).join(""); };
  return '<datalist id="dsLs">' + opt(S) + '</datalist><datalist id="dsLm">' + opt(M) + '</datalist><datalist id="dsLb">' + opt(B) + "</datalist>";
}
/* ---- NAS の日（008.0005。「配置表を見る」を日付のカレンダーにまとめた）----
   配置表データ（bat が NAS の Excel 全部から作る 年ごとの 2026.js など）＋ 追加分.js（Excelに出力した日）。
   読み方は「配置表を見る」（vIndex／vYearData／vAdd）と同じ。年のファイルは押した年だけ読む（条件を入れたときは全部）。
   このPCにもある日は、このPCの方を開く（入力・直した分がこちらにあるため）。 */
var NASC = {};                                         /* "確定2026" → {iso: {path, root, data}} */
function nasYearsAll(){
  var ys = {};
  if(VIDX){ Object.keys(VIDX.年 || {}).forEach(function(y){ ys[y] = 1; }); Object.keys(vAddYears()).forEach(function(y){ ys[y] = 1; }); }
  return ys;
}
function nasLoaded(kind, y){ return !!NASC[kind + y] || !vHasYear(String(y)); }
function nasLoad(kind, y){
  y = String(y);
  if(nasLoaded(kind, y)) return Promise.resolve();
  return vYearData(y).then(function(yd){
    ["確定", "予定"].forEach(function(k){ NASC[k + y] = (yd && yd[k]) || {}; });
  }).catch(function(){ NASC[kind + y] = {}; });
}
function nasMap(kind, y){
  y = String(y);
  var box = Object.assign({}, NASC[kind + y] || {}), add = vAdd()[kind] || {};
  Object.keys(add).forEach(function(iso){ if(iso.slice(0, 4) === y) box[iso] = add[iso]; });
  return box;

var STEPPING = false;
async function dayStep(n){
  if(VW.idx >= 0){ vStep(n); return; }
  if(STEPPING) return;
  STEPPING = true;
  try{
    await vIndex();
    var kind = MODE, cur = (D && D.日付) || todayStr();
    var local = {};
    (await kAll()).forEach(function(r){ if(r.版 === kind) local[r.日付] = r; });
    var ys = Object.assign({}, nasYearsAll());
    Object.keys(local).forEach(function(k){ ys[k.slice(0, 4)] = 1; });
    var yl = Object.keys(ys).sort();
    if(n < 0) yl.reverse();
    yl = yl.filter(function(y){ return n > 0 ? y >= cur.slice(0, 4) : y <= cur.slice(0, 4); });
    for(var i = 0; i < yl.length; i++){
      var y = yl[i];
      await nasLoad(kind, y);
      var nm = nasMap(kind, y), days = {};
      Object.keys(nm).forEach(function(k){ days[k] = 1; });
      Object.keys(local).forEach(function(k){ if(k.slice(0, 4) === y) days[k] = 1; });
      var ks = Object.keys(days).filter(function(k){ return n > 0 ? k > cur : k < cur; }).sort();
      if(ks.length){
        var k = n > 0 ? ks[0] : ks[ks.length - 1];
        if(local[k]) openKept(local[k], true); else openNas(k, kind, nm[k], true);
        toast(fmtDayBtn(k) + "（" + kind + "）" + (local[k] ? "" : " NAS"));
        return;
      }

    toast((n > 0 ? "これより後" : "これより前") + "の" + kind + "の表はありません");
  }catch(err){ toast("開けませんでした: " + err.message); }
  finally{ STEPPING = false; }
}

/* =====================================================================

   - 赤い帯で「危険」と知らせるのをやめ、開いてから30分ごと（まだバックアップしていない日があるとき）と、
     表を閉じようとしたときに「バックアップを取りますか？」と聞く。

   - ファイルは期ごと（9月始まり。第52期＝2026年9月〜2027年8月。出面集計と同じ）に1つ。
     名前は「第52期配置表_10月08日まで.json」（中の一番新しい日付。保存した日付だけだと「その日の分」と
     勘違いされた。ユーザー指定）。同じ名前のファイルがもうあれば、中身を読んで合わせてから書く
     （同じ日に別の人が保存しても、その人の分が消えないように。日ごとに新しい方を採る）。
   - 戻したら、1日分ならその日を画面に開き、何日分もあれば一覧を出す
     （10/6 の件: 戻しても画面が変わらず「中身がない」と思われていた）。
   ===================================================================== */
var BACKUP_DIR = "\\\\192.168.0.15\\share\\33_配置表\\配置表バックアップ";
var ASK_MS = 30 * 60 * 1000, ASK_T = null;
function scheduleAsk(ms){ clearTimeout(ASK_T); ASK_T = setTimeout(function(){ askBackup("timer"); }, ms || ASK_MS); }
function p2(n){ return (n < 10 ? "0" : "") + n; }
/* 期（9月始まり。2026年9月〜2027年8月 が第52期） */
function kiOf(day){ var q = String(day).split("-"); return +q[0] - (+q[1] >= 9 ? 1974 : 1975); }
function backupName(ki, days){
  var last = days.slice().sort().pop(), q = last.split("-");

/* 期ごとに分ける → [{ki, recs, n:まだバックアップしていない数}]（新しい期から） */
function byKi(all){
  var m = {};
  all.forEach(function(r){ var k = kiOf(r.日付); (m[k] = m[k] || []).push(r); });
  return Object.keys(m).map(Number).sort(function(a, b){ return b - a; }).map(function(k){
    return {ki: k, recs: m[k], n: m[k].filter(function(r){ return r.changed; }).length};
  });

function bkDialog(title, body, mainLabel, onMain, onCancel, cancelLabel){

/* 「バックアップを取りますか？」（why: timer＝30分たった／close＝閉じようとした／button＝ボタン） */

    bkDialog("バックアップを取る", head +
      "<p>" + (n ? "まだバックアップしていない日が <b>" + n + " 日分</b>あります。" : "") +
      "<b>第" + g.ki + "期</b>の配置表（このPCに残っている " + g.recs.length + " 日分）を、1つのファイル「<b>" +
      esc(backupName(g.ki, g.recs.map(function(r){ return r.日付; }))) + "</b>」にまとめて NAS に保存します。" +
      (todo.length > 1 ? "続けて第" + todo[1].ki + "期の分もお聞きします。" : "") +
      "PC が壊れても、ほかの PC でも戻せます。</p>" +
      "<p style=\"margin:8px 0 0\"><b>保存する場所</b>（必ずここへ）</p>" + pathBox() +
      "<ol><li>「<b>場所をコピー</b>」を押す</li>" +
      "<li>「<b>バックアップを取る</b>」を押すと保存の画面が出ます</li>" +

/* バックアップを保存（その期の全部の日を1つのファイルへ。保存の画面が出せなければダウンロード）。保存できたら true */
async function backupDays(ki){
  var all;
  try{ all = await kAll(); }
  catch(err){ alert("このPCに保存した日を読めませんでした。\n（" + (err && err.message || err) + "）"); return false; }
  all = all.filter(function(r){ return kiOf(r.日付) === ki; });
  if(!all.length){ alert("まだこのPCに保存した日がありません。"); return false; }
  var done = function(){
    try{ localStorage.setItem(BACKUP_KEY, new Date().toISOString()); }catch(err){}
    return Promise.all(all.map(function(r){ r.changed = false; return kPut(r); })).then(updateKeepBar);
  };
  /* 書く中身: このPCの日 ＋（同じファイルが既にあれば）そのファイルの日。同じ日は保存の新しい方 */
  var make = function(old){
    var m = {};
    (old || []).forEach(function(x){ m[dayKey(x.d.日付, x.d.版)] = x; });
    all.forEach(function(r){
      var k = r.key, x = m[k];
      if(!x || !x.at || (r.saved || "") >= x.at){ var d = r.data; d.版 = r.版; m[k] = {d: d, at: r.saved || ""}; }
    });
    var keys = Object.keys(m).sort(), xs = keys.map(function(k){ return m[k]; });
    return {name: backupName(ki, xs.map(function(x){ return x.d.日付; })),
      text: JSON.stringify({種類: "配置表バックアップ", 期: ki, 作成: new Date().toISOString(),
        日: xs.map(function(x){ return x.d; }), 保存: xs.map(function(x){ return x.at; })}, null, 1)};
  };
  var out = make(null);
  if(window.showSaveFilePicker){
    var fh;
    try{
      fh = await window.showSaveFilePicker({id: "haichi_backup", suggestedName: out.name,
        types: [{description: "配置表のバックアップ", accept: {"application/json": [".json"]}}]});
    }catch(err){
      if(err && err.name === "AbortError"){ toast("バックアップを取りやめました"); return false; }
      fh = null;                                    /* 画面が出せないときはダウンロードへ */
    }
    if(fh){
      try{
        var oldF = await fh.getFile();               /* 置き換えを選んだとき: 前の中身と合わせる */
        if(oldF.size) out = make(backupItems(JSON.parse((await oldF.text()).replace(/^﻿/, "")),
          new Date(oldF.lastModified).toISOString()));
      }catch(err){ /* 新しいファイル・読めないファイルはこのPCの分だけ */ }
      try{
        var w = await fh.createWritable(); await w.write(out.text); await w.close();
        await done();
        alert("第" + ki + "期の " + JSON.parse(out.text).日.length + " 日分を「" + fh.name + "」に保存しました。");
        return true;
      }catch(err){ alert("書き込めませんでした（" + err.message + "）。ダウンロードフォルダへ保存します。"); }
    }
  }
  downloadText(out.name, out.text);
  await done();
  alert("ダウンロードフォルダに保存しました。\n" + out.name + "\n\n" + BACKUP_DIR + "\nへ移してください。");
  return true;
}
/* バックアップのファイルの中身 → [{d: 日のデータ, at: その日を保存した時刻}] */
function backupItems(o, fileAt){
  var got = [];
  if(o && o.種類 === "配置表バックアップ" && Array.isArray(o.日))
    o.日.forEach(function(d, j){ if(d && d.日付) got.push({d: d, at: (o.保存 && o.保存[j]) || o.作成 || fileAt}); });
  else if(o && o.日付 && o.現場) got.push({d: o, at: fileAt});
  return got;
}

async function pickBackupFiles(){
  var files = [];
  if(window.showOpenFilePicker){
    try{
      var hs = await window.showOpenFilePicker({id: "haichi_backup", multiple: true,
        types: [{description: "配置表のバックアップ", accept: {"application/json": [".json"]}}]});
      for(var i = 0; i < hs.length; i++) files.push(await hs[i].getFile());
    }catch(err){
      if(err && err.name === "AbortError") return;
      files = null;
    }
  }else files = null;
  if(files) return importBackup(files);
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json"; inp.multiple = true;
  inp.onchange = function(){ importBackup(Array.prototype.slice.call(inp.files)); };
  inp.click();
}
/* まとめたファイルでも、1日1ファイル（Vr007 まで・「保存」ボタン）を複数選んでもよい */
async function importBackup(files){
  var got = [];                                     /* {d: 日のデータ, at: その日を保存した時刻} */
  for(var i = 0; i < files.length; i++){
    try{
      var o = JSON.parse((await files[i].text()).replace(/^﻿/, ""));
      got = got.concat(backupItems(o, new Date(files[i].lastModified || Date.now()).toISOString()));
    }catch(err){}
  }
  if(!got.length){ alert("配置表のバックアップが見つかりませんでした。\n「第○期配置表_○月○日まで」のファイルを選んでください。"); return; }
  var have = {};
  (await kAll()).forEach(function(r){ have[r.key] = r; });
  var put = [], kept = 0;
  for(var j = 0; j < got.length; j++){
    var d = got[j].d, v = d.版 === "確定" ? "確定" : "予定", key = dayKey(d.日付, v);
    var h = have[key];
    /* このPCの方があとで直されていて、まだバックアップしていないなら、このPCのものを残す */
    if(h && h.changed && h.saved && h.saved > got[j].at){ kept++; continue; }
    d.版 = v; LASTKEPT[key] = JSON.stringify(d);
    var rec = {key: key, 日付: d.日付, 版: v, data: d, saved: got[j].at, changed: false};
    await kPut(rec); have[key] = rec; put.push(rec);
  }
  updateKeepBar();
  var msg = put.length + " 日分を戻しました。" + (kept ? "（" + kept + " 日分は このPCの方が新しいので、このPCのものを残しました）" : "");
  if(put.length === 1){ openKept(put[0]); alert(msg + "\n" + put[0].日付 + "（" + put[0].版 + "）を開きました。"); }
  else if(put.length || kept) openDays("✔ " + esc(msg) + "<br>開きたい日の〇を押してください。");
}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(err){}

function downloadText(name, text){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "application/json"}));
  a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

   年は「今日にいちばん近い年（先は60日まで）」とみなす（開けば M1 の日付が正）。
   選んだフォルダは IndexedDB `haichi_view` に覚え、次からは押すだけで開く（ブラウザが許可を聞き直すことはある）。
   NAS 上の html（file://192.168.0.15/…）ではフォルダ選択の許可が出ないことがある（原価管理で実際にあった）ので、
   そのときは <input webkitdirectory> でフォルダを読む（この方法は覚えられないので毎回選ぶ）。

   **開いた日はロックする**（うっかり直さないため。ユーザー指定）。ロック中は表と名簿に触れず、
   直す・保存するボタンを隠し、このPCへの自動保存（keepDay）もしない。「編集できるようにする」で解除する。

var LOCKED = false;
var VW = {kind: "確定", list: [], idx: -1, before: null};
var VH = {};                 /* 選んだフォルダ {確定: handle, 予定: handle} */
function vdb(){
  return new Promise(function(res, rej){
    if(!window.indexedDB){ rej(new Error("no indexedDB")); return; }
    var r = indexedDB.open("haichi_view", 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("h"); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function vget(k){ return vdb().then(function(db){ return new Promise(function(res){
  var q = db.transaction("h").objectStore("h").get(k);
  q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); }; }); }).catch(function(){ return null; }); }
function vput(k, v){ return vdb().then(function(db){ return new Promise(function(res){
  var tx = db.transaction("h", "readwrite"); tx.objectStore("h").put(v, k);
  tx.oncomplete = res; tx.onerror = res; }); }).catch(function(){}); }

/* 「10月02日.xlsx」「１０月２日.xlsx」→ {m, d}。配置表でないファイル・Excelの一時ファイルは null */
function vParse(name){
  if(/^~\$/.test(name)) return null;
  var s = name.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
  var m = s.match(/^(\d{1,2})月(\d{1,2})日\.xls[xm]$/i);
  if(!m || +m[1] < 1 || +m[1] > 12 || +m[2] < 1 || +m[2] > 31) return null;
  return {m: +m[1], d: +m[2]};
}
function vGuess(m, d){
  var now = new Date(), best = null;
  [now.getFullYear() - 1, now.getFullYear(), now.getFullYear() + 1].forEach(function(y){
    var diff = (new Date(y, m - 1, d) - now) / 864e5;
    if(diff > 60) return;
    if(!best || Math.abs(diff) < Math.abs(best.diff)) best = {y: y, diff: diff};
  });
  var p = function(n){ return (n < 10 ? "0" : "") + n; };
  return best.y + "-" + p(m) + "-" + p(d);
}
/* 一覧にする。同じ日が直下と月のフォルダの両方にあれば、更新日時の新しいほう */
async function vCollect(items){
  var by = {};
  for(var i = 0; i < items.length; i++){
    var it = items[i], iso = vGuess(it.m, it.d), o = by[iso];
    if(o){
      var a = await o.get(), b = await it.get();
      if(b.lastModified <= a.lastModified) continue;
    }
    it.iso = iso; by[iso] = it;
  }
  return Object.keys(by).sort().map(function(k){ return by[k]; });
}
/* フォルダ（File System Access）の直下と、その1つ下のフォルダを見る */
async function vScanHandle(dh){
  var items = [];
  var walk = async function(d, path, depth){
    for await (var ent of d.values()){
      if(ent.kind === "directory"){ if(depth < 1) await walk(ent, path + ent.name + "\\", depth + 1); continue; }
      var p = vParse(ent.name);
      if(p) items.push({m: p.m, d: p.d, path: path + ent.name,
        get: (function(h){ return function(){ return h.getFile(); }; })(ent)});
    }
  };
  await walk(dh, "", 0);
  return vCollect(items);
}
/* <input webkitdirectory> で選んだファイル（フォルダ選択の許可が出ないとき） */
function vScanFiles(files){
  var items = [];
  files.forEach(function(f){
    var parts = (f.webkitRelativePath || f.name).split("/");
    if(parts.length > 3) return;                  /* 選んだフォルダの直下と、その1つ下まで */
    var p = vParse(f.name);
    if(p) items.push({m: p.m, d: p.d, path: parts.slice(1).join("\\"),
      get: function(){ return Promise.resolve(f); }});
  });
  return vCollect(items);
}

/* その種類（確定／予定）のフォルダを読んで VW.list を作る。again=true は選び直し */
async function vLoad(kind, again){
  VW.kind = kind;
  var h = again ? null : (VH[kind] || await vget(kind));
  if(h && h.queryPermission){
    try{
      var st = await h.queryPermission({mode: "read"});
      if(st !== "granted") st = await h.requestPermission({mode: "read"});
      if(st === "granted"){ VH[kind] = h; VW.list = await vScanHandle(h); VW.src = h.name; return true; }
    }catch(err){}
  }
  var got = await vAsk(kind);
  if(!got) return false;
  if(got.h){
    try{ VW.list = await vScanHandle(got.h); }
    catch(err){ toast("フォルダを読めませんでした: " + err.message); return false; }
    VH[kind] = got.h; vput(kind, got.h); VW.src = got.h.name;
    return true;
  }
  VW.list = await vScanFiles(got.files); VW.src = (got.files[0].webkitRelativePath || "").split("/")[0];
  return true;
}

function parseCsv(text){

      else f += c;
    }else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){

    }else f += c;
  }

function readKuroCsv(buf){
  var u8 = new Uint8Array(buf), text;
  if(u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) text = new TextDecoder("utf-8").decode(u8.subarray(3));
  else{
    try{ text = new TextDecoder("utf-8", {fatal: true}).decode(u8); }
    catch(err){ text = new TextDecoder("shift_jis").decode(u8); }
  }
  var rows = parseCsv(text);
  if(!rows.length) return [];
  var head = rows[0].map(function(h){ return String(h).trim(); }), ix = function(n){ return head.indexOf(n); };
  var iD = ix("開始日"), iS = ix("予定"), iC = ix("内容"), iN = ix("名前");
  if(iD < 0 || iS < 0 || iC < 0) throw new Error("クロジカのCSVではないようです（「開始日」「予定」「内容」の列がありません）");
  var out = [];
  rows.slice(1).forEach(function(r){
    var day = kuroDay(r[iD]);
    if(!day) return;
    out.push({日付: day, 予定: String(r[iS] || "").trim(), 内容: String(r[iC] || "").replace(/\r\n?/g, "\n"),
              名前: iN >= 0 ? String(r[iN] || "").split(",").map(function(x){ return x.trim(); }).filter(Boolean) : []});
  });
  return out;
}
/* 内容 → 作業内容（drop: 報告の言葉を除く） */
function kuroClean(t, drop){
  var seen = {}, out = [];
  String(t || "").split("\n").forEach(function(l){
    l = l.replace(/^[\s　・\-－]+|[\s　]+$/g, "");
    if(!l) return;
    if(drop && RE_KURO_DONE.test(l.normalize("NFKC").replace(/\s/g, ""))) return;
    var k = l.normalize("NFKC").replace(/\s/g, "");
    if(seen[k]) return;
    seen[k] = 1; out.push(l);
  });
  return out.join("　");
}
/* 比べるための形: ヶ・ケ・が→ガ（由比ヶ浜／由比ガ浜）、二丁目・第一工区→2丁目・第1工区、ハイフンや化けた「?」を外す */
function kuroKey(x){
  return siteKey(String(x || "").normalize("NFKC")
    .replace(/[ヶケヵが]/g, "ガ")
    .replace(/([一二三四五六七八九])(丁目|工区|号)/g, function(a, k, u){ return ("一二三四五六七八九".indexOf(k) + 1) + u; })
    .replace(/[-?‐－−―]/g, ""));
}
/* クロジカの1件 → 現場の行の番号（当てはまらなければ -1）
   点数: 名前が同じ（配置表の書き方・寄せ先・工事部会資料の正式名のどれか）か現場コードが同じ＝3、
         片方が片方を含む＝2、括弧の中を外して含む（「浄明寺(センター荷下ろし、積込)」）＝1。
   いちばん点の高い行のうち、昼夜が合う行を採る（008.0013。実物の CSV 4月・10月で確かめて足した） */
function kuroMatch(e){
  var b = kuroBase(e.予定);
  if(!b.site || RE_KURO_NOTSITE.test(b.site) || RE_KURO_REST.test(b.site) || b.site === "本社") return -1;
  var bare = b.site.replace(/\([^)]*\)?/g, "").trim();
  var ek = [b.site, SITE_ALIAS_K[siteKey(b.site)] || ""].filter(Boolean).map(kuroKey);
  var bk = bare && bare !== b.site ? kuroKey(bare) : "";
  var code = (siteInfo(b.site) || {}).現場コード;
  var night = /夜/.test(e.予定), best = 0, hit = [];
  var inc = function(a, c){ return a.length >= 2 && c.length >= 2 && (a.indexOf(c) >= 0 || c.indexOf(a) >= 0); };
  D.現場.forEach(function(st, i){
    if(!st || !st.現場名) return;
    var info = siteInfo(st.現場名) || {};
    var rk = [st.現場名, SITE_ALIAS_K[siteKey(st.現場名)] || "", info.正式現場名 || ""].filter(Boolean).map(kuroKey);
    var sc = 0;
    if((code && info.現場コード && code === info.現場コード) || ek.some(function(a){ return rk.indexOf(a) >= 0; })) sc = 3;
    else if(ek.some(function(a){ return rk.some(function(c){ return inc(a, c); }); })) sc = 2;
    else if(bk && rk.some(function(c){ return inc(bk, c); })) sc = 1;
    if(!sc) return;
    if(sc > best){ best = sc; hit = []; }
    if(sc === best) hit.push(i);
  });
  if(!hit.length) return -1;
  var byShift = hit.filter(function(i){ return /夜/.test(D.現場[i].区分 || "") === night; });
  return (byShift.length ? byShift : hit)[0];
}
/* CSV を選ぶ（008.0014）。ダウンロードのフォルダを開いて選ぶ形（showOpenFilePicker の startIn:"downloads"、
   2回目からは前に選んだ場所）。008.0013 のフォルダを覚える形は、Chrome が「ダウンロード」フォルダを
   「システムファイルが含まれているので開けません」と断るためやめた（〇〇さんの PC で発生。2026-10-13）。 */
function openKuro(){
  if(LOCKED){ toast("「🔒 保護中」を押して、編集できるようにしてから取り込んでください"); return; }
  openKuroFile();
}
function openKuroFile(){
  if(window.showOpenFilePicker){
    /* await を挟まずに開く（押した直後でないと開けない） */
    window.showOpenFilePicker({id: "haichi_kuro_csv", startIn: "downloads", multiple: false,
      types: [{description: "クロジカの CSV", accept: {"text/csv": [".csv"]}}]})
      .then(function(hs){ return hs[0].getFile(); })
      .then(function(f){ kuroLoad(f); })
      .catch(function(err){
        if(err && err.name === "AbortError") return;           /* 選ぶ画面で「キャンセル」 */
        kuroInput();                                           /* 開けなければ昔ながらの選び方 */
      });
    return;
  }
  kuroInput();
}
function kuroInput(){
  var f = $("#kuroFile");
  f.value = "";
  f.onchange = function(){
    var file = f.files && f.files[0];
    if(file) kuroLoad(file);
  };
  f.click();
}
function kuroLoad(file){
  return file.arrayBuffer().then(function(buf){
    var all = readKuroCsv(buf);
    if(!all.length){ alert("CSV に予定がありません"); return; }
    kuroDialog(all, file.name);
  }).catch(function(err){ alert("読めませんでした: " + err.message); });
}

/* 起動したとき: 今日の確定 → 今日の予定 → いちばん新しい日 を保護で開く。何も無ければ白紙の今日（保護） */
function openStartDay(){
  var today = todayStr(), y = today.slice(0, 4), py = String(+y - 1);
  return Promise.all([kAll(), vIndex().catch(function(){ return null; })]).then(function(res){
    var all = res[0], by = {};
    all.forEach(function(r){ by[r.key] = r; });
    var r = by[dayKey(today, "確定")] || by[dayKey(today, "予定")];
    if(r){ openKept(r, true); return; }
    /* 今日までのいちばん新しい日（このPC＋NAS）。同じ日なら確定、同じ日・同じ版ならこのPC */
    return Promise.all([nasLoad("確定", y), nasLoad("確定", py)]).then(function(){
      var c = [];
      all.forEach(function(x){ if(x.日付 <= today) c.push({iso: x.日付, k: x.版, r: x}); });
      ["確定", "予定"].forEach(function(k){ [y, py].forEach(function(yy){
        var nm = nasMap(k, yy);
        Object.keys(nm).forEach(function(iso){ if(iso <= today) c.push({iso: iso, k: k, n: nm[iso]}); });
      }); });
      var rank = function(o){ return o.iso + (o.k === "確定" ? "2" : "1") + (o.r ? "2" : "1"); };
      c.sort(function(a2, b2){ return rank(a2) < rank(b2) ? 1 : -1; });
      if(!c.length && all.length) c = [{r: all.sort(function(a2, b2){ return a2.key < b2.key ? 1 : -1; })[0]}];
      if(!c.length){ setProtect(true); return; }
      if(c[0].r) openKept(c[0].r, true); else openNas(c[0].iso, c[0].k, c[0].n, true);
    });
  }).catch(function(){ setProtect(true); });
}

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>配置表（見るだけ）</title>

<!-- 既存の配置表(xlsx)を読む／Excelに出力するときのzipに使う。塗り（黄色＝社員）も読める。 -->

<!-- Excel出力の白紙テンプレート（tools/make_template_js.py が作る） -->

<style>
/* ===== 全体 ===== */
:root{
  --line2:#d7dce3; --sel:#0072B2; --bg:#f5f6f8;
  --cyan:#ccffff; --yellow:#ffff00;
  /* 配置表の実寸。列幅 8.78文字（既定フォント14pt）≒ 98px、行高 21.95pt ≒ 29px */
  --colW:98px; --rowH:29px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#111;
  font:12px/1.4 "Yu Gothic UI","Meiryo",system-ui,sans-serif}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:8px 12px;background:#fff;border-bottom:1px solid var(--line2);
  position:sticky;top:0;z-index:20}
.bar b{font-size:13px}
.bar .btn,.bar .undogrp{white-space:nowrap;flex:none}   /* 幅が狭くてもボタンを縦に潰さない（008.0012） */
.btn{padding:5px 11px;border:1px solid #c3c9d2;border-radius:5px;background:#fff;
  cursor:pointer;font-size:12px}
.btn:hover{background:#eef2f8}
.btn.on{background:var(--sel);color:#fff;border-color:var(--sel)}
.btn.main{background:#0a7d32;color:#fff;border-color:#0a7d32;font-weight:600}
/* 元に戻す・やり直す・履歴（008.0012。目立つ所に） */
.undogrp{display:inline-flex;gap:2px;border:2px solid #0072B2;border-radius:6px;padding:1px;background:#e3f2fd}
.btn.undo{font-size:14px;font-weight:700;color:#0d3c61;background:#fff;border-color:#9cc3e5}
.btn.undo:disabled{opacity:.45}
.uchip{position:fixed;left:16px;bottom:16px;z-index:70;background:#263238;color:#fff;border-radius:8px;padding:8px 10px 8px 14px;
  font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;max-width:min(560px,90vw)}
.uchip .btn{background:#ffd54f;border-color:#ffd54f;color:#000;font-weight:700}
.hlist{position:absolute;z-index:65;background:#fff;border:1px solid #888;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.2);
  max-height:60vh;overflow:auto;min-width:300px;font-size:14px}
.hlist div{padding:6px 14px;cursor:pointer;white-space:nowrap}
.hlist div:hover{background:#e3f2fd}
.hlist div.cur{background:#0072B2;color:#fff;font-weight:700}
.hlist div.fut{color:#999}
.hlist .hh{cursor:default;background:#f5f5f5;font-size:12px;color:#555}
/* 確認して終える */
.ckdlg h3{font-size:15px;margin:10px 0 4px;color:#1f4e8c}
.ckdlg ul{margin:0;padding-left:1.3em;line-height:1.8}
.ckdlg .ckw li{color:#a0400a}
.ckdlg .cknone{color:#2e7d32}
.btn.main:hover{background:#086a2a}
.btn[disabled]{opacity:.45;cursor:default}
.spacer{flex:1}
.hint{color:#5b6470;font-size:11px}
.state{font-size:11px;color:#5b6470}

/* ===== 左の人のパレット（画面だけ。印刷しない） ===== */
.wrap{display:flex;gap:12px;align-items:flex-start;padding:12px}
/* 名簿も Excel の表と同じ見た目にする（Vr002。角丸の枠で囲まない。ユーザー指定） */
.pal{width:180px;flex:none;background:#fff;border:1px solid #000;
  padding:0 0 8px;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}
.pal h3{margin:0;padding:3px 6px;font-size:12px;font-weight:normal;text-align:center;
  background:#4472c4;color:#fff;border-bottom:1px solid #000}
.pal .pgrid{display:grid;grid-template-columns:1fr 1fr}
.chip{display:block;padding:0 4px;height:26px;line-height:26px;text-align:center;
  border-right:1px solid #000;border-bottom:1px solid #000;background:#fff;cursor:grab;
  font:14px "ＭＳ Ｐ明朝","MS PMincho","Yu Mincho",serif;white-space:nowrap;overflow:hidden}
.chip:nth-child(2n){border-right:0}
.chip:hover{background:#dbeafe}
/* パレットの中では黄色くしない。**表に配置して「確定」にしたときだけ黄色**にする */
.chip.sel{outline:2px solid var(--sel);outline-offset:1px}
.chip.used{opacity:.4}
.main{flex:1;min-width:0}
.sheetbox{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:10px;
  overflow:auto}

/* ===== 配置表（Excelの様式そのまま。A〜P列 × 37行） =====
   **見た目は元のExcel配置表と同じにする**（2026-09-28 ユーザー指定）。
   名前・現場コード・発注者を枠で囲んだり、× を付けたりしない。 */
table.xl{border-collapse:collapse;table-layout:fixed;background:#fff;
  width:calc(var(--colW) * 16);
  font-family:"ＭＳ Ｐ明朝","MS PMincho","Yu Mincho","游明朝",serif;font-size:14px;
  transform-origin:0 0}
/* 線の太さ --bw は fitSheet が 1÷縮める倍率 にする。縮めて表示すると 1px の線が 1px 未満になり、
   ところどころ消えていた（008.0009 ユーザー指摘「画面の罫線が消える。PDF は大丈夫」） */
table.xl td{border:var(--bw,1px) solid #000;height:var(--rowH);padding:0 3px;overflow:hidden;
  white-space:nowrap;vertical-align:middle}
table.xl tr.r1 td{border:0}
table.xl td.title{font-size:24px;font-weight:bold;text-align:center;letter-spacing:.05em}
table.xl td.date{font-size:18px;font-weight:bold;text-align:right;padding-right:8px}
table.xl td.pickday{cursor:pointer}
/* 現場コード（現場名の上に小さく） */
table.xl td.hascode{line-height:1.05;font-size:12px;padding-top:1px}
table.xl td.hascode .code{display:block;font-size:9px;color:#555;letter-spacing:.02em;
  font-family:"Yu Gothic UI","Meiryo",sans-serif}
@media print{table.xl td.hascode .code{display:none}}
/* セルをクリックしたときの選択肢 */
.dd{position:absolute;z-index:50;background:#fff;border:1px solid #000;
  box-shadow:2px 3px 8px rgba(0,0,0,.25);min-width:150px;max-width:340px;font-size:13px}
.dd input{width:100%;border:0;border-bottom:1px solid #999;padding:4px 6px;font:inherit;outline:none}
.dd .ddl{max-height:260px;overflow:auto}
.dd .ddi{padding:3px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd .ddi:hover,.dd .ddi.on{background:#0072B2;color:#fff}
.dd .ddi.used{color:#999}
.dd .ddi .cd{display:inline-block;min-width:52px;color:#777;font-size:11px}
.dd .ddi:hover .cd,.dd .ddi.on .cd{color:#dfe}
/* このPCだけに保存されていることを知らせる帯 */
.keepbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;font-size:14px;line-height:1.6;
  border-bottom:1px solid var(--line2)}
.keepbar #keepMsg{flex:1;min-width:300px}
.keepbar .kbtns{display:flex;gap:6px;flex-wrap:wrap}
.keepbar .btn{font-size:14px;padding:6px 12px}
.keepbar.danger{background:#fde8e8;color:#8a1010;border-left:8px solid #d32f2f}   /* 保存そのものが使えないときだけ */
.keepbar.calm{background:#f4f6f8;color:#333;border-left:8px solid #9aa5b1}
.keepbar.safe{background:#e8f5e9;color:#1b5e20;border-left:8px solid #2e7d32}
/* バックアップの案内の小窓（Vr008） */
.bk{font-size:15px;line-height:1.8;padding:12px 16px}
.bk .path{display:flex;gap:6px;margin:6px 0 10px}
.bk .path input{flex:1;min-width:0;font-size:14px;padding:6px}
.bk .path .btn{flex:none}
.bk ol{margin:4px 0 8px;padding-left:1.4em}
.bk .note{font-size:13px;color:#555}
.bk .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.bk .btns .btn{font-size:15px;padding:7px 16px}
.mbox table.days td{padding:4px 8px;font-size:14px}
/* 版の表示と更新履歴（Vr008） */
.btn.ver{font-size:12px;padding:2px 8px;color:#555}
/* 版が変わって初めて開いたとき（008.0008）: 版のボタンを赤く点滅させ「お知らせ」の印。履歴を開くと止まる */
.btn.ver.news{color:#fff;background:#d32f2f;border-color:#d32f2f;font-weight:700;animation:verBlink 1s ease-in-out infinite}
.btn.ver .lamp{display:none}
.btn.ver.news .lamp{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ffeb3b;margin-right:5px;
  vertical-align:-1px;box-shadow:0 0 6px 2px #ffeb3b;animation:lampBlink .5s steps(1) infinite}
.btn.ver.news .newtxt{margin-left:6px}
@keyframes verBlink{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.7)}50%{box-shadow:0 0 0 7px rgba(211,47,47,0)}}
@keyframes lampBlink{50%{opacity:.15}}
@media (prefers-reduced-motion: reduce){.btn.ver.news,.btn.ver.news .lamp{animation:none}}
table.hist tr.unseen td.v::after{content:" 新";color:#d32f2f}
table.hist{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
table.hist th,table.hist td{border:1px solid #ccc;padding:4px 8px;vertical-align:top;text-align:left}
table.hist th{background:#eef2f7;white-space:nowrap}
table.hist td.v{white-space:nowrap;font-weight:bold}
table.hist td:nth-child(2){white-space:nowrap}
table.hist tr.now td{background:#fffbe6}
table.hist ul{margin:0;padding-left:1.2em}
/* 行の左の操作（⠿ 入れ替え・＋ 挿入・− 削除）。表の外に重ねる。印刷・ロック中は出さない */
/* 表は画面幅に合わせて縮める（zoom）ので、余白は縮まない sheetbox の左の詰め物で取る */
.sheetbox{position:relative;padding-left:76px}
#rowCtl .rc{position:absolute;width:62px;display:flex;align-items:center;justify-content:flex-end;gap:2px;
  box-sizing:border-box;padding-right:2px;border-right:3px solid transparent}
#rowCtl .rc:hover{background:#eef5ff;border-right-color:#0072B2}
#rowCtl .rc.rc-site{border-right-color:#cfe3f5}
#rowCtl .rc.moving{opacity:.4}
#rowCtl .rch{cursor:grab;color:#555;font-size:15px;line-height:1;padding:0 2px;user-select:none}
#rowCtl .rch:active{cursor:grabbing}
#rowCtl .rcb{width:19px;height:19px;padding:0;border:1px solid #9bb;border-radius:4px;background:#fff;
  font-size:13px;line-height:1;cursor:pointer;color:#333}
#rowCtl .rcb[data-a="ins"]:hover{background:#e3f2fd;border-color:#0072B2;color:#0072B2}
#rowCtl .rcb[data-a="del"]:hover{background:#fde8e8;border-color:#d32f2f;color:#d32f2f}
#rowLine{position:absolute;height:4px;background:#0072B2;border-radius:2px;pointer-events:none;z-index:5}
body.locked #rowCtl{display:none}
/* 機材センターの作業内容の欄が空のとき、どこに書くか分かるよう薄く出す（印刷・Excelには出ない） */
table.xl td.cenph:not(.editing)::before{content:"作業内容（ダブルクリックで入力）";color:#9aa5b1;font-size:13px}
@media print{table.xl td.cenph::before{content:none}}
@media print{#rowCtl,#rowLine{display:none!important}}
/* 配置表を見る（NAS から開いた日）。ロック中は表・名簿に触れず、直すボタンも隠す */
.viewbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;font-size:15px;line-height:1.6;
  background:#e3f2fd;color:#0d3c61;border-left:8px solid #0072B2;border-bottom:1px solid var(--line2)}
.viewbar[hidden]{display:none}
.viewbar #viewMsg{flex:1;min-width:300px}
.viewbar .kbtns{display:flex;gap:6px;flex-wrap:wrap}
.viewbar .btn{font-size:14px;padding:6px 12px}
.viewbar.unlocked{background:#fff3e0;color:#7a3e00;border-left-color:#ef6c00}
#vLock{font-weight:600}
body.locked #sheet{pointer-events:none}
body.locked .pal{opacity:.35;pointer-events:none}
body.locked #mPlan,body.locked #mFix{pointer-events:none}
body.locked .edonly{display:none!important}
/* 保護（008.0003）: 表と名簿のパレットに触れず、直すボタンを隠す。予定／確定は同じ日のもう一方を開く */
body.protect #sheet{pointer-events:none}
body.protect .pal{opacity:.35;pointer-events:none}
body.protect #rowCtl{display:none}
body.protect .editonly{display:none!important}
/* 見るだけ版（閲覧版。008.0016）：日付・◀▶・予定／確定 だけ。直す・保存する・名簿・バックアップは出さない */
body.viewer .pal,body.viewer .bar.noprint,body.viewer #keepBar,body.viewer #viewBar,body.viewer #yBar,
body.viewer #warn,body.viewer #selInfo,body.viewer #rowCtl,body.viewer #btnVer,body.viewer #btnProt,
body.viewer #btnView,body.viewer #btnXlsx,body.viewer #btnOut,body.viewer #btnPrint,body.viewer #btnLine,body.viewer .nov,
body.viewer .bar > span:not(.spacer){display:none!important}
body.viewer .wrap{padding:6px}
body.viewer .sheetbox{padding:4px;overflow:auto}
body.viewer .bar{gap:6px;padding:6px 8px}
body.viewer .bar .btn{font-size:15px;padding:6px 10px}
body.viewer .bar b{font-size:15px}
/* スマホのブラウザが細いマスの字を勝手に大きくして はみ出すのを止める（2026-10-14 スマホで字が切れた） */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body.viewer .where{display:none!important}
/* 見るだけ版：コードの列（幅 0）の中身と線を消す。コードは現場名の上に小さく（td.hascode .code） */
body.viewer table.xl td.ccode,body.viewer table.xl td[data-k="現場コード"]{padding:0;border-left:0;border-right:0;font-size:0;color:transparent}
/* 見るだけ版：収まらない字はマスの中で折り返し、行を高くする（字を小さくする xs・xxs はやめる）。
   字の大きさは上の帯の「文字」で選ぶ（--vf。2026-10-14 ユーザー要望：ピンチとは別に字を大きくしたい）。行もそれに合わせて高く */
body.viewer table.xl td{white-space:normal;overflow-wrap:anywhere;line-height:1.3;padding-top:3px;padding-bottom:3px;
  font-size:calc(14px * var(--vf, 1.2));height:calc(34px * var(--vf, 1.2))}
body.viewer table.xl td.sm,body.viewer table.xl td.xs,body.viewer table.xl td.xxs{font-size:calc(14px * var(--vf, 1.2));letter-spacing:0}
body.viewer table.xl td.hascode{font-size:calc(14px * var(--vf, 1.2));line-height:1.3;padding-top:3px}
body.viewer table.xl td.hascode .code{font-size:calc(11.5px * var(--vf, 1.2));color:#444}
body.viewer table.xl td.title{font-size:24px} body.viewer table.xl td.date{font-size:18px}
.vfsel{font-size:15px;padding:5px 4px;border:1px solid #999;border-radius:4px;background:#fff}
body.viewer .bar{position:sticky;top:0;z-index:30}
/* 見るだけ版の上の帯（008.0018 ユーザー指定）：「配置表（見るだけ）」は出さず ◀ 日付 ▶ 予定 確定 文字 を左に詰め、
   その隣（なるべく中央）に表題、右に「自分の名前を選ぶ」。表の1行目（表題と日付）は日付と重なるので出さない */
body.viewer .bar > b,body.viewer .bar > .spacer{display:none}
.vtitle{flex:1;text-align:center;font-size:20px;font-weight:700;letter-spacing:.05em;white-space:nowrap;
  font-family:"ＭＳ Ｐ明朝","MS PMincho","Yu Mincho","游明朝",serif}
body.viewer .bar .mebar{margin:0;padding:3px 8px}
.btn.vidle{font-size:13px;padding:5px 8px}
.btn.vidle[hidden]{display:none}
body.viewer table.xl tr.r1,body.viewer table.xl tr.vempty{display:none}
body.viewer table.xl td.cenph::before{content:none}
body.viewer table.xl td.vhcol{padding:0;border-left:0;border-right:0;font-size:0;color:transparent}
/* 赤線より上は固定（008.0018 ユーザー指定）：上の帯はページの上に、表の見出し行は表の枠の上に止める。
   表の枠を画面の残りの高さにして、縦も表の枠の中で動かす（fitSheet が高さを決める） */
body.viewer #sheetbox{overflow:auto}
body.viewer table.xl tr.hdr td{position:sticky;top:0;z-index:5;box-shadow:inset 0 calc(var(--bw,1px) * -1) 0 #000}
/* 配色は配布している PDF（〇〇さんの Excel）に合わせる（008.0018 ユーザー指定） */
body.viewer table.xl tr.hdr td{background:#4472c4;color:#fff;font-weight:700}
body.viewer table.xl tr.hdr td.tanh{background:#a6a6a6}
body.viewer table.xl td.tancol{background:#d9d9d9}
body.viewer table.xl tr.gaihd td{background:#fff;border-top:calc(var(--bw,1px) * 2) solid #f00;border-bottom:calc(var(--bw,1px) * 2) solid #f00}
body.viewer table.xl tr.gaihd td.gai0{background:var(--yellow);border-left:calc(var(--bw,1px) * 2) solid #f00}
body.viewer table.xl tr.gaihd td:last-child{border-right:calc(var(--bw,1px) * 2) solid #f00}
body.viewer table.xl tr.cenhd td.cenh{background:#4472c4;color:#fff;font-weight:700}
body.viewer table.xl tr.cenhd td.gaicnt{background:#00b0f0;color:#fff;font-weight:700}
body.viewer table.xl tr.cenhd td.resth{background:#ed7d31;color:#fff;font-weight:700}
body.viewer #sheetbox{touch-action:pan-x pan-y}
/* 自分の名前（初回に選ぶ）を表の中で目立たせる */
table.xl td.me{background:#ffcdd2!important;outline:calc(var(--bw, 1px) * 2) solid #d32f2f;outline-offset:calc(var(--bw, 1px) * -2);font-weight:700}
table.xl td.me .nm{color:#b71c1c}
.mebar{display:none;font-size:15px;line-height:1.5;padding:6px 10px;margin:0 2px 6px;background:#fff3e0;border-left:6px solid #d32f2f;border-radius:4px}
body.viewer .mebar{display:block}
.mebar b{color:#b71c1c}
.mebar .btn{font-size:13px;padding:2px 8px;margin-left:6px}
.mepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:6px;margin:8px 0}
.mepick button{font-size:16px;padding:10px 4px;border:1px solid #999;border-radius:6px;background:#fff}
.vhint{font-size:13px;color:#555;margin:0 2px 6px}
@media (orientation: landscape){.vhint{display:none}}
#dayBtn{font-size:14px;padding:4px 10px;font-weight:600}
.btn.daystep{font-size:14px;padding:4px 9px;font-weight:700}
.vday.nas{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20}
.vday.nas:hover{background:#2e7d32;color:#fff}
.btn.prot{font-size:14px;padding:4px 12px;font-weight:700;border-width:2px}
.btn.prot.is-prot{background:#eceff1;color:#37474f;border-color:#78909c}
.btn.prot.is-edit{background:#fff3e0;color:#b45300;border-color:#ef6c00}
/* カレンダー（配置表を見る） */
.vyrs,.vmons{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.vyrs .btn,.vmons .btn{font-size:14px;padding:5px 10px;line-height:1.2;text-align:center}
.vyrs .btn small,.vmons .btn small{display:block;font-size:11px;color:#666}
.vyrs .btn.on small,.vmons .btn.on small{color:inherit}
.vmons .btn{min-width:52px}
.vyrs .btn.none,.vmons .btn.none{color:#bbb;border-color:#e3e3e3;background:#fafafa}
.vmons .btn:disabled{cursor:default}
.vcalhd{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0;font-size:18px}
.vcalhd .btn{font-size:15px;padding:4px 14px}
table.vcalt{width:100%;border-collapse:collapse;table-layout:fixed}
table.vcalt th{font-size:13px;padding:4px 0;border-bottom:1px solid #ccc;font-weight:600}
table.vcalt td{height:52px;text-align:center;vertical-align:middle;border-bottom:1px solid #f0f0f0}
table.vcalt .sun,.vcalt .sun .vno{color:#c62828}
table.vcalt .sat,.vcalt .sat .vno{color:#1565c0}
.vday{width:40px;height:40px;border-radius:50%;border:2px solid #0072B2;background:#e3f2fd;color:#0d3c61;
  font-size:16px;font-weight:700;cursor:pointer;padding:0}
.vday:hover{background:#0072B2;color:#fff}
.vday.cur{background:#0072B2;color:#fff;box-shadow:0 0 0 3px #ffd54f}
.vday.sm{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font-size:11px;vertical-align:middle}
.vno{color:#c8c8c8;font-size:15px}
table.vcalt td.today .vno,table.vcalt td.today .vday{outline:2px dashed #999;outline-offset:3px}

window.HAICHI_VIEWER = {
  cfg: {"clientId": "9a4c8447-3e6a-437b-85d0-4662ded35f42", "tenantId": "acd238cd-b6aa-4b5a-8056-44ed0177515f", "driveId": "b!fW3m73KhV0i7xf8c58hB1ha1ymrf1RZIq3ibCMmfIEMZJwRVBBcZSqMjvDbFdiXW", "path": "社内共有フォルダ/02_配置表/配置表データ", "data": "https://kkodin.github.io/haichi-data/"},
  scopes: ["User.Read", "Files.ReadWrite.All"],   /* 全体工程表と同じ（管理者の同意済み。読むだけに使う） */
  msal: null,

     現場の人はメールもアカウントも使わないため。2026-10-14 ユーザー指定）。tools/encrypt_viewer_data.py と同じ決まりで戻す */
  mode: null, key: null, meta: null, changed: false,
  b64: function(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; },

  loadMeta: async function(){
    var r = await fetch(this.cfg.data + "meta.json?t=" + Date.now(), {cache: "no-store"});

    try{ await this.loadMeta(); }catch(e){ return false; }

      var k = (this.meta.keys || []).filter(function(x){ return x.id === sid; })[0];
      if(k){

      this.changed = true;
      try{ localStorage.removeItem("haichi_pw_key"); localStorage.removeItem("haichi_pw_id"); }catch(e){}
    }

  textPw: async function(name){
    var bn = {"master.js": "master.bin", "index.js": "index.bin", "追加分.js": "add.bin"}[name] || name.replace(/\.js$/, ".bin");
    var v = (this.meta.files || {})[bn];

  who: function(){ var a = this.mode === "ms" && this.msal && this.msal.getActiveAccount(); return a ? (a.name || "") : ""; },

/* =====================================================================
   元に戻す／やり直す

   配置表1日分のJSONは数KBしかないので、**状態をまるごと控える**やり方にした。
   個々の操作を打ち消す作り方より単純で、抜け（戻せない操作）が出ない。

   ・変えたら pushHist("何をしたか") を呼ぶ。呼び忘れるとその操作だけ戻せない
   ・読み込み・新規のときは resetHist() で履歴を始めからにする
   ・文字を打つ欄の中では Ctrl+Z はブラウザ本来の取り消しに任せる
     （打っている途中の文字を戻したいのが普通なので）
   ===================================================================== */
var HIST = [], HPOS = -1;
var HMAX = 60;                 /* 控える数。これを超えたら古いほうから捨てる */

function snapshot(){ return JSON.stringify(D); }

function resetHist(label){
  HIST = [{s: snapshot(), label: label || "読み込み"}];
  HPOS = 0;
  updateHistBtns();
}
function pushHist(label){
  if(HPOS < HIST.length - 1) HIST = HIST.slice(0, HPOS + 1);  /* やり直しぶんは捨てる */
  var s = snapshot();
  if(HIST.length && HIST[HIST.length - 1].s === s) return;     /* 中身が同じなら控えない */
  HIST.push({s: s, label: label || "変更"});
  if(HIST.length > HMAX) HIST.shift();
  HPOS = HIST.length - 1;
  updateHistBtns();
  if(!LOCKED) showUndoChip("✔ " + (label || "変更"));
}
/* 変えたら左下に「○○しました［元に戻す］」を数秒出す（008.0012。消した・動かしたにすぐ気づいて戻せるように） */
var UCHIP_T = null;
function showUndoChip(label){
  var el = $("#uchip");
  if(!el){
    el = document.createElement("div"); el.id = "uchip"; el.className = "uchip noprint";
    el.innerHTML = '<span id="uchipT"></span><button class="btn">↶ 元に戻す</button>';
    el.querySelector("button").onclick = function(){ el.hidden = true; undo(); };
    document.body.appendChild(el);
  }
  $("#uchipT").textContent = label;
  el.hidden = false;
  clearTimeout(UCHIP_T);
  UCHIP_T = setTimeout(function(){ el.hidden = true; }, 7000);
}
/* 履歴の一覧（新しい順）。押した操作のあとの状態へ戻る（その先は「やり直す」で進める） */
function openHistList(){
  var old = document.querySelector(".hlist");
  if(old){ old.remove(); return; }
  var el = document.createElement("div");
  el.className = "hlist noprint";
  var h = ['<div class="hh">押したところまで戻します（戻したあとも「やり直す」で進めます）</div>'];
  for(var i = HIST.length - 1; i >= 0; i--)
    h.push('<div data-i="' + i + '" class="' + (i === HPOS ? "cur" : (i > HPOS ? "fut" : "")) + '">' +
      (i === HPOS ? "▶ " : "") + esc(i === 0 ? "最初（" + HIST[0].label + "）" : HIST[i].label) + "</div>");
  el.innerHTML = h.join("");
  document.body.appendChild(el);
  var rc = $("#btnHist").getBoundingClientRect();
  el.style.left = (window.scrollX + rc.left) + "px";
  el.style.top = (window.scrollY + rc.bottom + 2) + "px";
  el.addEventListener("mousedown", function(e){
    var d = e.target.closest("[data-i]");
    e.preventDefault();
    if(!d) return;
    el.remove();
    jumpHist(+d.dataset.i);
  });
  setTimeout(function(){
    document.addEventListener("mousedown", function off(e){
      if(!el.contains(e.target)){ el.remove(); document.removeEventListener("mousedown", off); }
    });
  }, 0);
}
function jumpHist(i){
  if(i === HPOS || i < 0 || i >= HIST.length) return;
  HPOS = i;
  D = JSON.parse(HIST[HPOS].s);
  D.版 = MODE;
  PICK = null; render(); updateHistBtns();
  toast("「" + (i === 0 ? "最初" : HIST[i].label) + "」のところまで戻しました（やり直す で進めます）");
}
function undo(){
  if(HPOS <= 0){ toast("これ以上は戻せません"); return; }
  var what = HIST[HPOS].label;
  HPOS--;
  D = JSON.parse(HIST[HPOS].s);
  D.版 = MODE;                 /* 予定・確定の切替は編集ではないので保つ */
  PICK = null; render(); updateHistBtns();
  toast("元に戻しました: " + what);
}
function redo(){
  if(HPOS >= HIST.length - 1){ toast("やり直すものはありません"); return; }
  HPOS++;
  D = JSON.parse(HIST[HPOS].s);
  D.版 = MODE;                 /* 予定・確定の切替は編集ではないので保つ */
  PICK = null; render(); updateHistBtns();
  toast("やり直しました: " + HIST[HPOS].label);
}
function updateHistBtns(){
  var u = $("#btnUndo"), r = $("#btnRedo");
  if(!u || !r) return;
  u.disabled = (HPOS <= 0);
  r.disabled = (HPOS >= HIST.length - 1);
  u.style.opacity = u.disabled ? .45 : 1;
  r.style.opacity = r.disabled ? .45 : 1;
  u.title = u.disabled ? "元に戻す（Ctrl+Z）" : "元に戻す（Ctrl+Z）: " + HIST[HPOS].label;
  r.title = r.disabled ? "やり直す（Ctrl+Y）" : "やり直す（Ctrl+Y）: " + HIST[HPOS+1].label;
  var hb = $("#btnHist");
  if(hb){ hb.disabled = HIST.length <= 1; hb.style.opacity = hb.disabled ? .45 : 1; }
}

/* =====================================================================
   データの行（空の行・消した印の片付け）

   人を動かしたり消したりするときは、配列から抜かずに **null を置いて**おき、
   最後に normalize() でまとめて詰める。途中で番号がずれないようにするため。
   ===================================================================== */
function newSite(){ return {地域:"", 現場名:"", 現場コード:"", 元請:"", 担当:"", 担当が行った:false,
                            区分:"", 作業員:[], 作業内容:""}; }
function newOffice(){ return {氏名:"", 記載:"", 社員:false}; }
function newSub(){ return {現場名:"", 現場コード:"", 担当:"", 担当が行った:false, 昼夜:"", 業者:"", 員数:null, 作業内容:"",
                           取りやめ:false}; }
function blankSite(s){ return !s || (!s.地域 && !s.現場名 && !s.元請 && !s.担当 && !s.区分 &&
  !(s.作業員 || []).length && !s.作業内容); }
function blankOffice(o){ return !o || (!o.氏名 && !o.記載 && !o.枠); }
function blankSub(b){ return !b || (!b.現場名 && !b.担当 && !b.昼夜 && !b.業者 &&
  (b.員数 == null || b.員数 === "") && !b.作業内容); }
function ensure(arr, i, mk){ while(arr.length <= i) arr.push(mk()); return arr[i]; }

function subTotal(){
  return D.外注.reduce(function(a, x){
    return a + (!x || x.取りやめ ? 0 : (parseInt(x.員数, 10) || 0)); }, 0);
}
function normalize(){
  D.現場 = D.現場.filter(function(s){ return s; });
  D.現場.forEach(function(s){ s.作業員 = (s.作業員 || []).filter(function(w){
    return w && w.氏名; }); });
  D.本社 = D.本社.filter(function(o){ return o; });
  D.外注 = D.外注.filter(function(b){ return b; });
  D.機材センター.人 = (D.機材センター.人 || []).filter(function(p){ return p && p.氏名; });
  /* 末尾の空の行だけ落とす（途中の空行は配置表の書き方として残す） */
  while(D.現場.length && blankSite(D.現場[D.現場.length - 1])) D.現場.pop();
  while(D.本社.length && blankOffice(D.本社[D.本社.length - 1])) D.本社.pop();
  while(D.外注.length && blankSub(D.外注[D.外注.length - 1])) D.外注.pop();
  /* 現場コードが空の現場・外注は工事部会資料から入れる（Vr006 までの配置表を読んだときなど。Vr007） */
  /* 同じ現場の名前を寄せる（SITE_UNIFY。〇〇さんの Excel の「浄明寺第1工区」なども。2026-10-19） */
  D.現場.concat(D.外注).forEach(function(x){
    if(x && x.現場名){ var u = unifySite(x.現場名); if(u !== x.現場名){ x.現場名 = u; x.現場コード = ""; } }
  });
  D.本社.forEach(function(o){ if(o && o.記載) o.記載 = unifyOffice(o.記載); });
  D.現場.concat(D.外注).forEach(function(x){
    if(x && x.現場名 && !x.現場コード){ var mi = siteInfo(x.現場名); if(mi && mi.現場コード) x.現場コード = mi.現場コード; }
  });
  if(D.機材センター.書式 && runsText(D.機材センター.書式) !== String(D.機材センター.作業内容 || ""))
    delete D.機材センター.書式;
  /* 休みの表は 3行×7列（Vr005 までに保存した日は6列なので足す） */
  D.休み = (D.休み || []).slice(0, BOTTOM_H);
  while(D.休み.length < BOTTOM_H) D.休み.push([]);
  D.休み = D.休み.map(function(row){ row = (row || []).slice(); while(row.length < REST_COLS) row.push(""); return row; });
  /* 外注員数（見出しの行の H。Vr005 までは下の行）は外注欄の合計。画面で直したら合わせる */
  D.外注員数 = subTotal();
}
/* 変更を確定する（片付け → 履歴 → 描き直し） */
function commit(label){ normalize(); pushHist(label); PICK = null; render(); }

/* =====================================================================
   様式への割り付け（画面とExcel出力で同じ計算を使う）
   ===================================================================== */
/* 現場1件が使うExcelの行。作業員が5人を超えたら同じ現場で次の行を使う（配置表の運用） */
function siteRows(sites){
  var rows = [];
  sites.forEach(function(s, i){
    var n = (s.作業員 || []).length;
    var parts = Math.max(1, Math.ceil(n / MAX_WORKERS));
    for(var k = 0; k < parts; k++) rows.push({i: i, k: k});
  });
  return rows;
}
/* 本社内勤欄の先頭行（write_haichi.py と同じ決め方）。
   元の配置表から読んだものはその境目を保ち、足りなければ現場の数のすぐ下まで押し下げる。 */
function officeStartOf(data, nSiteRows){
  var least = ROW_SITE_FIRST + nSiteRows;
  var os = parseInt(data.本社内勤欄の先頭行, 10) || 0;
  if(os < least || os > ROW_OFFICE_LAST)
    os = Math.max(least, Math.min(OFFICE_START_DEFAULT, ROW_OFFICE_LAST));
  return Math.max(os, least);
}
/* 機材センター欄の割り付け。元の配置表から読んだものは書いてあった場所をそのまま使い、
   画面で足した・外したときは左の列から縦3行ずつ詰める（write_haichi.py と同じ）。 */
function cenLayout(cen){
  var ps = (cen.人 || []).filter(function(p){ return p && p.氏名; });
  var placed = ps.length && ps.every(function(p){ return p.段 != null && p.列; });
  var pos, start;
  if(placed){
    pos = ps.map(function(p){ return {r: +p.段, c: +p.列}; });
    start = parseInt(cen.結合開始列, 10) ||
      (Math.max.apply(null, pos.map(function(x){ return x.c; })) + 1);
  }else{
    pos = ps.map(function(p, i){ return {r: i % BOTTOM_H, c: COL_CENTER[0] + Math.floor(i / BOTTOM_H)}; });
    start = COL_CENTER[0] + (ps.length ? Math.ceil(ps.length / BOTTOM_H) : 0);
  }
  return {people: ps, pos: pos, start: start};
}
function clearCenPos(){
  (D.機材センター.人 || []).forEach(function(p){ if(p){ delete p.段; delete p.列; } });
  D.機材センター.結合開始列 = null;
}

/* =====================================================================
   人の出入り
   ===================================================================== */
/* 休み欄は種別の見出しと氏名が混ざるので、名簿にある名前だけを人とみなす */
var NAMESET = {};
MASTER.作業員.forEach(function(w){ NAMESET[nk(w.氏名)] = w; });
function nk(s){ return String(s == null ? "" : s).replace(/[\s　]+/g, ""); }
function isPerson(s){ return !!NAMESET[nk(s)]; }
/* =====================================================================
   機材センターの作業内容：文字ごとの色・太字・下線（2026-10-06 ユーザー要望）
   D.機材センター.作業内容 は文字だけ（読む側はこれだけを見る）。書式は D.機材センター.書式 に
   [{t:文字, c:"FF0000"（色。空＝黒）, b:太字, u:下線}, …] の形で持つ。Excel には文字ごとの書式（リッチテキスト）で書く
   ===================================================================== */
var CEN_COLORS = [["", "黒"], ["FF0000", "赤"], ["0070C0", "青"], ["00B050", "緑"]];
function runsText(runs){ return (runs || []).map(function(r){ return r.t || ""; }).join(""); }
function runsStyled(runs){ return (runs || []).some(function(r){ return r.c || r.b || r.u; }); }
/* いまの作業内容の書式（無い・文字が合わないときは書式なしの1つ） */
function cenRuns(cen){
  var t = String((cen || {}).作業内容 || "");
  var rs = (cen || {}).書式;
  if(Array.isArray(rs) && rs.length && runsText(rs) === t) return rs;
  return t ? [{t: t}] : [];
}
/* 同じ書式が続く部分をまとめる */
function runsMerge(runs){
  var out = [];
  runs.forEach(function(r){
    if(!r.t) return;
    var p = out[out.length - 1], c = r.c || "", b = !!r.b, u = !!r.u;
    if(p && (p.c || "") === c && !!p.b === b && !!p.u === u) p.t += r.t;
    else { var n = {t: r.t}; if(c) n.c = c; if(b) n.b = true; if(u) n.u = true; out.push(n); }
  });
  return out;
}
function runsToHtml(runs){
  return (runs || []).map(function(r){
    var t = esc(r.t || "").replace(/\n/g, "<br>"), st = "";
    if(r.c) st += "color:#" + r.c + ";";
    if(r.b) st += "font-weight:bold;";
    if(r.u) st += "text-decoration:underline;";
    return st ? '<span style="' + st + '">' + t + "</span>" : t;
  }).join("");
}
/* 小窓の中身（contenteditable の HTML）→ 書式の並び */
function htmlToRuns(root){
  var out = [];
  var hex = function(v){
    v = String(v || "").trim();
    var m = /^rgb\((\d+),\s*(\d+),\s*(\d+)/.exec(v);
    if(m) v = [m[1], m[2], m[3]].map(function(x){ return ("0" + (+x).toString(16)).slice(-2); }).join("");
    v = v.replace(/^#/, "").toUpperCase();
    if(v.length === 3) v = v.replace(/(.)/g, "$1$1");
    return /^[0-9A-F]{6}$/.test(v) && v !== "000000" ? v : "";
  };
  var walk = function(n, st){
    if(n.nodeType === 3){ out.push({t: n.nodeValue, c: st.c, b: st.b, u: st.u}); return; }
    if(n.nodeType !== 1) return;
    var tag = n.tagName;
    if(tag === "BR"){ out.push({t: "\n", c: st.c, b: st.b, u: st.u}); return; }
    var s2 = {c: st.c, b: st.b, u: st.u};
    if(tag === "B" || tag === "STRONG") s2.b = true;
    if(tag === "U") s2.u = true;
    if(tag === "FONT" && n.getAttribute("color")) s2.c = hex(n.getAttribute("color"));
    var cs = n.style || {};
    if(cs.color) s2.c = hex(cs.color);
    if(cs.fontWeight === "bold" || +cs.fontWeight >= 600) s2.b = true;
    if(cs.fontWeight === "normal" || cs.fontWeight === "400") s2.b = false;
    if(/underline/.test(cs.textDecoration || cs.textDecorationLine || "")) s2.u = true;
    var block = (tag === "DIV" || tag === "P") && n !== root;
    if(block && out.length && !/\n$/.test(out[out.length - 1].t)) out.push({t: "\n"});
    Array.prototype.forEach.call(n.childNodes, function(ch){ walk(ch, s2); });
  };
  walk(root, {c: "", b: false, u: false});
  var rs = runsMerge(out);
  /* 最後の改行（編集欄が足す空の行）は落とす */
  while(rs.length){
    var l = rs[rs.length - 1];
    l.t = l.t.replace(/\n+$/, "");
    if(l.t) break;
    rs.pop();
  }
  return rs;
}
function openCenEditor(){
  closeCM(); closeDD();
  if(document.querySelector(".mdlg.ced")) return;
  var cen = D.機材センター;
  var dlg = document.createElement("div");
  dlg.className = "mdlg ced";
  dlg.innerHTML = '<div class="mbox"><h2>機材センターの作業内容（見出しを掴んで動かせます）</h2>' +
    '<div class="mbar">' +
    CEN_COLORS.map(function(c){
      return '<button class="sw" data-c="' + c[0] + '" title="文字の色：' + c[1] + '" style="background:#' +
        (c[0] || "000000") + '"></button>'; }).join("") +
    '<button class="btn tb" data-x="bold" title="太字（Ctrl+B）">B</button>' +
    '<button class="btn tb" data-x="underline" title="下線（Ctrl+U）" style="text-decoration:underline">U</button>' +
    '<button class="btn" data-x="clear" title="選んだ文字の色・太字・下線を消す">書式を消す</button>' +
    '<span class="spacer"></span><span class="hint">Enter で改行。文字を選んでから色・太字・下線を押す</span></div>' +
    '<div class="mbody"><div class="ed" contenteditable="true" spellcheck="false"></div></div>' +
    '<div class="mbar foot"><button class="btn main" data-a="ok">OK</button>' +
    '<button class="btn" data-a="cancel">キャンセル</button></div></div>';
  document.body.appendChild(dlg);
  var ed = dlg.querySelector(".ed");
  ed.innerHTML = runsToHtml(cenRuns(cen));
  try{ document.execCommand("styleWithCSS", false, false); }catch(err){}
  ed.focus();
  var rg = document.createRange(); rg.selectNodeContents(ed); rg.collapse(false);
  var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
  /* 書式のボタン（押しても選んだ文字が外れないように mousedown で止める） */
  dlg.querySelectorAll(".mbar button[data-c], .mbar button[data-x]").forEach(function(b){
    b.addEventListener("mousedown", function(e){ e.preventDefault(); });
    b.addEventListener("click", function(){
      ed.focus();
      if(b.dataset.c != null) document.execCommand("foreColor", false, "#" + (b.dataset.c || "000000"));
      else if(b.dataset.x === "clear") document.execCommand("removeFormat", false, null);
      else document.execCommand(b.dataset.x, false, null);
    });
  });
  /* Enter はメモ帳と同じ改行（Alt+Enter でも改行）。貼り付けは文字だけ */
  ed.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.isComposing){
      e.preventDefault();
      if(e.ctrlKey){ finish(true); return; }
      document.execCommand("insertLineBreak");
    }
    e.stopPropagation();
  });
  ed.addEventListener("paste", function(e){
    e.preventDefault();
    var t = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, t);
  });
  var finish = function(ok){
    if(ok){
      var runs = htmlToRuns(ed);
      var text = runsText(runs);
      var before = JSON.stringify([cen.作業内容 || "", cen.書式 || null]);
      cen.作業内容 = text;
      if(runsStyled(runs)) cen.書式 = runs; else delete cen.書式;
      dlg.remove();
      if(JSON.stringify([cen.作業内容 || "", cen.書式 || null]) !== before) commit("機材センターの作業内容");
      else render();
    }else{
      dlg.remove();
    }
  };
  dlg.querySelector('[data-a="ok"]').onclick = function(){ finish(true); };
  dlg.querySelector('[data-a="cancel"]').onclick = function(){ finish(false); };
  /* 見出しを掴んで動かす（原価管理と同じ。開くたびに真ん中から） */
  var box = dlg.querySelector(".mbox"), h2 = box.querySelector("h2"), drag = null;
  h2.addEventListener("mousedown", function(e){
    if(e.button !== 0) return;
    var m = (box.style.transform.match(/translate\((-?[\d.]+)px, *(-?[\d.]+)px\)/) || [0, 0, 0]);
    drag = {x: e.clientX, y: e.clientY, ox: +m[1], oy: +m[2]};
    e.preventDefault();
  });
  var mv = function(e){
    if(!drag) return;
    var r = box.getBoundingClientRect();
    var dx = drag.ox + e.clientX - drag.x, dy = drag.oy + e.clientY - drag.y;
    var minY = dy - r.top, maxY = dy + (innerHeight - 40 - r.top);
    var minX = dx - r.left - r.width + 80, maxX = dx + (innerWidth - 80 - r.left);
    dx = Math.min(Math.max(dx, minX), maxX); dy = Math.min(Math.max(dy, minY), maxY);
    box.style.transform = "translate(" + dx + "px, " + dy + "px)";
  };
  var up = function(){ drag = null; };
  document.addEventListener("mousemove", mv);
  document.addEventListener("mouseup", up);
  new MutationObserver(function(ms, ob){
    if(!document.body.contains(dlg)){ document.removeEventListener("mousemove", mv);
      document.removeEventListener("mouseup", up); ob.disconnect(); }
  }).observe(document.body, {childList: true});
}

/* 機材センター欄のマスが人の名前の形か（read_haichi.py の center_name_like と同じ）。
   改行・「：」などが無く、空白を除いて8文字以下。作業内容（「仙台へPIT機引き取り」など）と見分ける */
function cenNameLike(s){ return !/[\n：:、。・（）()]/.test(s) && String(s).replace(/[\s　]/g, "").length <= 8; }
function isOwn(name){ var w = NAMESET[nk(name)]; return !!(w && w.社員); }

/* いま配置表のどこかに載っている人を数える（同じ人が昼夜で2回出るのは正常） */
function placedCount(){
  var m = {};
  var add = function(n){ if(n) m[n] = (m[n] || 0) + 1; };
  D.現場.forEach(function(s){ (s.作業員 || []).forEach(function(w){ if(w) add(w.氏名); }); });
  D.本社.forEach(function(o){ if(o) add(o.氏名); });
  (D.機材センター.人 || []).forEach(function(p){ if(p) add(p.氏名); });
  D.休み.forEach(function(row){ row.forEach(function(v){ var p = restPerson(v); if(p) add(p); }); });
  return m;
}

/* 置き場所 loc:
     {kind:"site", i:現場, j:何人目}        … 人のいる場所（動かす元）
     {kind:"site", i:現場, at:何人目|null}   … 落とす先（null なら末尾）
     {kind:"office", i:行} / {kind:"center", i:何人目|-1} / {kind:"rest", r, c} */
function takeFrom(loc){
  if(!loc) return;
  if(loc.kind === "site"){ D.現場[loc.i].作業員[loc.j] = null; }
  else if(loc.kind === "office"){ D.本社[loc.i] = null; }           /* 行ごと消す */
  else if(loc.kind === "center"){ D.機材センター.人[loc.i] = null; clearCenPos(); }
  else if(loc.kind === "rest"){ D.休み[loc.r][loc.c] = ""; }
}
function putTo(loc, name){
  var rec = newPerson(name);
  if(loc.kind === "site"){
    /* **人数の上限は設けない。** 5人を超えたら同じ現場で次の行を使う（Excelも同じ） */
    var s = ensure(D.現場, loc.i, newSite);
    if(loc.at == null || loc.at >= s.作業員.length) s.作業員.push(rec);
    else s.作業員.splice(loc.at, 0, rec);
  }else if(loc.kind === "office"){
    var o = D.本社[loc.i];
    if(loc.i >= D.本社.length){
      o = ensure(D.本社, loc.i, newOffice);
    }else if(!o || o.氏名){
      o = newOffice(); D.本社.splice(loc.i, 0, o);            /* 人のいる行なら上に入れる */
    }
    yRename(o, name);
    if(!o.記載) o.記載 = "本社内勤";
  }else if(loc.kind === "center"){
    D.機材センター.人.push(rec); clearCenPos();
  }else if(loc.kind === "rest"){
    if(D.休み[loc.r][loc.c]) return false;
    D.休み[loc.r][loc.c] = name;
  }
  return true;
}
function sameLoc(a, b){
  if(!a || !b || a.kind !== b.kind) return false;
  if(a.kind === "site") return a.i === b.i && (b.at === a.j || b.j === a.j);
  if(a.kind === "rest") return a.r === b.r && a.c === b.c;
  return a.i === b.i;
}
/* 人を動かす（from が無ければパレットから置く） */
function movePerson(name, from, to){
  if(from && sameLoc(from, to)){ PICK = null; render(); return; }
  if(to.kind === "rest"){ PICK = null; render(); restDialog([{name: name, from: from || null}]); return; }   /* 008.0010 */
  var before = JSON.stringify(D);
  if(from) takeFrom(from);
  if(!putTo(to, name)){
    D = JSON.parse(before); PICK = null; render();
    toast("そこには置けません（休み欄の埋まっているマスです）");
    return;
  }
  commit(name + " を" + (from ? "移動" : "配置"));
}

/* =====================================================================
   休みを理由別に置く（008.0010。2026-10-13 ユーザー要望・〇〇さん）
   名前を先に持ってきて（ドラッグ・空いた休みのマスを押す・選んだ人をまとめて移動）、
   そのあと理由をラジオボタンで選ぶ（有給・明け休み・忌引き・自由記入）。
   休み欄は**列ごとに上から**「理由の見出し → その理由の人」の順に並べ直す
   （出面集計 aggregate.py の読み方と同じ: 列を上から見て、見出しが出たら以降の名前はその種別。
   次の列の頭の名前は前の見出しを引き継ぐ）。理由ごとに、なるべく新しい列から始める。
   ===================================================================== */
var REST_REASONS = ["有給", "明け休み", "忌引き"];
/* いまの休み欄を 見出しごとの塊 [{label, items:[マスの文字]}] にする（見出しの無い人は label ""） */
function restGroups(rest){
  var gs = [], by = {}, last = "";
  var grp = function(lab){
    if(!Object.prototype.hasOwnProperty.call(by, lab)){ by[lab] = {label: lab, items: []}; gs.push(by[lab]); }
    return by[lab];
  };
  for(var c = 0; c < REST_COLS; c++){
    var cur = "";
    for(var r = 0; r < BOTTOM_H; r++){
      var v = String((rest[r] || [])[c] || "").trim();
      if(!v) continue;
      if(restPerson(v)) grp(cur || last).items.push(v);
      else { cur = last = v; grp(v); }
    }
  }
  return gs;
}
/* 塊を 3行×7列 に詰める。入りきらなければ null */
function restPack(gs){
  gs = gs.filter(function(g){ return g.items.length; });      /* 人のいない見出しは落とす */
  var cap = REST_COLS * BOTTOM_H, need = 0;
  gs.forEach(function(g){ need += g.items.length + (g.label ? 1 : 0); });
  if(need > cap) return null;
  var grid = [], pos = 0;
  for(var r = 0; r < BOTTOM_H; r++){ grid.push([]); for(var c = 0; c < REST_COLS; c++) grid[r].push(""); }
  var put = function(v){ grid[pos % BOTTOM_H][Math.floor(pos / BOTTOM_H)] = v; pos++; };
  gs.forEach(function(g, gi){
    var n = g.items.length + (g.label ? 1 : 0);
    need -= n;
    /* 列の途中なら、あとの分が入るかぎり次の列の頭から始める */
    if(pos % BOTTOM_H && Math.ceil(pos / BOTTOM_H) * BOTTOM_H + n + need <= cap) pos = Math.ceil(pos / BOTTOM_H) * BOTTOM_H;
    if(g.label) put(g.label);
    g.items.forEach(put);
  });
  return grid;
}
/* names を 理由 reason の塊へ入れて並べ直す。入りきらなければ false（D はそのまま） */
function restPlace(names, reason){
  var gs = restGroups(D.休み), key = nk(reason);
  var drop = {};
  names.forEach(function(n){ drop[nk(n)] = 1; });
  gs.forEach(function(g){ g.items = g.items.filter(function(v){ return !drop[nk(restPerson(v))]; }); });
  var g = null;
  gs.forEach(function(x){ if(!g && x.label && nk(x.label) === key) g = x; });
  if(!g){ g = {label: reason, items: []}; gs.push(g); }
  names.forEach(function(n){ g.items.push(n); });
  var grid = restPack(gs);
  if(!grid) return false;
  D.休み = grid;
  return true;
}
/* 休みに入れる小窓。people: [{name, from}]（空なら名前も選ぶ） */

  var dlg = document.createElement("div");

    '<div style="margin-top:8px">休みの理由</div>' +
    REST_REASONS.map(function(r){
      return '<label class="rdr"><input type="radio" name="rdR" value="' + esc(r) + '"' + (preStd === r ? " checked" : "") + '> ' + esc(r) + "</label>";
    }).join("") +
    '<label class="rdr"><input type="radio" name="rdR" value=""' + (pre && !preStd ? " checked" : "") + '> 自由記入 ' +
    '<input id="rdFree" placeholder="例：通院・代休" value="' + esc(pre && !preStd ? pre : "") + '" style="font-size:15px;padding:2px 6px;width:10em"></label>' +
    '<div style="margin-top:12px;text-align:right">' +
    '<button class="btn" data-a="close" style="font-size:15px;padding:6px 16px">キャンセル</button> ' +
    '<button class="btn main" data-a="ok" style="font-size:15px;padding:6px 18px">休みに入れる</button></div>' +
    '</div></div>';
  document.body.appendChild(dlg);
  var free = $("#rdFree");
  var pickFree = function(){ dlg.querySelector('input[name=rdR][value=""]').checked = true; };
  free.addEventListener("focus", pickFree);
  free.addEventListener("input", pickFree);
  free.addEventListener("keydown", function(e){ if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); ok(); } e.stopPropagation(); });
  var ok = function(){
    var list = people.slice();
    if(!list.length){
      var nm = $("#rdName").value;
      if(!nm){ alert("名前を選んでください"); return; }
      list = [{name: nm, from: null}];
    }
    var rb = dlg.querySelector("input[name=rdR]:checked");
    if(!rb && free.value.trim()){ pickFree(); rb = dlg.querySelector("input[name=rdR]:checked"); }
    if(!rb){ alert("休みの理由を選んでください"); return; }
    var reason = rb.value || free.value.trim().replace(/[（）()]/g, "");
    if(!reason){ alert("自由記入の欄に理由を書いてください"); free.focus(); return; }
    var before = JSON.stringify(D);
    list.forEach(function(p){ if(p.from) takeFrom(p.from); });
    if(!restPlace(list.map(function(p){ return p.name; }), reason)){

  };

    if(t && t.dataset.a === "ok") ok();
  });
  dlg.addEventListener("keydown", function(e){ if(e.key === "Escape"){ dlg.remove(); render(); } e.stopPropagation(); });
  var first = $("#rdName") || dlg.querySelector("input[name=rdR]:checked") || dlg.querySelector("input[name=rdR]");
  setTimeout(function(){ first.focus(); }, 0);
}

/* 選んだマスの人 [{name, from}]（表の上から順） */
function selPeople(){

/* まとめて動かす（現場・機材センター）。休みは restDialog */
function moveMany(people, to){

                                            !(to.kind === "center" && p.from.kind === "center"); });

}

/* =====================================================================

function getVal(kind, i, key){
  if(kind === "site"){
    var s = D.現場[i]; if(!s) return "";
    if(key.charAt(0) === "w"){ var w = s.作業員[+key.slice(1)]; return w ? w.氏名 : ""; }
    return s[key] == null ? "" : String(s[key]);
  }
  if(kind === "office"){ var o = D.本社[i]; return o && o[key] != null ? String(o[key]) : ""; }
  if(kind === "sub"){ var b = D.外注[i]; return b && b[key] != null ? String(b[key]) : ""; }

  if(kind === "rest"){ var rc = key.split(","); return String(D.休み[+rc[0]][+rc[1]] || ""); }

function setCell(td, v){
  var kind = td.dataset.kind, i = +td.dataset.i, k = td.dataset.k;
  v = String(v == null ? "" : v);
  if(kind === "site"){
    var s = ensure(D.現場, i, newSite);
    if(k.charAt(0) === "w"){                        /* 作業員のマス */
      var j = +k.slice(1), nm = v.trim();
      if(!nm){ if(s.作業員[j]) s.作業員[j] = null; }
      else if(s.作業員[j]){ if(s.作業員[j].氏名 !== nm) s.作業員[j] = newPerson(nm); }
      else s.作業員.push(newPerson(nm));
      return;
    }
    if(k === "現場名"){ v = unifySite(hanDigits(v));   /* 現場名の数字は半角（2026-10-06）・同じ現場の名前を寄せる（2026-10-17） */
      s.現場コード = v ? ((siteInfo(v) || {}).現場コード || "") : ""; }   /* 現場コードは工事部会資料から（Vr007） */
    if(k === "地域") v = areaNorm(v);              /* 横浜市の区は「横浜市」（2026-10-06） */
    s[k] = v;
    if(k === "担当" && !v) s.担当が行った = false;
    /* 現場名を決めたら、工事部会資料から 元請（発注者）・地域（場所）・担当を入れる。
       **すでに入っているものは上書きしない**（「自社請け」と空欄のときだけ入れる）。 */
    if(k === "現場名" && v){
      var mi = siteInfo(v);
      if(mi){
        if(!s.元請 || s.元請 === "自社請け") s.元請 = mi.発注者 || s.元請;
        if(!s.地域) s.地域 = areaNorm(mi.場所 || "");
        if(!s.担当) s.担当 = mi.担当 || "";
      }
      if(!s.区分) s.区分 = KBN[0];
    }
    return;
  }
  if(kind === "office"){
    var o = ensure(D.本社, i, newOffice);
    if(k === "記載") v = unifyOffice(v);            /* 本社内勤（阿久和南 → 本社内勤（阿久和南道路改良（2026-10-17） */
    o[k] = v;
    if(k === "氏名") yRename(o, v);
    return;
  }
  if(kind === "sub"){
    var b = ensure(D.外注, i, newSub);
    if(k === "員数"){
      v = v.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).trim();
      b.員数 = v === "" ? null : (parseInt(v, 10) || 0);
    }else b[k] = (k === "現場名" ? unifySite(hanDigits(v)) : v);
    if(k === "現場名") b.現場コード = b.現場名 ? ((siteInfo(b.現場名) || {}).現場コード || "") : "";
    if(k === "担当" && !v) b.担当が行った = false;
    return;
  }
  if(kind === "center"){
    var ps = D.機材センター.人, nm2 = v.trim();
    /* 名前の欄に作業内容を打ってしまったら、作業内容の欄へ回す（2026-10-04 ユーザー要望。
       作業内容を書くために名前の欄を結合されていたため） */
    if(nm2 && !cenNameLike(nm2) && !isPerson(nm2)){
      var cur = String(D.機材センター.作業内容 || "").trim();
      D.機材センター.作業内容 = cur ? cur + "\n" + nm2 : nm2;
      if(D.機材センター.書式) D.機材センター.書式 = D.機材センター.書式.concat([{t: (cur ? "\n" : "") + nm2}]);
      if(i >= 0 && ps[i]){ ps[i] = null; clearCenPos(); }
      toast("「" + nm2 + "」は名前ではないので、右の「作業内容」の欄に入れました");
      return;
    }
    if(i >= 0 && ps[i]){
      if(!nm2){ ps[i] = null; clearCenPos(); }
      else if(ps[i].氏名 !== nm2) yRename(ps[i], nm2);        /* 名前だけ直す（場所は保つ） */
    }else if(nm2){ ps.push(newPerson(nm2)); clearCenPos(); }
    return;
  }
  if(kind === "cen"){ D.機材センター.作業内容 = v; delete D.機材センター.書式; return; }
  if(kind === "rest"){ var rc = k.split(","); D.休み[+rc[0]][+rc[1]] = v; }
}

/* 工事部会資料の現場マスタ。**ここに書かれているのが社内の正式工事名称と現場コード。**

var SITE_ALIAS_K = {};

   打ったとき・選んだとき・本社内勤欄の「本社内勤（阿久和南」の括弧の中で直す。出面集計の ALIAS.site も同じ */
/* 浄明寺第1工区 → 浄明寺(第1工区)（2026-10-19 ユーザー指定「浄明寺(第1工区)が正式名称。統一」。510027）。
   〇〇さんの Excel は直さず、読んだときにも寄せる（normalize） */
var SITE_UNIFY = {"阿久和南": "阿久和南道路改良", "浄明寺第1工区": "浄明寺(第1工区)"};

function unifySite(v){ return SITE_UNIFY_K[siteKey(v)] || v; }
function unifyOffice(v){
  var m = String(v).match(/^(\s*(?:本社内勤)?\s*[（(]?\s*)([^（()）]+?)(\s*[)）]?\s*)$/);
  if(!m || !SITE_UNIFY_K[siteKey(m[2])]) return v;
  return m[1] + SITE_UNIFY_K[siteKey(m[2])] + m[3];
}
function siteInfo(name){
  var k = siteKey(name);
  return SITEM[siteKey(SITE_ALIAS_K[k] || k)] || SITEM[k] || null;
}

/* =====================================================================
   描画（Excelの A〜P列・1〜37行 と同じ並び）

   文字のセルは td.tc。data-r（Excelの行）・data-c0/c1（Excelの列の範囲）を持たせて、
   矢印キーで Excel と同じように動けるようにする。
   ===================================================================== */
function showYellow(){ return MODE === "確定"; }
function jattr(o){ return esc(JSON.stringify(o)); }

/* 文字のセル。name を渡すと、その中身をドラッグできる名前として出す。 */
function cell(o){
  /* o: {r, c0, c1, kind, i, k, cls, list, opts, drop, from, name, rowspan, ml} */
  var v = getVal(o.kind, o.i, o.k);
  var cls = "tc " + (o.cls || "");
  /* 1マスに収まらない長さは文字を小さくする（Excelの「縮小して全体を表示」と同じ役目） */
  var span0 = o.c1 - o.c0 + 1, len = v.replace(/[\s　]/g, "").length;
  if(span0 === 1 && !o.ml){
    if(len > 9) cls += " xxs"; else if(len > 7) cls += " xs"; else if(len > 6) cls += " sm";
  }
  if(PICK && PICK.from && o.from && sameLoc(PICK.from, o.from) &&
     JSON.stringify(PICK.from) === JSON.stringify(o.from)) cls += " pick";
  var span = o.c1 - o.c0 + 1;
  var shown = o.show != null ? o.show : v;        /* 休みの「名前（理由）」は名前だけを名前として出す */
  var inner = o.html != null ? o.html : esc(shown);
  /* 現場名の上に小さく現場コード（工事部会資料。画面だけ・Excelには書かない） */
  /* Vr007 から現場コードは列に出す。見るだけ版だけは コードの列をなくして 現場名の上に小さく書く（2026-10-14 ユーザー要望：
     スマホで現場名の列を広げたい） */
  if(VIEWER && o.k === "現場名" && v && (o.kind === "site" || o.kind === "sub")){
    var vcode = getVal(o.kind, o.i, "現場コード");
    if(vcode){
      cls += " hascode";
      inner = '<span class="code">' + esc(vcode) + "</span>" + esc(v);
    }
  }
  if(o.name && v && o.from)
    inner = '<span class="nm" draggable="true" data-from="' + jattr(o.from) + '">' + esc(shown) + "</span>";
  if(o.note) inner += '<span class="rcm">（' + esc(o.note) + "）</span>";
  return '<td class="' + cls + '"' +
    (span > 1 ? ' colspan="' + span + '"' : "") +
    (o.rowspan ? ' rowspan="' + o.rowspan + '"' : "") +
    ' data-r="' + o.r + '" data-c0="' + o.c0 + '" data-c1="' + o.c1 + '"' +
    ' data-kind="' + o.kind + '" data-i="' + o.i + '" data-k="' + esc(o.k) + '"' +
    (o.list ? ' data-list="' + o.list + '"' : "") +
    (o.opts ? ' data-opts="' + jattr(o.opts) + '"' : "") +
    (o.ml ? ' data-ml="1"' : "") +
    (o.drop ? ' data-drop="' + jattr(o.drop) + '"' : "") +
    '><span class="v">' + inner + "</span></td>";
}
function plain(span, cls, text, extra){
  return '<td' + (span > 1 ? ' colspan="' + span + '"' : "") +
    (cls ? ' class="' + cls + '"' : "") + (extra || "") + ">" + esc(text || "") + "</td>";
}

/* 画面の幅に合わせて表を縮める（印刷は @media print の zoom で1枚に収める） */
function fitSheet(){
  var box = $("#sheetbox"), t = $("#sheet");
  if(!box || !t) return;
  var avail = VIEWER ? box.clientWidth - 10 : box.clientWidth - 22 - RC_W, full = t.offsetWidth;
  if(VIEWER){
    /* 見るだけ版：倍率 VZ（はじめは 1＝パソコンと同じ大きさ。字がマスに収まる）。画面からはみ出たら指で動かして見る。
       2本指で縮めるのは画面の幅まで、広げるのは 2倍まで（2026-10-14 ユーザー：全体を縮めると字が収まらない）。幅は倍率をはずして測る */
    var z0 = t.style.zoom; t.style.zoom = ""; full = t.offsetWidth; t.style.zoom = z0;
    VZ_MIN = Math.min(1, avail / full);
    var zv = Math.min(2, Math.max(VZ_MIN, VZ));
    t.style.zoom = String(zv);
    t.style.setProperty("--bw", zv >= 1 ? "1px" : (1 / zv).toFixed(3) + "px");
    /* 表の枠を画面の残りの高さに（見出し行を止めるため。008.0018） */
    box.style.maxHeight = Math.max(200, window.innerHeight - (box.getBoundingClientRect().top + window.scrollY) - 8) + "px";
    return;
  }
  var z = full > avail ? Math.max(.55, avail / full) : 1;
  t.style.zoom = z === 1 ? "" : String(z);
  t.style.setProperty("--bw", z === 1 ? "1px" : (1 / z).toFixed(3) + "px");
}
window.addEventListener("resize", function(){ fitSheet(); buildRowCtl(); });

/* 入力の候補（名簿から）。手打ちでも入るが、選べると速い。 */
function renderDatalists(){
  var box = $("#dls");
  if(!box || box.dataset.done) return;
  var mk = function(id, arr){
    return '<datalist id="dl-' + id + '">' +
      arr.filter(Boolean).map(function(v){ return '<option value="' + esc(v) + '">'; })
        .join("") + "</datalist>";
  };
  var uniq = function(a){ return a.filter(function(v, i){ return v && a.indexOf(v) === i; }); };
  var sites = uniq(MASTER.現場.map(function(s){ return s.現場名; })
    .concat((MASTER.現場マスタ || []).map(function(r){ return r.正式現場名; })));
  var areas = uniq(MASTER.現場.map(function(s){ return areaNorm(s.地域); }));
  var gens = uniq(MASTER.現場.map(function(s){ return s.元請; }));
  box.innerHTML = mk("site", sites) + mk("area", areas) + mk("gen", gens) +
    mk("tan", MASTER.担当) + mk("vendor", MASTER.外注業者) +
    mk("worker", MASTER.作業員.map(function(w){ return w.氏名; })) +
    mk("kind", MASTER.本社内勤の書き方) + mk("rest", MASTER.休みの種別);
  box.dataset.done = "1";
  renderKindList();
}

   書き方がそろう（出面集計は「本社内勤」＝本社、「本社内勤（現場名」＝その現場で数える） */
function renderKindList(){
  var dl = document.getElementById("dl-kind");

  var seen = {}, opts = ["本社内勤"];
  D.現場.forEach(function(s){ if(s.現場名) opts.push("本社内勤（" + s.現場名); });
  opts = opts.concat(MASTER.休みの種別 || [], ["休み", "明け休み", "有給"]);
  dl.innerHTML = opts.filter(function(v){ if(!v || seen[v]) return false; seen[v] = 1; return true; })
    .map(function(v){ return '<option value="' + esc(v) + '">'; }).join("");

/* 名簿。**作業員欄に出る人は全員が自社の従業員**で、そのうち社員は分けて並べる。
   **パレットの中では黄色くしない。** 黄色は表に配置して「確定」にしたときの印。 */
function renderPalette(){
  var used = placedCount();
  var mk = function(w){
    if(PAL_FREE && used[w.氏名]) return "";
    var cls = "chip" + (used[w.氏名] ? " used" : "") +
      (PICK && !PICK.from && PICK.氏名 === w.氏名 ? " sel" : "");
    return '<span class="' + cls + '" draggable="true" data-name="' +
      esc(w.氏名) + '">' + esc(w.氏名) + "</span>";
  };
  var own = MASTER.作業員.filter(function(w){ return w.社員; }).map(mk).join("");
  var oth = MASTER.作業員.filter(function(w){ return !w.社員; }).map(mk).join("");
  $("#palOwn").innerHTML = own || '<span class="hint" style="grid-column:1/3;padding:4px">（全員配置済み）</span>';
  $("#palSub").innerHTML = oth || '<span class="hint" style="grid-column:1/3;padding:4px">（全員配置済み）</span>';
  document.querySelectorAll(".pal .chip").forEach(function(ch){
    ch.addEventListener("dragstart", function(e){
      e.dataTransfer.setData("text/plain", JSON.stringify({name: ch.dataset.name}));
    });
    ch.addEventListener("click", function(){
      if(PICK && !PICK.from && PICK.氏名 === ch.dataset.name) PICK = null;
      else PICK = {氏名: ch.dataset.name};
      renderPalette();
      toast(PICK ? PICK.氏名 + " を選びました。置きたいセルを押してください（Escで取り消し）。" : "");
    });
  });
}

var RE_REST = /休|有給|忌引|欠勤|代休|振替/;
function whereIs(){
  var m = {};
  var add = function(name, place){
    if(!name) return;
    var k = nk(name);
    (m[k] = m[k] || {name: name, places: []}).places.push(place);
  };
  D.現場.forEach(function(s){
    var site = s.現場名 || "(現場名なし)";
    (s.作業員 || []).forEach(function(w){ add(w.氏名, site); });
    if(s.担当が行った && s.担当) add(s.担当, site);
  });
  D.外注.forEach(function(b){ if(b && b.担当が行った && b.担当) add(b.担当, (b.現場名 || "外注") + "（外注）"); });
  D.本社.forEach(function(o){ add(o.氏名, o.記載 || "本社"); });
  (D.機材センター.人 || []).forEach(function(p){ add(p.氏名, "機材センター"); });
  D.休み.forEach(function(row){ row.forEach(function(v){
    var p = restPerson(v); if(p) add(p, "休み"); }); });
  return m;
}
function renderWhere(){
  var box = $("#whereBox");
  if(!box) return;
  var m = whereIs();
  box.innerHTML = MASTER.作業員.map(function(w){
    var r = m[nk(w.氏名)];
    var place = r ? r.places.filter(function(v, i, a){ return a.indexOf(v) === i; }).join(" / ") : "";
    var cls = !place ? "none" : (RE_REST.test(place) ? "rest" : "");
    return '<span class="wi ' + cls + '"><b>' + esc(w.氏名) + "</b>" +
      (place ? esc(place) : "未記入") + "</span>";
  }).join("");
}

function checkWarn(){
  var msg = warnMsgs();
  $("#warn").innerHTML = msg.length ? "⚠ " + msg.join("<br>⚠ ") : "";
}
function warnMsgs(){
  var msg = [];
  var used = placedCount();
  var dup = Object.keys(used).filter(function(n){ return used[n] > 1; });
  if(dup.length) msg.push("同じ日に2回以上出ている人: <b>" + dup.map(esc).join("、") +
    "</b>（昼夜の両方なら問題ありません）");
  D.現場.forEach(function(s){
    var nm = "<b>" + esc(s.現場名 || "(現場名なし)") + "</b>";
    if(s.作業員.length && !s.現場名) msg.push("現場名が空の行に人が入っています");
    if(!s.現場名) return;
    if(!s.区分) msg.push(nm + " の区分（昼勤・夜勤）が空です");
    if(!s.元請) msg.push(nm + " の元請けが空です（元請けが空だと、出面集計がそこで現場欄の終わりと読んでしまいます）");
    if(!s.担当) msg.push(nm + " の担当が空です");
    if(/[\r\n]/.test(s.現場名)) msg.push(nm + " の現場名の中に改行があります（別の現場として数えられます）");
    s.作業員.forEach(function(w){
      if(w && w.氏名 && !isPerson(w.氏名)) msg.push(nm + " の作業員 <b>" + esc(w.氏名) +
        "</b> が名簿にありません（書き間違いでないか確かめてください）");
    });
  });
  /* 本社内勤欄の書き方（出面作成担当者の決まり事。2026-10-01） */
  var siteKeys = {};
  D.現場.forEach(function(s){ if(s.現場名) siteKeys[nk(s.現場名)] = 1; });
  MASTER.現場.forEach(function(s){ if(s.現場名) siteKeys[nk(s.現場名)] = 1; });
  (MASTER.現場マスタ || []).forEach(function(s){ if(s.正式現場名) siteKeys[nk(s.正式現場名)] = 1; });
  D.外注.forEach(function(s){ if(s && s.現場名) siteKeys[nk(s.現場名)] = 1; });
  D.本社.forEach(function(o){
    if(!o || !o.氏名) return;
    var k = String(o.記載 || "").trim();
    if(!k){ msg.push("<b>" + esc(o.氏名) + "</b> の本社内勤欄の記載が空です（本社内勤・休みなど）"); return; }
    if(RE_OFFICE_REST.test(k) || k === "本社内勤") return;
    var m = /^本社内勤[（(](.*)$/.exec(k), site = (m ? m[1] : k).replace(/[）)]$/, "");
    if(!m) msg.push("<b>" + esc(o.氏名) + "</b> の記載「" + esc(k) +
      "」は「本社内勤（" + esc(site) + "」の形にそろえてください（現場名だけだと読み違えのもとになります）");
    else if(!siteKeys[nk(site)]) msg.push("<b>" + esc(o.氏名) + "</b> の記載「" + esc(k) +
      "」の現場名「" + esc(site) + "」が名簿にありません（書き間違いでないか確かめてください。新しい現場ならそのままで構いません）");
  });
  /* 社員は毎日、現場・本社・休みのどこかに名前がある（決まり事） */
  var wh = whereIs();
  var asTan = function(name){ var n = nk(name).replace(/沢/g, "澤");
    return D.現場.concat(D.外注).some(function(s){ var t = nk(s && s.担当).replace(/沢/g, "澤");
      return t.length >= 2 && n.indexOf(t) === 0; }); };
  var none = MUST_STAFF.filter(function(n){ return !wh[nk(n)] && !asTan(n); });
  if(none.length) msg.push("どこにも載っていない社員: <b>" + none.map(esc).join("、") +
    "</b>（現場・本社内勤・休みのどれかに入れてください）");
  if(MODE === "確定") D.外注.forEach(function(b){
    if(b && b.業者 && !b.取りやめ && (b.員数 === null || b.員数 === "" || b.員数 === undefined))
      msg.push("外注 <b>" + esc(b.業者) + "</b> の員数が空です（取りやめなら Alt+クリックで取り消し線）");
  });
  fitProblems(D).forEach(function(p){ msg.push(esc(p)); });
  return msg;
}
/* 様式に収まらないところ（write_haichi.py の TooMany と同じ条件） */
function fitProblems(data){
  var p = [];
  var n = siteRows(data.現場 || []).length;
  if(n > MAX_SITE_ROWS)
    p.push("現場の行が " + n + " 行あります。この様式は " + MAX_SITE_ROWS + " 行までです（3〜24行を本社内勤欄と分け合うため）");
  var os = officeStartOf(data, Math.min(n, MAX_SITE_ROWS));
  var room = ROW_OFFICE_LAST - os + 1, no = (data.本社 || []).length;
  if(n <= MAX_SITE_ROWS && no > room)
    p.push("本社内勤・休み欄が " + no + " 行あります。残りは " + room + " 行（" + os + "〜24行）です。赤い行は入りません");
  if((data.外注 || []).length > MAX_SUBS)
    p.push("外注が " + data.外注.length + " 件あります。" + MAX_SUBS + " 件までです（26〜33行）");
  var nc = cenLayout(data.機材センター || {}).people.length;
  var mc = maxCenter(data.休み);
  if(nc > mc) p.push("機材センターが " + nc + " 人います。この日は " + mc + " 人までです");
  return p;
}

/* =====================================================================
   セルの選択（Excelと同じ感覚）
   ・1回クリック … 選ぶだけ ／ ダブルクリック・Enter・F2・文字を打つ … 書き換え
   ・Delete … 選んだセルを消す（まとめて消せる。人も外れる）
   ・Ctrl+クリック … 足し引き ／ Shift+クリック … 四角く範囲 ／ 矢印 … 動く
   選んだ場所は「Excelの行,開始列」で持つので、描き直しても選び直せる。
   ===================================================================== */
var SEL = {};            /* "r,c0" → true */
var ANCHOR = null;       /* {r, c}（c は Excel の列） */
var EDITING = null;

function tdKey(td){ return td.dataset.r + "," + td.dataset.c0; }
function selCount(){ return Object.keys(SEL).length; }
function clearSel(){ SEL = {}; ANCHOR = null; paintSel(); }
function allTc(){ return Array.prototype.slice.call($("#sheet").querySelectorAll("td.tc")); }

function paintSel(){
  allTc().forEach(function(td){ td.classList.toggle("sel", !!SEL[tdKey(td)]); });
  var n = selCount(), el = $("#selInfo");
  if(el) el.textContent = n > 1 ? n + " 個のセルを選択中（Delete でまとめて消せます）"
    : (n === 1 ? "1 個のセルを選択中（Delete で消す／ダブルクリックか文字を打つと書き換え）" : "");
}
/* Excelの (行, 列) を含むセル。rowspan のセルは先頭行で持つので、下の行からも探す */
function cellAt(r, c){
  var hit = null;
  allTc().forEach(function(td){
    var r0 = +td.dataset.r, r1 = r0 + (+td.getAttribute("rowspan") || 1) - 1;
    if(r >= r0 && r <= r1 && c >= +td.dataset.c0 && c <= +td.dataset.c1) hit = td;
  });
  return hit;
}
function pickCell(td, ev){
  var r = +td.dataset.r, c = +td.dataset.c0;
  if(ev && ev.shiftKey && ANCHOR){
    SEL = {};
    var r0 = Math.min(ANCHOR.r, r), r1 = Math.max(ANCHOR.r, r);
    var c0 = Math.min(ANCHOR.c, c), c1 = Math.max(ANCHOR.c, +td.dataset.c1);
    allTc().forEach(function(x){
      var xr = +x.dataset.r;
      if(xr >= r0 && xr <= r1 && +x.dataset.c1 >= c0 && +x.dataset.c0 <= c1) SEL[tdKey(x)] = true;
    });
  }else if(ev && (ev.ctrlKey || ev.metaKey)){
    var k = tdKey(td);
    if(SEL[k]) delete SEL[k]; else SEL[k] = true;
    ANCHOR = {r:r, c:c};
  }else{
    SEL = {}; SEL[tdKey(td)] = true; ANCHOR = {r:r, c:c};
  }
  paintSel();
}
function anchorTd(){ return ANCHOR ? cellAt(ANCHOR.r, ANCHOR.c) : null; }

/* 中の文字を書き換える。first を渡すと、その1文字から打ち始める（Excelと同じ）。 */

    el.innerHTML = '<option value=""></option>' + opts.map(function(o){

  };

  el.onchange = function(){ if(el.tagName === "SELECT") done(true); };
  el.onkeydown = function(e){

/* =====================================================================
   セルをクリックしたときの選択肢（Vr002。ユーザー要望）
   上の欄に打つと絞り込める。↑↓で動いて Enter で決める。Esc で閉じる。
   ===================================================================== */
var DD = null;
function closeDD(){ if(DD){ DD.el.remove(); DD = null; } }
function ddItems(td){
  var list = td.dataset.list, cur = getVal(td.dataset.kind, +td.dataset.i, td.dataset.k);
  var uniq = function(a){ var m = {}; return a.filter(function(x){
    var k = nk(x.v); if(!x.v || m[k]) return false; m[k] = 1; return true; }); };
  var it = [];
  if(td.dataset.opts) JSON.parse(td.dataset.opts).forEach(function(v){ it.push({v: v}); });
  else if(list === "site"){
    /* 今日の現場 → 名簿の現場（よく出る順）→ 工事部会資料の今期の現場 */
    D.現場.forEach(function(s){ if(s.現場名) it.push({v: s.現場名, h: "今日の現場"}); });
    MASTER.現場.forEach(function(s){ it.push({v: s.現場名, h: "よく使う現場"}); });
    var ki = Math.max.apply(null, (MASTER.現場マスタ || []).map(function(r){ return parseInt(r.期, 10) || 0; }).concat([0]));
    (MASTER.現場マスタ || []).filter(function(r){ return (parseInt(r.期, 10) || 0) >= ki - 1; })
      .forEach(function(r){ it.push({v: hanDigits(r.正式現場名), h: "工事部会資料"}); });
    it.forEach(function(x){ x.v = unifySite(x.v); var mi = siteInfo(x.v); if(mi) x.cd = mi.現場コード; });
    /* 左の列（地域）が入っていれば、その地域の現場だけに絞る（2026-10-01 ユーザー要望）。
       地域は名簿の現場の「地域」か、工事部会資料の「場所」（横浜市金沢区 など）で照らす。
       1件も当たらなければ絞らない（新しい地域・書き方の違いで何も出なくなるのを防ぐ） */
    var area = td.dataset.kind === "site" ? nk((D.現場[+td.dataset.i] || {}).地域) : "";
    if(area){
      var inArea = function(v){
        var k = nk(v);
        if(MASTER.現場.some(function(s){ return nk(s.現場名) === k && nk(areaNorm(s.地域)) === area; })) return true;
        if(D.現場.some(function(s){ return nk(s.現場名) === k && nk(s.地域) === area; })) return true;
        var mi = siteInfo(v);
        return !!(mi && nk(mi.場所).indexOf(area) >= 0);
      };
      var hit = it.filter(function(x){ return inArea(x.v); });
      if(hit.length){
        hit.forEach(function(x){ x.h = (D.現場[+td.dataset.i] || {}).地域 + " の現場（" + x.h + "）"; });
        hit.area = true;
        it = hit;
      }
    }
  }else if(list === "worker"){
    var used = placedCount();
    MASTER.作業員.forEach(function(w){ it.push({v: w.氏名, h: w.社員 ? "社員" : "従業員", used: !!used[w.氏名]}); });
    it.sort(function(a, b){ return (a.used - b.used) || (a.h === b.h ? 0 : (a.h === "社員" ? -1 : 1)); });
  }else if(list === "tan"){
    MASTER.担当.forEach(function(v){ it.push({v: v}); });
  }else if(list === "kind"){
    var dl = document.getElementById("dl-kind");
    if(dl) Array.prototype.forEach.call(dl.options, function(o){ it.push({v: o.value}); });
  }else{
    var dl2 = document.getElementById("dl-" + list);
    if(dl2) Array.prototype.forEach.call(dl2.options, function(o){ it.push({v: o.value}); });
  }
  it = uniq(it);
  it.forEach(function(x){ x.on = cur && nk(x.v) === nk(cur); });
  return it;
}
function openDD(td){
  closeDD();
  var items = ddItems(td);
  if(!items.length) return;
  var el = document.createElement("div");
  el.className = "dd noprint";
  el.innerHTML = '<input placeholder="打って絞り込む（Enterで決定）"><div class="ddl"></div>';
  document.body.appendChild(el);
  var rc = td.getBoundingClientRect();
  el.style.left = (window.scrollX + rc.left) + "px";
  el.style.top = (window.scrollY + rc.bottom) + "px";
  el.style.minWidth = Math.max(150, rc.width) + "px";
  var inp = el.querySelector("input"), box = el.querySelector(".ddl"), act = -1, shown = [];
  var draw = function(){
    var q = nk(inp.value);
    shown = items.filter(function(x){ return !q || nk(x.v).indexOf(q) >= 0 || (x.cd && x.cd.indexOf(q) === 0); });
    var h = [], last = null;
    shown.forEach(function(x, i){
      if(x.h && x.h !== last){ h.push('<div class="ddh">' + esc(x.h) + "</div>"); last = x.h; }
      h.push('<div class="ddi' + (x.used ? " used" : "") + (i === act || (act < 0 && x.on) ? " on" : "") +
        '" data-i="' + i + '">' + (x.cd ? '<span class="cd">' + esc(x.cd) + "</span>" : "") + esc(x.v) +
        (x.used ? "（配置済み）" : "") + "</div>");
    });
    box.innerHTML = h.join("") || '<div class="ddh">候補がありません（Enterでそのまま入れる）</div>';
  };
  var choose = function(v){
    closeDD();
    if(getVal(td.dataset.kind, +td.dataset.i, td.dataset.k) === v) return;
    setCell(td, v);
    commit((td.dataset.k.charAt(0) === "w" ? "作業員" : td.dataset.k) + "を選ぶ");
  };
  box.addEventListener("mousedown", function(e){
    var d = e.target.closest(".ddi");
    if(d){ e.preventDefault(); choose(shown[+d.dataset.i].v); }
  });
  inp.addEventListener("input", function(){ act = 0; draw(); });
  inp.addEventListener("keydown", function(e){
    if(e.key === "ArrowDown"){ e.preventDefault(); act = Math.min(shown.length - 1, act + 1); draw(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); act = Math.max(0, act - 1); draw(); }
    else if(e.key === "Enter" && !e.isComposing){
      e.preventDefault();
      if(act >= 0 && shown[act]) choose(shown[act].v);
      else if(inp.value.trim()) choose(inp.value.trim());
      else closeDD();
    }else if(e.key === "Escape"){ e.preventDefault(); closeDD(); }
    else if(e.key === "Delete" && !inp.value){ e.preventDefault(); closeDD(); clearSelected(); }
    e.stopPropagation();
  });
  DD = {el: el, td: td};
  draw();
  setTimeout(function(){ inp.focus({preventScroll: true}); }, 0);
}

/* =====================================================================
   黄色の確認（008.0009。2026-10-13 ユーザー要望）
   予定 → 確定 に切り替えると、黄色（社員・担当が行った）が自動で付いていた。
   これを入力する人が決めるようにする: 切り替えたとき黄色になる名前を**黄色で点滅**させ、
   押すと「黄色で決定」「黄色を消す」を選ぶ。確定のときに置いた社員の名前も点滅から始める。
   印は 人／現場・外注 の中に持つ（黄未決＝まだ決めていない・黄済＝決めた。担当は 担当黄未決／担当黄済）。
   Excel から読んだ日・決めた名前は点滅しない。① 新しい日の表を作る では印を消す（毎日決め直す）。

/* 黄色を付けられるもの。担当は 担当が行った、作業員・本社・機材センターは 社員 の印 */
function yOf(o, tan){
  if(!o) return null;
  if(tan) return o.担当 ? {o: o, on: "担当が行った", pend: "担当黄未決", done: "担当黄済", who: o.担当} : null;
  return o.氏名 ? {o: o, on: "社員", pend: "黄未決", done: "黄済", who: o.氏名} : null;
}
function yRef(kind, i, k){
  if((kind === "site" || kind === "sub") && k === "担当") return yOf((kind === "sub" ? D.外注 : D.現場)[i], true);
  if(kind === "site" && k.charAt(0) === "w"){ var s2 = D.現場[i]; return yOf(s2 && s2.作業員[+k.slice(1)]); }
  if(kind === "office" && k === "氏名") return yOf(D.本社[i]);
  if(kind === "center") return yOf((D.機材センター.人 || [])[i]);
  return null;
}
/* 表の中の黄色を付けられるもの全部 */
function yAll(){
  var a = [], pk = function(o, tan){ var y = yOf(o, tan); if(y) a.push(y); };
  D.現場.forEach(function(s){ pk(s, true); (s && s.作業員 || []).forEach(function(w){ pk(w); }); });
  D.外注.forEach(function(b){ pk(b, true); });
  D.本社.forEach(function(o){ pk(o); });
  (D.機材センター.人 || []).forEach(function(p){ pk(p); });
  return a;
}
function yPendCount(){ return yAll().filter(function(y){ return y.o[y.on] && y.o[y.pend]; }).length; }
/* 予定 → 確定 にしたとき: 黄色になる名前のうち、まだ決めていないものを点滅にする */
function yMarkPending(){
  var n = 0;
  yAll().forEach(function(y){ if(y.o[y.on] && !y.o[y.done]){ y.o[y.pend] = true; n++; } });
  return n;
}
/* 決める（keep: true＝黄色で決定・false＝黄色を消す）。ySet は commit しない */
function ySet(y, keep){ y.o[y.on] = !!keep; delete y.o[y.pend]; y.o[y.done] = true; }
function yDecide(y, keep){ ySet(y, keep); commit(y.who + (keep ? " を黄色で決定" : " の黄色を消す")); }
function yDecideAll(keep){
  var ps = yAll().filter(function(y){ return y.o[y.on] && y.o[y.pend]; });
  if(!ps.length) return;
  ps.forEach(function(y){ ySet(y, keep); });
  commit("点滅の " + ps.length + " 人を" + (keep ? "黄色で決定" : "黄色を消す"));
}
/* 新しく置いた・打った人（確定のときの社員は点滅から始める） */

  (d.現場 || []).forEach(function(s){ del(s); (s && s.作業員 || []).forEach(del); });

/* items: [{label, fn, off, note} | null（区切り）] を押した位置に出す */

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>工事部会資料</title>
<link rel="icon" href="favicon.png"><link rel="stylesheet" href="app.css?v=Vr001 11/13 15:47"><link rel="stylesheet" href="bukai.css?v=Vr001 11/13 15:47">
</head><body>
<header id="top"><span class="ttl">工事部会資料</span><a id="backToKotei" href="../" style="color:white">全体工程表へ</a><button id="bHelp" class="sub">使用方法</button><span class="grp right"><span id="sync" class="sync"></span><span id="who"></span><span id="ver" class="ver">Vr001 11/13 15:47</span></span></header>
<div id="entryOnly" class="center" hidden><p>最新版の全体工程表（原版）から「工事部会資料」を開いてください。</p><a href="../">全体工程表を開く</a></div>
<div id="signin" class="center" hidden><p>会社のMicrosoftアカウントでサインインしてください。</p><button id="bSignIn">サインイン</button><p id="signinMsg" class="ng"></p></div><div id="loading" class="center" hidden>読み込み中…</div><div id="printPages"></div>
<main id="pBukai" hidden>
  <div class="bk-tools">
    <label>会議月 <input type="month" id="bkMonth" min="1900-01" max="2199-12"></label>
    <label>資料 <select id="bkVersion"><option value="">編集中</option></select></label>
    <button type="button" id="bkRefresh" class="sub">最新を読み直す</button>
    <button type="button" id="bkImport" class="sub">記入済みJSONを取り込む</button>
    <button type="button" id="bkExport" class="sub">共有用JSONを書き出す</button>
    <input type="file" id="bkFile" accept=".json,application/json" hidden>
    <button type="button" id="bkSnapshot">配布版を保存</button>
    <label>用紙 <select id="bkPaper"><option value="A3">A3横</option><option value="A4">A4横</option></select></label>
    <label>1ページ <select id="bkPerPage"><option value="2">2現場</option><option value="3">3現場</option><option value="4" selected>4現場</option><option value="5">5現場</option><option value="6">6現場</option></select></label>
    <button type="button" id="bkPrint" class="sub">印刷・PDF</button>
    <span id="bkStatus" role="status" aria-live="polite">共有データを参照</span>
  </div>
  <div class="bk-note"><span id="bkCount"></span>　工程表の変更は編集中の資料へ反映されます。配布版は保存した時点の内容を保持します。</div>
  <div class="bk-layout"><aside class="bk-sidebar"><input id="bkFilter" type="search" placeholder="現場・コード・担当で絞る" aria-label="部会資料の現場検索"><div id="bkSites"></div></aside><section class="bk-content" id="bkEditor"></section></div>
</main>
<dialog id="dBukaiImport"><h3>記入済みデータの取り込み確認</h3><div class="bk-import-scroll" id="bkImportPreview"></div><p id="bkImportError" class="ng" role="alert"></p><div class="btns"><button type="button" id="bkImportCancel" class="sub">やめる</button><button type="button" id="bkImportApply">確認した内容を共有保存</button></div></dialog>

<script src="lib/msal-browser.min.js"></script><script src="config.js?v=Vr001 11/13 15:47"></script><script src="bukai-core.js?v=Vr001 11/13 15:47"></script><script src="bukai.js?v=Vr001 11/13 15:47"></script><script src="main.js?v=Vr001 11/13 15:47"></script></body></html>

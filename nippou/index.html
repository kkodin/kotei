<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工事日報</title>
<link rel="stylesheet" href="app.css?v=202610301928">
</head>
<body>
<header id="top">
  <span class="ttl">工事日報</span>
  <nav id="views">
    <button data-tab="sheet" class="on" title="1日1枚の日報（施工・社員・作業員・外注・材料・機械）">日報</button>
    <button data-tab="haichi" title="全現場のその日の予定・報告（人員配置表へ写す）">配置まとめ</button>
    <button data-tab="month" title="この現場の月の出面・人数・機械">月の集計</button>
  </nav>
  <span class="grp">
    <select id="inSite" title="現場（全体工程表の現場）"></select>
    <button id="bPrevD" class="sub" title="前の日（Alt+PageUp）">◀</button>
    <input type="date" id="inDay" title="日">
    <button id="bNextD" class="sub" title="次の日（Alt+PageDown）">▶</button>
    <button id="bToday" class="sub" title="今日の日誌">今日</button>
    <button id="bTomorrow" class="sub" title="明日の日誌（予定を直しておく）">明日</button>
  </span>
  <span class="grp right">
    <span id="sync" class="sync"></span>
    <button id="bReload" class="sub" title="ほかの人の書き込み・工程の変更を読み直す">↻ 最新にする</button>
    <span id="who"></span>
    <span id="ver" class="ver">Vr002 10/30 19:28</span>
  </span>
</header>

<div id="signin" class="center" hidden>
  <p>会社の Microsoft アカウントでサインインしてください。</p>
  <button id="bSignIn">サインイン</button>
  <p id="signinMsg" class="ng"></p>
</div>

<main id="app">
  <!-- 日報（6つの欄。セルの動きは Excel と同じ） -->
  <section id="pSheet">
    <div class="ribbon">
      <button id="bReport" title="この日の日誌を報告する（予定と違う所は色が付いたまま残る）">予定どおりで報告する</button>
      <span class="rsep"></span>
      <button id="bCopyPrev" class="sub" title="前に書いた日の内容をこの日に写す">前の日と同じ</button>
      <button id="bResetPlan" class="sub" title="工程から予定を作り直して、この日を予定に戻す">予定に戻す</button>
      <span class="rsep"></span>
      <button id="bInsRow" class="sub" title="選んだ行の上に行を入れる（Ctrl+Shift+＋）">行の挿入</button>
      <button id="bDelRow" class="sub" title="選んだ行を消す（Ctrl+－）">行の削除</button>
      <button id="bUndo" class="sub" title="元に戻す（Ctrl+Z）">↶</button>
      <button id="bRedo" class="sub" title="やり直す（Ctrl+Y）">↷</button>
      <span class="rsep"></span>
      <button id="bPrint" class="sub" title="B5 縦で印刷（Ctrl+P）。1日1ページ">印刷</button>
      <span id="status" class="rstatus"></span>
    </div>
    <div class="fbar">
      <input id="nameBox" class="namebox" readonly title="いま選んでいるセル（欄・行・項目）">
      <span class="fxl">fx</span>
      <input id="fx" class="fx" autocomplete="off" title="数式バー（選んだセルの中身。ここでも直せる）">
    </div>
    <div class="body">
      <div id="sheetWrap"><p id="noSite" class="empty" hidden>現場がありません。全体工程表に現場を入れると、ここに出ます。</p><div id="sheet"></div></div>
      <aside id="side"></aside>
    </div>
    <div class="tabbar">
      <button id="bTabL" class="tnav" title="前の日（Alt+PageUp・Ctrl+PageUp）">◀</button>
      <button id="bTabR" class="tnav" title="次の日（Alt+PageDown・Ctrl+PageDown）">▶</button>
      <button id="bCal" class="tnav cal" title="日付を選ぶ">📅</button>
      <div id="tabs"></div>
    </div>
    <div class="statusbar"><span id="mode">準備完了</span><span id="stat"></span><span class="keys">Enter↓ Tab→ F2・ダブルクリック 直す　Alt+PageUp/Down 日を移る　Alt+↓ 候補　Ctrl+D 下へコピー</span></div>
  </section>

  <!-- 配置まとめ（田村さん） -->
  <section id="pHaichi" hidden>
    <div class="ribbon">
      <button id="hPrev" class="sub">◀</button>
      <input type="date" id="hDay">
      <button id="hNext" class="sub">▶</button>
      <button id="hToday" class="sub">今日</button>
      <button id="hTomorrow" class="sub">明日</button>
      <b id="hTtl" class="httl"></b>
      <span class="rsep"></span>
      <button id="hCopy" class="sub" title="この表を Excel に貼れる形でコピー">表をコピー</button>
      <span class="note">工程（予定）と各現場の日報（報告）を並べています。<span class="chg">色付き</span>＝予定から変わった所、<s class="del">取り消し線</s>＝予定にあって無くなったもの。配置表に入れたらチェック。</span>
    </div>
    <div id="haichi" class="scroll"></div>
  </section>

  <!-- 月の集計 -->
  <section id="pMonth" hidden>
    <div class="ribbon"><b id="mTtl" class="httl"></b><span class="rsep"></span><button id="bMonthCopy" class="sub">表をコピー</button></div>
    <div id="month" class="scroll"></div>
  </section>
</main>

<div id="wxPick" class="wxpick" hidden></div>
<div id="menu" class="ctx" hidden></div>
<div id="printArea"></div>

<dialog id="dCal">
  <h3 id="calTtl"></h3>
  <div id="calGrid" class="calgrid"></div>
  <button type="button" id="calToday" class="link"></button>
  <div class="btns"><span class="sp"></span><button type="button" id="bCalClose" class="sub">閉じる</button></div>
</dialog>

<dialog id="dPrint">
  <h3>印刷（B5 縦）</h3>
  <p class="note" style="padding:0 16px">1日を1ページ（施工・社員・作業員・外注・材料・機械の順）で出します。</p>
  <div class="btns"><span class="sp"></span><button type="button" id="bPrCancel" class="sub">やめる</button>
    <button type="button" id="bPrMonth" class="sub">この月の書いた日すべて</button><button type="button" id="bPrDay">この日</button></div>
</dialog>

<div id="toast" class="toast"></div>
<script src="config.js?v=202610301928"></script>
<script src="lib/msal-browser.min.js"></script>
<script src="grid.js?v=202610301928"></script>
<script src="app.js?v=202610301928"></script>
</body>
</html>

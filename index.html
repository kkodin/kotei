<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全体工程表</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <span class="ttl">全体工程表</span>
  <nav id="tabs">
    <button data-tab="chart" class="on">工程表</button>
    <button data-tab="flow">人の流れ</button>
    <button data-tab="list">一覧</button>
  </nav>
  <span class="grp">
    <button id="bPrev" class="sub" title="前の月">◀</button>
    <input type="month" id="inFrom">
    <select id="inMonths">
      <option value="1">1か月</option>
      <option value="2" selected>2か月</option>
      <option value="3">3か月</option>
      <option value="4">4か月</option>
    </select>
    <button id="bNext" class="sub" title="次の月">▶</button>
    <button id="bToday" class="sub">今日</button>
  </span>
  <span class="grp right">
    <span id="sync" class="sync"></span>
    <button id="bReload" class="sub" title="ほかの人の書き込みを読み直す">↻ 最新にする</button>
    <span id="who"></span>
  </span>
</header>

<div id="signin" class="center" hidden>
  <p>会社の Microsoft アカウントでサインインしてください。</p>
  <button id="bSignIn">サインイン</button>
  <p id="signinMsg" class="ng"></p>
</div>

<div id="loading" class="center" hidden>読み込み中…</div>

<main id="pChart" hidden>
  <div id="help" class="help">
    バーをつかんで横に動かす／バーの端で期間を延ばす・縮める／空いている所を横になぞると新しいバー／バーを押すと中身を直せます。
    現場名を押すと現場の設定（段の追加・並べ替え）。
  </div>
  <div id="wrap"><div id="chart"></div></div>
</main>

<main id="pFlow" hidden>
  <div class="help">社員がどの日にどの現場にいるか、作業員が日ごとに何人要るかを、工程表のバーから自動で出します。
    <b class="ngb">赤</b>＝同じ日に2つ以上の現場に入っている。マスを押すとその工程を開きます。</div>
  <div id="flow"></div>
</main>

<main id="pList" hidden>
  <div class="listbar">
    <label><input type="checkbox" id="inListRange" checked> 表示中の期間にかかるものだけ</label>
    <input type="search" id="inListQ" placeholder="現場・作業・社員で絞る">
  </div>
  <div id="list"></div>
</main>

<!-- バーの小窓 -->
<dialog id="dBar">
  <form method="dialog" id="fBar">
    <h3 id="dBarTtl">工程</h3>
    <div class="frm">
      <label>現場</label><div id="dBarSite"></div>
      <label for="bLane">段</label><select id="bLane"></select>
      <label for="bWork">作業</label><input type="text" id="bWork" placeholder="例：布設工">
      <label for="bFrom">開始</label><input type="date" id="bFrom" required>
      <label for="bTo">終了</label><input type="date" id="bTo" required>
      <label for="bStaff">社員</label><input type="text" id="bStaff" list="staffList" placeholder="複数は「、」で区切る">
      <label for="bNum">作業員</label><span><input type="text" id="bNum" inputmode="numeric" class="num"> 名</span>
      <label>色</label><div id="bColors" class="colors"></div>
      <label for="bMemo">メモ</label><textarea id="bMemo" rows="2"></textarea>
    </div>
    <div class="who" id="dBarWho"></div>
    <div class="btns">
      <button type="button" id="bBarDel" class="danger">削除</button>
      <button type="button" id="bBarCopy" class="sub" title="同じ中身で、終わった次の日から同じ日数のバーを作る">続きを作る</button>
      <span class="sp"></span>
      <button type="button" id="bBarCancel" class="sub">やめる</button>
      <button type="submit" id="bBarOk">保存</button>
    </div>
  </form>
</dialog>

<!-- 現場の小窓 -->
<dialog id="dSite">
  <form method="dialog" id="fSite">
    <h3 id="dSiteTtl">現場</h3>
    <div class="frm">
      <label for="sName">現場名</label><input type="text" id="sName" required>
      <label for="sShort">略称</label><input type="text" id="sShort" placeholder="人の流れの表に出す短い名前（例：浄明寺）">
      <label for="sCode">現場コード</label><input type="text" id="sCode" inputmode="numeric" class="num" placeholder="例：510015">
      <label for="sTanto">担当</label><input type="text" id="sTanto" list="staffList">
      <label>段</label>
      <div>
        <div id="sLanes"></div>
        <button type="button" id="bLaneAdd" class="sub small">＋ 段を足す</button>
        <div class="note">段は工程表の1行です（例：昼間・夜間・25t夜間）。バーのある段は消せません。</div>
      </div>
      <label>並び</label>
      <div><button type="button" id="bSiteUp" class="sub small">▲ 上へ</button> <button type="button" id="bSiteDown" class="sub small">▼ 下へ</button></div>
    </div>
    <div class="btns">
      <button type="button" id="bSiteDel" class="danger">現場を消す</button>
      <span class="sp"></span>
      <button type="button" id="bSiteCancel" class="sub">やめる</button>
      <button type="submit">保存</button>
    </div>
  </form>
</dialog>

<datalist id="staffList"></datalist>
<div id="toast"></div>

<script src="lib/msal-browser.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>

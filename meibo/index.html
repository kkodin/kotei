<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名簿</title>
<link rel="icon" href="../nippou/icon-192.png">
<link rel="stylesheet" href="app.css?v=202611172013">
</head>
<body>
<header id="bar">
  <b class="ttl">名簿</b>
  <nav data-hx-apps class="apps" title="ほかのアプリ（同じ窓で開きます）"></nav>
  <span class="right">
    <span id="who" class="ver"></span>
    <span class="ver">名簿 11/17 20:13</span>
  </span>
</header>

<section id="signin" class="signin" hidden>
  <p id="signinMsg">会社の Microsoft アカウントでサインインしてください。</p>
  <button id="bSignIn" type="button" class="pri">サインイン</button>
</section>

<main id="app" hidden>
  <div class="tools">
    <div class="tabs" id="tabs">
      <button type="button" data-f="all" class="on">全員</button>
      <button type="button" data-f="社員">社員</button>
      <button type="button" data-f="従業員">従業員</button>
      <button type="button" data-f="外注">外注</button>
      <button type="button" data-f="fix">直した・足した</button>
      <button type="button" data-f="out">辞めた・外した</button>
    </div>
    <input id="q" type="search" placeholder="名前・ふりがな・会社で探す" autocomplete="off">
    <button id="bAdd" type="button" class="pri">＋ 人を足す</button>
  </div>
  <div id="diffs" class="diffs" hidden></div>
  <p id="info" class="info"></p>
  <div class="tblwrap"><table id="tbl"><thead><tr><th>名前</th><th>ふりがな</th><th>区分</th><th>会社</th><th>職種</th><th>最後の月</th><th>元</th></tr></thead><tbody></tbody></table></div>
</main>

<dialog id="dlg"><form method="dialog" id="dlgBody"></form></dialog>
<div id="toast" class="toast" hidden></div>

<!-- 共通の部品（設定・サインイン・読み書き・アプリの行き来・マスタ） -->
<script src="../common/lib/msal-browser.min.js"></script>
<script src="../common/config.js?v=202611172013"></script>
<script src="../common/auth.js?v=202611172013"></script>
<script src="../common/store.js?v=202611172013"></script>
<script src="../common/apps.js?v=202611172013"></script>
<script src="../common/master.js?v=202611172013"></script>
<script src="app.js?v=202611172013"></script>
</body>
</html>
